<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recherche - Service de démonstration</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; font-size: 1rem; line-height: 1.5; color: #1e1e1e; background: #ffffff; }
      a { color: #000091; }
      a:focus, button:focus, input:focus, select:focus, textarea:focus { outline: 3px solid #000091; outline-offset: 2px; }
      header, main, footer { padding: 1rem 2rem; }
      header { border-bottom: 1px solid #666666; }
      footer { border-top: 1px solid #666666; }
      nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: 1rem; padding: 0; margin: 0; }
      .skip { position: absolute; left: -9999px; }
      .skip:focus { left: 1rem; top: 1rem; background: #ffffff; padding: 0.5rem; }
      button { font: inherit; color: #ffffff; background: #000091; border: 0; padding: 0.5rem 1rem; }
      label { display: block; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <a class="skip" href="#contenu">Aller au contenu</a>
    <header role="banner">
      <p><a href="/">Service de démonstration</a></p>
      <nav role="navigation" aria-label="Menu principal">
        <ul>
          <li><a href="/">Accueil</a></li>
          <li><a href="/aide">Aide</a></li>
          <li><a href="/documents">Documents</a></li>
          <li><a href="/recherche">Recherche</a></li>
          <li><a href="/contact">Contact</a></li>
          <li><a href="/connexion">Se connecter</a></li>
        </ul>
      </nav>
    </header>
    <main id="contenu" role="main">
      <h1>Rechercher</h1>
      <form action="/recherche" method="get" role="search">
        <label for="q">Rechercher sur le site</label>
        <input type="search" id="q" name="q">
        <button type="submit">Rechercher</button>
      </form>
      <h2>Résultats</h2>
      <p>Aucun résultat pour cette recherche.</p>
    </main>
    <footer role="contentinfo">
      <nav aria-label="Liens de bas de page">
        <ul>
          <li><a href="/mentions-legales">Mentions légales</a></li>
          <li><a href="/accessibilite">Accessibilité : partiellement conforme</a></li>
          <li><a href="/plan-du-site">Plan du site</a></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
