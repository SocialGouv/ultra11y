<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Avis du CSE — Egapro</title></head>
<body>
<main>
  <h1>Transmission de l'avis du CSE</h1>
  <!-- egapro#4919: the hidden file input's aria-label replaces the visible label -->
  <div><label class="fr-label" for="cse-file-upload">Veuillez importer/déposer le ou les avis émis par votre CSE et renseigner le type d'avis correspondant.<span class="fr-hint-text">Taille maximale : 10 Mo par fichier. Format supporté : pdf.</span></label></div>
  <section aria-label="Zone de dépôt de fichier">
    <button type="button">Sélectionner un fichier</button>
  </section>
  <input accept=".pdf" aria-label="Sélectionner des fichiers" class="fr-sr-only" id="cse-file-upload" tabindex="-1" type="file" name="cse-file-upload">
</main>
</body>
</html>
