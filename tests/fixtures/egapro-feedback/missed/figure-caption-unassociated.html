<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Statistiques — Egapro</title></head>
<body>
<main>
  <h1>Statistiques d'usage</h1>
  <!-- egapro#4921: a Matomo chart in a <figure> with an sr-only <figcaption>, no role, no aria-label -->
  <figure class="chartWrapper">
    <figcaption class="fr-sr-only">Clics sur les liens d'aide. Les données équivalentes sont disponibles dans le tableau ci-dessous.</figcaption>
    <div aria-label="Clics sur les liens d'aide" class="chartContainer" role="img"></div>
  </figure>
</main>
</body>
