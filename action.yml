name: ultra11y accessibility audit
description: Audit a pull request for accessibility (WCAG 2.2 AA, RGAA…) at the level of the CODE and, optionally, page by page — with inline annotations, a job summary and a sticky PR comment.
author: maxgfr

branding:
  icon: eye
  color: purple

inputs:
  paths:
    description: 'Files/globs to audit. Ignored in diff mode (see `since`).'
    required: false
    default: '.'
  standard:
    description: 'Country standard to report against (e.g. `rgaa`). Default `wcag` (the engine core).'
    required: false
    default: 'wcag'
  fail-on:
    description: 'Severity at which the job fails: blocking | major | minor. Empty = never fail (report only).'
    required: false
    default: 'blocking'
  since:
    description: 'Audit only the diff against this ref (e.g. `origin/main`). Empty = audit `paths` in full. On a pull_request, `auto` resolves to the base branch.'
    required: false
    default: 'auto'
  baseline:
    description: 'Committed baseline JSON. When set, only NEW non-conformities can fail the job — the existing backlog never blocks.'
    required: false
    default: ''
  jsx:
    description: 'Force JSX/TSX parsing for inputs of any extension.'
    required: false
    default: 'false'
  graph:
    description: 'Resolve imports and run the cross-file rules.'
    required: false
    default: 'false'
  urls:
    description: 'Space-separated URLs to scan with a real browser (computed contrast, focus, zoom, reflow). Needs the app running (see `start`/`wait-on`); the browser tier itself is provided for you by default — see `browser`, which installs Playwright + a Chromium binary unless your repository already pins its own (or you force `runtime: docker`). Leave empty to audit the code only.'
    required: false
    default: ''
  sample:
    description: 'Scan the normative page sample declared in .ultra11yrc.json instead of `urls`. Same browser-tier requirement as `urls`.'
    required: false
    default: 'false'
  sitemap:
    description: 'Sitemap URL to take the page list from, instead of `urls`. Same browser-tier requirement.'
    required: false
    default: ''
  crawl:
    description: 'Entry URL to crawl for same-origin pages, instead of `urls`. A client-rendered SPA does not expose its routes in the served HTML — use `sitemap` there.'
    required: false
    default: ''
  crawl-depth:
    description: 'Link hops to follow from `crawl`. `0` (the default) follows them all. The crawl terminates on its own invariants rather than on this number: it never leaves the origin, and every URL is de-duplicated by its canonical form, so a cycle is visited once.'
    required: false
    default: '0'
  crawl-max:
    description: 'Cap on the number of pages taken from `sitemap`/`crawl`. `0` (the default) means no cap — a sweep that stopped at 20 produced a report merely SHORTER than the site, and a shorter deliverable reads exactly like a complete one. Set a number when the runner budget matters more than coverage: a large site is unbounded runner time and an unbounded artifact, and `evidence-max` guards only the crops. Every page reached is logged with its running count, so an unbounded crawl is never a job that merely looks hung.'
    required: false
    default: '0'
  runtime:
    description: 'Browser tier for the page scan: `auto` (default — Playwright + @axe-core/playwright, the repo''s own when it has them and ultra11y''s otherwise, provided a browser binary is on disk; else a Docker image), `local`, or `docker`. Worth setting explicitly when the scan MUST have the local tier: an authenticated scan (`storage-state`, or a `storageState` on a sample page) is local-only, and on `auto` a runner with no Chromium binary silently degrades to Docker, which then refuses the run.'
    required: false
    default: 'auto'
  browser:
    description: 'Whether this action PROVIDES the browser tier the scan needs: `auto` (default) installs `@playwright/test` + `@axe-core/playwright` and a Chromium binary into the runner temp directory, but ONLY when the working directory does not already resolve them; `install` always installs; `off` never does. This exists because the tier does not travel with the action: `scan --runtime local` resolves Playwright from the audited project first and from ultra11y''s own install second, and consumed as `uses: maxgfr/ultra11y@vN` that second anchor is a checkout with no node_modules beside it. So a repository that does not pin Playwright itself got no local tier, degraded to Docker, and silently lost every rendering criterion — contrast, zoom, reflow, text spacing. `auto` leaves a project that pins its own alone, deliberately: two copies of Playwright in one process hand out `Page` objects the other one''s fixtures do not recognise. Costs ~30-60s on a cold runner; the Chromium download is cacheable with actions/cache on `~/.cache/ms-playwright`.'
    required: false
    default: 'auto'
  storage-state:
    description: 'Playwright storageState JSON for an AUTHENTICATED scan — the session most real page samples need, since the pages worth auditing usually sit behind a login. Produce it in the job (a Playwright setup project, `browser_context.storage_state()`, …) and pass the path. A per-page `storageState` in `.ultra11yrc.json` overrides this one, so a sample can mix public and signed-in pages in one run. The path is handed to Playwright and never read by the engine.'
    required: false
    default: ''
  interact-clicks:
    description: 'Let the live-region probe click buttons during an AUTHENTICATED scan. Off by default there — with a session loaded a click can trigger a server mutation — and always on without `storage-state`. Buttons whose name reads destructive are never clicked either way.'
    required: false
    default: 'false'
  snapshot:
    description: 'Persist every scanned page to .ultra11y/pages/<id>/ and fold it into the audit. This is what lets a page be conforming at all — without a snapshot its criteria can only ever be "to assess". Set false to scan without recording.'
    required: false
    default: 'true'
  pages-report:
    description: 'Also write the per-page report (one sheet per page, with its screenshot) into the uploaded artifact.'
    required: false
    default: 'true'
  start:
    description: 'Command that starts the app before scanning (run in the background). Only used when `urls` or `sample` is set.'
    required: false
    default: ''
  wait-on:
    description: 'URL to poll until it answers, after `start`. Gives up after `wait-timeout` seconds.'
    required: false
    default: ''
  wait-timeout:
    description: 'Seconds to wait for `wait-on`.'
    required: false
    default: '60'
  sarif:
    description: 'Upload SARIF to GitHub code scanning, so findings appear inline on the diff. Needs `security-events: write`; silently skipped without it.'
    required: false
    default: 'true'
  annotations:
    description: 'Emit ::error:: workflow annotations. Works on every plan — the fallback when code scanning is unavailable.'
    required: false
    default: 'true'
  comment:
    description: 'Post a sticky comment on the pull request (edited in place on each run). Needs `pull-requests: write`.'
    required: false
    default: 'false'
  comment-kind:
    description: 'WHICH document the comment carries: `digest` (default) names the distinct defects of the code audit; `pages` posts the page-by-page grid — one row per page with its rate and severities, then the non-conforming criteria of each failing page; `full` posts ONE comment carrying both — the page-by-page grid AND the distinct defects with their locations — for a run that wants a single comment at the end with everything in it. Each kind has its OWN sticky marker, so a workflow whose code gate and page sweep both comment on one pull request keeps both comments instead of the second overwriting the first, and turning `full` on never adopts or overwrites a sticky the other two already placed. `pages` and `full` need pages in scope (a scan, a snapshot sweep) — with none they say so rather than posting an empty scoreboard.'
    required: false
    default: 'digest'
  report:
    description: 'Also write the Markdown report and upload it as an artifact.'
    required: false
    default: 'true'
  html:
    description: 'Also render the report as HTML, so the artifact has a front door: `index.html` (dashboard, opens instantly) plus a detachable single file that prints to PDF. Self-contained — no script, no external asset, nothing pointing outside the artifact.'
    required: false
    default: 'true'
  evidence:
    description: 'Illustrate each non-conformity with an annotated crop of the offending element, derived from the page snapshot. Needs snapshots (`snapshot: true`, the E2E plugins, or a `scan` that captured them); without them the report says per page and per criterion what it could not draw, and why.'
    required: false
    default: 'true'
  evidence-max:
    description: 'Hard cap on the number of crops produced in one run. Guards the artifact size when one design-system defect repeats across every route. The per-rule (6) and per-page (12) de-duplication limits are fixed: they are what makes ONE picture stand for a repeated defect, and every occurrence they fold away is counted and named in the report.'
    required: false
    default: '200'
  inline-budget:
    description: 'Bytes of image data the single-file composite may carry inline. Above it, images degrade one rung at a time — page screenshots first, then all but one crop per criterion — and every rung is announced in the document. Non-conformities never degrade. Empty leaves the engine default (12 MB).'
    required: false
    default: ''
  artifact-name:
    description: 'Name of the uploaded artifact. Defaults to `ultra11y-<standard>`. Artifact names must be UNIQUE within a workflow run, so set this when the action runs more than once in one job (e.g. the code diff and then the served pages) — otherwise the second upload fails with a 409.'
    required: false
    default: ''
  report-artifact:
    description: 'Name the comment and the job summary should send a reader to for the full report. Defaults to the artifact this action uploads. Set it when a LATER job merges several runs of this action into one deliverable (`actions/upload-artifact/merge` with `delete-merged`): the part this run uploaded no longer exists by the time anyone clicks the link, so a comment naming it sends the reader to nothing. This changes only what the comment SAYS — the upload still happens under `artifact-name`, which must stay unique within the workflow run.'
    required: false
    default: ''
  artifact-retention-days:
    description: 'How long GitHub keeps the uploaded artifact. Empty (default) follows the repository setting.'
    required: false
    default: ''
  lang:
    description: 'Report language: auto | en | fr.'
    required: false
    default: 'auto'
  tickets:
    description: 'File the audit as tracker tickets: github | gitlab | jira. Empty (default) files nothing. Needs `issues: write` for GitHub; a GITLAB_TOKEN / Jira credentials in env for the others (see references/tickets.md). De-dupe is by exact title, so re-running never duplicates.'
    required: false
    default: ''
  tickets-grain:
    description: 'What ONE ticket is: criterion | page | page-criterion | single | file.'
    required: false
    default: 'criterion'
  tickets-max:
    description: 'Refuse to file more than this many tickets in one run. The step fails rather than flooding the tracker.'
    required: false
    default: '200'
  tickets-dry-run:
    description: 'Print the ticket plan without creating anything. Use it on a pull request, and file for real only on the default branch.'
    required: false
    default: 'false'
  ledger:
    description: 'Path to a committed VERDICT LEDGER (default `.ultra11y/verdicts/<standard>.json` when set to `true`; empty disables it). Adjudicated verdicts are recorded there and REPLAYED on later runs with no model in the loop, which is what lets a CI job publish a complete criterion grid for free. The replay is a re-verification, not a cache hit: every verdict goes back through the same gate, over evidence re-derived from the audit in front of it, and one whose evidence has since changed is dropped as stale with the criterion saying so. Combine with `adjudicate` to refresh what the ledger does not cover — the replay runs first, so the model is only ever asked about the remainder.'
    required: false
    default: ''
  adjudicate:
    description: 'Rule on the judgment criteria the static engine cannot decide (alt relevance, link purpose in context, reading order): `api` sends the worklist to the Anthropic API in batches, `agent` hands it to a Claude Code run, `none` (default) leaves them « to assess ». Both modes read their credential from the JOB environment, never from an input, and skip themselves when it is absent — which is what makes them harmless on a fork pull request. `api` needs ANTHROPIC_API_KEY (the Messages API takes nothing else); `agent` accepts ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN, the token a Pro/Max subscriber mints with `claude setup-token`. `agent` also skips itself on an event claude-code-action does not support — `push` above all. Pair it with `ledger` so each run records what it paid for.'
    required: false
    default: 'none'
  adjudicate-runner:
    description: "WHO drives the agent tier. `action` (default) is the three `anthropics/claude-code-action` steps below — unchanged, and still what an existing consumer gets. `cli` has the ENGINE spawn a headless `claude -p` per batch and fold the verdicts itself, which is the same tier reachable from anywhere a shell is: this action, a GitLab CI, a cron, a laptop. It also lifts the event restriction — claude-code-action parses the event context before it reads the prompt and refuses what it does not know, `push` above all, which is the event an accessibility gate actually fires on. The CLI is installed into a scratch prefix by the step, never into your tree; the engine itself still installs nothing."
    required: false
    default: "action"
  adjudicate-grain:
    description: "How much the model is asked to rule on at once. `worklist` (default) sends batches of 8 criteria; `criterion` sends one. One call per criterion costs more calls and buys two things: the model sees one criterion's evidence instead of eight competing for its attention, and a run that stops early loses at most ONE criterion instead of everything it had already ruled on. Needs `adjudicate-runner: cli` on the agent tier — a composite action cannot loop over a `uses:` step, so the claude-code-action passes are unrolled by hand and there is no syntax that repeats one per criterion."
    required: false
    default: "worklist"
  adjudicate-budget-usd:
    description: "Dollar ceiling handed to each `adjudicate-runner: cli` invocation. Empty leaves it unbounded and lets the wall clock be the only stop. This is the bound to reach for rather than `adjudicate-max-turns`, which the CLI runner ignores: `--max-turns` is not one of its flags, and the CLI swallows an unknown flag without a word, so a turn budget there would look like a ceiling and be nothing at all."
    required: false
    default: ""
  adjudicate-passes:
    description: 'How many times `adjudicate: agent` may go round. Each pass re-derives the worklist from what is STILL undecided — a criterion the previous pass never reached, or whose verdict the gate refused — so a second pass only ever costs the residue, and a run that decided everything stops on its own. Default 1 (one pass, the historical behaviour). Raise it when completeness matters more than the bill: measured on a real run, an adjudicator stopped after 22 turns of a 228 budget with 42 criteria still `null`, and a single pass had no way to come back to them. Capped at 3.'
    required: false
    default: '1'
  adjudicate-max-turns:
    description: 'Turn budget for `adjudicate: agent`. Empty derives it from the worklist (4 turns per item plus 40, floored at 60). A number pins it. `unlimited` (or 0) drops the flag, which is what claude-code-action treats as no bound at all — the job then runs until its own `timeout-minutes`, and never past GitHub''s hard 6h ceiling on a hosted runner. Prefer `adjudicate-passes` to an unbounded run: the fold is per-verdict, so a run that ran out of budget keeps everything it decided and the next pass takes the residue, whereas a job killed on time produces nothing, the fold never having run.'
    required: false
    default: ''
  adjudicate-model:
    description: 'Model id for BOTH adjudication tiers. `api` passes it to the Messages call; `agent` passes it to claude-code-action, which is how an agent run picks a cheaper model than the harness default — a full RGAA worklist is ~90 items and the tier is billed per item. Empty follows $ULTRA11Y_LLM_MODEL for the API tier, then each tier''s own default.'
    required: false
    default: ''
  adjudicate-effort:
    description: "Reasoning effort for the `agent` tier — `low`, `medium`, `high`, `xhigh` or `max`. Empty leaves the harness default. This is the lever that is NOT the model: what reaches this tier is what no engine could decide (alt relevance, link purpose in context, reading order), so how hard the model is asked to think moves verdicts without moving the bill to a bigger tier. Applies to both runners — `action` passes `--effort` through `claude_args`, `cli` through the engine. The value is validated rather than forwarded: this CLI swallows an unrecognised value the way it swallows an unrecognised flag, so a typo would read as a setting and be nothing at all."
    required: false
    default: ''
  gate-adjudicated:
    description: 'Gate on the ADJUDICATED audit instead of re-auditing the source, so a model-ruled non-conformity can fail the job. The trade is real: the red/green stops being reproducible run to run. Ignored when `adjudicate` is `none`.'
    required: false
    default: 'false'
  require-sample:
    description: 'Fail the job while a page DECLARED in `.ultra11yrc.json` produced no capture. COVERAGE, one level below `require-decided`: that one asks whether every criterion carries a verdict, this one asks whether the run looked at every page it says it audits. A sweep that loses pages produces a report that is merely SHORTER, and a shorter deliverable reads exactly like a complete one — measured on a real run, a hung probe took fifteen of thirty-five pages with it and the report shipped green, naming none of them. Only meaningful when the pages come from a sweep or a scan; a repository that declares no sample has nothing to answer and passes.'
    required: false
    default: 'false'
  require-decided:
    description: 'Fail the job while ANY criterion of the active standard is still « to assess ». `false` (default) never fails; `true` holds the RUN''s grid to it; `pages` also holds EVERY page''s own grid to it. This is a different question from `fail-on`, which governs NON-CONFORMITIES: a run can find nothing wrong and still have decided almost nothing, and it reports success either way — measured on a real pull request, 94 of 106 criteria came back « à évaluer » in a green job, because an adjudication that lands nothing only warns. `pages` is the bar a page-by-page deliverable is actually judged on, and it is strictly higher: a criterion failing on one route is settled for the RUN and may still be nobody''s verdict on the routes it never fired on — measured on the same repository, 104/106 decided for the run and 8 to 11 open on each of its 37 pages. Turn this on once a ledger or an adjudication tier is in place, and pair it with `undecidable-file` for the criteria that genuinely cannot be decided.'
    required: false
    default: 'false'
  require-rendered:
    description: 'Fail the job while a criterion that NEEDS a rendered page is still « to assess » AND this run snapshotted no page at all. One level below `require-sample`: that one asks whether the run looked at every page it declares, this one asks whether the criteria that need a browser were given one. It asks about the INSTRUMENT, never about the answer — a run that rendered a page and still could not settle a criterion passes, because that is the honest residual this tool exists to preserve. Measured on a real keyed cascade: three passes, 311 turns and $24.90 to be told that seven criteria needed a rendered DOM, on a workflow that audited sources only and had snapshotted nothing. Pair it with `urls`/`crawl`/`sitemap`/`sample`, and with `undecidable-file` for the criteria you genuinely cannot render.'
    required: false
    default: 'false'
  undecidable-file:
    description: 'Path to the criteria this project declares it cannot decide — `{"entries":[{"criteriaId":"…","reason":"…"}]}`. Deliberately a NAMED list and not a tolerance: a percentage passes whatever it must to stay green, and what it hides is exactly the criteria nobody could decide. An entry with no reason fails the gate, and so does one whose criterion has since been decided — an exception must not outlive what it excused. Each declared criterion is printed in the job log with its reason.'
    required: false
    default: ''
  working-directory:
    description: 'Directory to run in.'
    required: false
    default: '.'

outputs:
  findings:
    description: 'Number of findings in the audit.'
    value: ${{ steps.audit.outputs.findings }}
  conformance:
    description: 'Automatic pass rate (percent).'
    value: ${{ steps.audit.outputs.conformance }}
  report-path:
    description: 'Path of the Markdown report, when `report` is enabled.'
    value: ${{ steps.report.outputs.path }}
  html-path:
    description: "Path of the artifact's HTML entry point, when `html` is enabled."
    value: ${{ steps.html.outputs.path }}
  html-single-path:
    description: 'Path of the detachable single-file HTML report (printable to PDF), when `html` is enabled.'
    value: ${{ steps.html.outputs.single-path }}
  # THE PAGE DIMENSION, published.
  #
  # Everything above is repo-global: two scalars and a set of paths. A per-page norm is
  # answered page by page, and a caller wanting a badge, a follow-up job or a dashboard had to
  # re-parse an artifact it cannot even address while the run is still in flight.
  #
  # The PATH is the contract for the grid, never the grid itself: a criterion × page matrix is
  # not a scalar, a step output is size-capped, and truncating one into an output would be a
  # silent lie about coverage — the exact failure mode this tool exists to prevent. The two
  # counts beside it are safe to publish because they cannot be misread.
  pages-json-path:
    description: 'Path of the machine-readable per-page grid (`{ pages: [{ id, name, url, basis, criteria: [{ id, status, decidedBy }], conformancePct, decided, total }], unattributed }`), when `pages-report` is enabled and a page was in scope. Empty otherwise.'
    value: ${{ steps.pages.outputs.json-path }}
  pages-report-path:
    description: 'Path of the per-page dossier directory (`index.md` plus one sheet per page, and their HTML mirrors when `html` is on). Empty when no page was in scope.'
    value: ${{ steps.pages.outputs.report-path }}
  pages-count:
    description: 'Number of pages in scope. `0` means nothing was scanned or snapshotted — which is a different statement from a clean sweep, and the two must not be read alike.'
    value: ${{ steps.pages.outputs.count }}
  pages-failing:
    description: 'Number of pages carrying at least one non-conforming criterion of the active standard. Never a pass rate: a page can be failing on one criterion and undecided on forty.'
    value: ${{ steps.pages.outputs.failing }}
  artifact-name:
    description: 'Name the report artifact was uploaded under — resolved, so a caller need not re-derive the default.'
    value: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('ultra11y-{0}', inputs.standard) }}
  artifact-id:
    description: 'Id of the uploaded artifact, from actions/upload-artifact. Empty when nothing was uploaded.'
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: 'Download URL of the uploaded artifact. Empty when nothing was uploaded.'
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    # The engine ships INSIDE this action (a single bundled .mjs, zero dependencies), so
    # there is nothing to install and no version to drift from the action's own.
    - name: Resolve the engine
      id: engine
      shell: bash
      # Read from the environment for the same reason the adjudication tier does: an input
      # reaches a reusable action from a caller's workflow, which is free to wire an event
      # payload into it.
      env:
        REQUIRE_DECIDED: ${{ inputs.require-decided }}
        ADJUDICATE_PASSES: ${{ inputs.adjudicate-passes }}
        ADJUDICATE_RUNNER: ${{ inputs.adjudicate-runner }}
        ADJUDICATE_GRAIN: ${{ inputs.adjudicate-grain }}
        REQUIRE_RENDERED: ${{ inputs.require-rendered }}
        COMMENT_KIND: ${{ inputs.comment-kind }}
      run: |
        echo "path=$GITHUB_ACTION_PATH/scripts/ultra11y.mjs" >> "$GITHUB_OUTPUT"
        node "$GITHUB_ACTION_PATH/scripts/ultra11y.mjs" --version

        # PREFLIGHT on the inputs whose gates compare them LITERALLY. For these, an
        # unrecognised value does not degrade to the default — the gate simply never matches,
        # and something downstream then draws a conclusion from the empty output it left
        # behind. Both of these were live:
        #
        #   require-decided: yes → `Completeness gate` matches 'true'|'pages' and so never
        #     ran; `steps.decided.outputs.ok` stayed empty; and `Gate`, which tested
        #     `!= 'false' && != ''`, failed the job with "the criterion grid is incomplete"
        #     over a grid nothing had measured. The two gates disagreed on what the input
        #     even is, and the caller was told the wrong thing about their own audit.
        #
        #   adjudicate-passes: 0 → passes 2 and 3 were gated on `!= '1'` and
        #     `!= '1' && != '2'`, so every value that was not literally 1 or 2 ran all three
        #     passes and billed a model for them — the exact opposite of what '0' asks for.
        #
        # Refusing here rather than warning: both inputs exist to make a run STRICTER, and a
        # misspelt strictness that quietly does nothing is the failure mode they were added
        # to remove.
        case "${REQUIRE_DECIDED:-}" in
          true|false|pages|'') ;;
          *)
            echo "::error::ultra11y: require-decided='${REQUIRE_DECIDED}' is not a value — expected 'true' (the run's grid), 'pages' (every page's grid) or 'false'."
            exit 1
            ;;
        esac
        case "${ADJUDICATE_PASSES:-}" in
          1|2|3|'') ;;
          *)
            echo "::error::ultra11y: adjudicate-passes='${ADJUDICATE_PASSES}' is not a count — expected 1, 2 or 3."
            exit 1
            ;;
        esac
        case "${ADJUDICATE_RUNNER:-}" in
          action|cli|'') ;;
          *)
            echo "::error::ultra11y: adjudicate-runner='${ADJUDICATE_RUNNER}' is not a runner — expected 'action' (claude-code-action, the default) or 'cli' (the engine spawns a headless Claude Code process)."
            exit 1
            ;;
        esac
        case "${ADJUDICATE_GRAIN:-}" in
          worklist|criterion|'') ;;
          *)
            echo "::error::ultra11y: adjudicate-grain='${ADJUDICATE_GRAIN}' is not a grain — expected 'worklist' (batches of 8) or 'criterion' (one call per criterion)."
            exit 1
            ;;
        esac
        # THE COMBINATION THAT CANNOT WORK, refused here and nowhere else. Silently ignoring
        # the grain would be the same failure the two cases above exist to remove: a caller
        # asks for something stricter and is told nothing when it does not happen.
        if [ "${ADJUDICATE_GRAIN:-worklist}" = 'criterion' ] && [ "${ADJUDICATE_RUNNER:-action}" = 'action' ]; then
          echo "::error::ultra11y: adjudicate-grain='criterion' needs adjudicate-runner='cli'. A composite action cannot loop over a \`uses:\` step — the three claude-code-action passes below are unrolled by hand, and no syntax repeats one per criterion. Set adjudicate-runner: cli, or keep adjudicate-grain: worklist."
          exit 1
        fi
        # Same family, same reason: `require-rendered` is compared literally against 'true' by
        # its own step AND by the final gate, so `yes` would run neither and the caller would
        # be told nothing at all about a strictness they asked for.
        case "${REQUIRE_RENDERED:-}" in
          true|false|'') ;;
          *)
            echo "::error::ultra11y: require-rendered='${REQUIRE_RENDERED}' is not a value — expected 'true' or 'false'."
            exit 1
            ;;
        esac
        # And the comment kind, which the engine reads as a plain string: an unrecognised value
        # degrades to the digest, so a caller asking for `full` and typing `ful` would get the
        # code digest and never know the page grid was missing.
        case "${COMMENT_KIND:-}" in
          digest|pages|full|'') ;;
          *)
            echo "::error::ultra11y: comment-kind='${COMMENT_KIND}' is not a kind — expected 'digest', 'pages' or 'full'."
            exit 1
            ;;
        esac

    - name: Start the application
      if: inputs.start != '' && (inputs.urls != '' || inputs.sample == 'true' || inputs.sitemap != '' || inputs.crawl != '')
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        nohup ${{ inputs.start }} > /tmp/ultra11y-app.log 2>&1 &
        echo "ultra11y: started the app (logs: /tmp/ultra11y-app.log)"

    - name: Wait for the application
      if: inputs.wait-on != '' && (inputs.urls != '' || inputs.sample == 'true' || inputs.sitemap != '' || inputs.crawl != '')
      shell: bash
      run: |
        deadline=$(( SECONDS + ${{ inputs.wait-timeout }} ))
        until curl -sSf -o /dev/null "${{ inputs.wait-on }}"; do
          if [ $SECONDS -ge $deadline ]; then
            echo "::error::ultra11y: ${{ inputs.wait-on }} did not answer within ${{ inputs.wait-timeout }}s"
            tail -50 /tmp/ultra11y-app.log || true
            exit 1
          fi
          sleep 2
        done
        echo "ultra11y: ${{ inputs.wait-on }} is up"

    # The STATIC audit — the code-level half. Always runs.
    - name: Audit the code
      id: audit
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
      run: |
        # NOTE: GitHub runs `shell: bash` with -e, so every conditional here is an `if`
        # block. A `[ cond ] && cmd` one-liner whose condition is FALSE returns 1 and would
        # abort the step — the flag would not merely be skipped, the whole job would die.
        args=()
        since='${{ inputs.since }}'
        if [ "$since" = "auto" ]; then
          if [ -n "${GITHUB_BASE_REF:-}" ]; then since="origin/$GITHUB_BASE_REF"; else since=""; fi
        fi
        if [ -n "$since" ]; then args+=(--since "$since"); else args+=(${{ inputs.paths }}); fi
        if [ '${{ inputs.jsx }}' = 'true' ]; then args+=(--jsx); fi
        if [ '${{ inputs.graph }}' = 'true' ]; then args+=(--graph); fi
        if [ -n '${{ inputs.baseline }}' ]; then args+=(--baseline '${{ inputs.baseline }}'); fi
        mkdir -p audits
        # Always produce the full audit first; gating happens at the end, so every
        # surface (SARIF, annotations, comment, report) is emitted even on a failing run.
        #
        # `--standard` here, and not only on the renderings downstream: selecting a standard
        # re-keys the DOCUMENT, so `audits/audit-latest.json` — the artifact this job uploads
        # and consumers read — carries that standard's criteria, its themes and its findings,
        # with the WCAG core inside `core` for the pipeline. Without it the uploaded artifact
        # spoke WCAG while every rendering beside it spoke RGAA.
        args+=(--standard '${{ inputs.standard }}')
        node "$ENGINE" audit "${args[@]}" --out audits --json > /dev/null
        node -e '
          const a = require("fs").readFileSync("audits/audit-latest.json", "utf8");
          const j = JSON.parse(a);
          const out = require("fs");
          out.appendFileSync(process.env.GITHUB_OUTPUT, "findings=" + j.findings.length + "\n");
          out.appendFileSync(process.env.GITHUB_OUTPUT, "conformance=" + j.conformancePct + "\n");
        '

    # The PAGE-level half — a real browser over the served app. Optional.
    #
    # Every scanned page is also PERSISTED as a snapshot unless `snapshot: false`. That is not
    # a nicety: a page known only by its URL cannot earn a conforming verdict (the static
    # rules never ran against its DOM), so without it the per-page grid is almost empty.
    # THE BROWSER TIER DOES NOT TRAVEL WITH THE ACTION, and that was a silent hole.
    #
    # `scan --runtime local` resolves `@playwright/test` + `@axe-core/playwright` from the
    # audited project first and from ultra11y's own install second (src/scan-local.ts
    # `resolveAnchors`). Consumed as `uses: maxgfr/ultra11y@vN`, that second anchor is
    # `$GITHUB_ACTION_PATH/scripts/ultra11y.mjs` — a checkout with NO node_modules beside it.
    # So a consumer who simply wrote `crawl: http://localhost:3000` resolved nothing, degraded
    # to Docker, and lost every rendering criterion — while the `urls` input promised them "a
    # Chromium binary for the Playwright that ships with ultra11y".
    #
    # It asks the ENGINE whether it needs to act (`status --browser`), which is the very
    # function `scan` will act on. Re-deriving "does Playwright resolve?" in shell would be a
    # second answer, and it would eventually disagree with the command it exists to serve.
    - name: Provide the browser tier
      id: browsertier
      if: (inputs.urls != '' || inputs.sample == 'true' || inputs.sitemap != '' || inputs.crawl != '') && inputs.browser != 'off' && inputs.runtime != 'docker'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
        MODE: ${{ inputs.browser }}
      run: |
        echo "cwd=" >> "$GITHUB_OUTPUT"

        # A project that pins its OWN Playwright keeps it, and that is not politeness: two
        # copies in one process hand out `Page` objects the other one's fixtures do not
        # recognise. `install` skips the question and always builds a tier.
        if [ "$MODE" != 'install' ]; then
          if node "$ENGINE" status --browser --cwd . --json | node -e 'process.exit(JSON.parse(require("fs").readFileSync(0,"utf8")).browser.ok ? 0 : 1)'; then
            echo "ultra11y: the working directory already resolves the browser tier — leaving it alone."
            exit 0
          fi
        fi

        # PINNED TO THE ACTION'S OWN MANIFEST. `playwright install` downloads the browsers a
        # given Playwright version expects; a floating package spec would fetch one version's
        # package and another's binaries.
        pw=$(node -p "require('$GITHUB_ACTION_PATH/package.json').dependencies['@playwright/test']")
        axe=$(node -p "require('$GITHUB_ACTION_PATH/package.json').dependencies['@axe-core/playwright']")
        prefix="$RUNNER_TEMP/ultra11y-browser"
        mkdir -p "$prefix"

        # A FRESH PREFIX, never the audited repository. Installing a named package while
        # omitting dev dependencies installs NOTHING when that package is already declared in
        # the target's own devDependencies — npm answers "up to date" — which is exactly how
        # this repository's CI once ran with no tier at all and degraded to a Docker container
        # that could not reach the host. A directory that declares nothing cannot be hit by it.
        if ! npm i --no-save --prefix "$prefix" "@playwright/test@$pw" "@axe-core/playwright@$axe" >/dev/null 2>&1; then
          echo "::warning::ultra11y: could not install the browser tier — the scan falls back to whatever \`runtime\` resolves (Docker, or an explicit error)."
          exit 0
        fi
        if ! (cd "$prefix" && npx --no-install playwright install chromium) >/dev/null 2>&1; then
          echo "::warning::ultra11y: installed the packages but no Chromium binary — the scan falls back to whatever \`runtime\` resolves."
          exit 0
        fi

        # Never fatal, at any step above. A tier we could not build is a scan that degrades the
        # way it always did; failing the job here would turn a missing optional capability into
        # a red build for people who never asked for it.
        echo "cwd=$prefix" >> "$GITHUB_OUTPUT"
        echo "ultra11y: browser tier ready in $prefix (@playwright/test@$pw)."

    - name: Scan the pages
      if: inputs.urls != '' || inputs.sample == 'true' || inputs.sitemap != '' || inputs.crawl != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
        RUNTIME: ${{ inputs.runtime }}
        STORAGE_STATE: ${{ inputs.storage-state }}
        # Empty unless the step above actually built one — `--cwd` is the resolution anchor and
        # nothing else (snapshots keep going to the working directory), so pointing it at the
        # scratch prefix only changes WHERE Playwright is found.
        BROWSER_CWD: ${{ steps.browsertier.outputs.cwd }}
      run: |
        # `--standard` because this step REWRITES audits/audit-latest.json: merging without it
        # would silently re-key the document back to the core one step after `audit` selected
        # the standard, and every rendering downstream would then read a different artifact
        # from the one the job published.
        args=(--merge audits/audit-latest.json --out audits --standard '${{ inputs.standard }}')
        if [ -n "$BROWSER_CWD" ]; then args+=(--cwd "$BROWSER_CWD"); fi
        if [ '${{ inputs.snapshot }}' != 'true' ]; then args+=(--no-snapshot); fi
        # Read from the environment, never interpolated into the script — see the note on the
        # adjudication step: an input is caller-controlled data, and a quote in it would
        # otherwise escape into this shell.
        if [ "$RUNTIME" != 'auto' ]; then args+=(--runtime "$RUNTIME"); fi
        # An authenticated scan. The path is forwarded to Playwright as a path and never read
        # here, so a session file cannot end up in this log.
        if [ -n "$STORAGE_STATE" ]; then args+=(--storage-state "$STORAGE_STATE"); fi
        if [ '${{ inputs.interact-clicks }}' = 'true' ]; then args+=(--interact-clicks); fi
        if [ '${{ inputs.sample }}' = 'true' ]; then
          node "$ENGINE" scan --sample "${args[@]}"
        elif [ -n '${{ inputs.sitemap }}' ]; then
          node "$ENGINE" scan --sitemap '${{ inputs.sitemap }}' --max '${{ inputs.crawl-max }}' "${args[@]}"
        elif [ -n '${{ inputs.crawl }}' ]; then
          node "$ENGINE" scan --crawl '${{ inputs.crawl }}' --depth '${{ inputs.crawl-depth }}' --max '${{ inputs.crawl-max }}' "${args[@]}"
        else
          node "$ENGINE" scan ${{ inputs.urls }} "${args[@]}"
        fi

    # THE VERDICT LEDGER — the judgment criteria that were already ruled on, replayed for free.
    #
    # This is what makes a CI grid complete without a model. A ledger is a committed file of
    # verdicts, each carrying a fingerprint of the evidence it was ruled against; replaying it
    # runs every verdict back through the SAME gate the adjudication passes, over evidence
    # re-derived from the audit in front of it. So a stored verdict has to prove itself again on
    # each run, and one whose evidence has changed is dropped as stale with its criterion saying
    # exactly that — never silently carried forward.
    #
    # It runs BEFORE the adjudication tier for the same reason `scan` does: by the time a model
    # is asked anything, everything already decided is decided, so a paid pass only ever covers
    # the remainder. On a repository whose ledger is current, that remainder is empty and the
    # tier below costs nothing at all.
    - name: Replay the verdict ledger
      id: ledger
      if: inputs.ledger != '' && inputs.ledger != 'false'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
        LEDGER: ${{ inputs.ledger }}
        STANDARD: ${{ inputs.standard }}
      run: |
        set -euo pipefail
        path="$LEDGER"
        if [ "$path" = 'true' ]; then path=".ultra11y/verdicts/${STANDARD}.json"; fi
        if [ ! -f "$path" ]; then
          echo "::warning::ultra11y: no verdict ledger at $path — the judgment criteria stay to assess. Run an adjudication with \`ledger\` set to record one, then commit it."
          exit 0
        fi
        # Never fatal. A ledger the gate refuses leaves the criteria to assess, which is the
        # same place they would have been without one — it must not cost the whole audit.
        if node "$ENGINE" verify --apply "$path" --in audits/audit-latest.json --out audits --standard "$STANDARD"; then
          echo "ultra11y: replayed the verdict ledger from $path."
        else
          echo "::warning::ultra11y: the verdict ledger at $path was refused — the judgment criteria stay to assess."
        fi

    # THE ADJUDICATION TIER — the judgment criteria nothing has ruled on yet.
    #
    # Of the 55 WCAG 2.2 AA criteria, 38 are judgment calls and 14 need a rendered page. Inside
    # a coding agent those are adjudicated by the agent itself. In CI nobody rules on them, so
    # they stay « à évaluer » forever: honest, and an incomplete deliverable. These steps close
    # that gap — strictly opt-in. With `ledger` set, they also RECORD what they ruled, so the
    # next run replays it instead of paying again.
    #
    # They sit HERE, after `scan`, on purpose: the rendered tier has just decided the criteria
    # that need a browser, so the model is never asked to rule on computed contrast — it would
    # answer `needs-rendered-dom` and spend a batch saying nothing. And they sit BEFORE the
    # per-page report, SARIF, annotations, the PR comment, tickets and the report, all of
    # which read audits/audit-latest.json and so inherit the verdicts.
    #
    # The credential is read from the JOB environment, never from an input: a composite
    # action's steps inherit it, and a secret that never travels through an input is one
    # fewer secret to leak into a log.
    #
    # The two modes do NOT take the same credential, because they are not the same caller.
    # `api` runs `judge`, which speaks x-api-key to api.anthropic.com and has no OAuth
    # exchange — it needs ANTHROPIC_API_KEY and nothing else can stand in. `agent` shells out
    # to claude-code-action, which accepts either an API key or the OAuth token a Pro/Max
    # subscriber mints with `claude setup-token` — so a repository that has only
    # CLAUDE_CODE_OAUTH_TOKEN can still adjudicate, which is the common case for a team
    # already running Claude Code in CI.
    #
    # A missing credential is never an error: the tier evaporates with a ::warning:: and the
    # judgment criteria stay « à évaluer ». That is what keeps it harmless on a fork's pull
    # request, where secrets are not exposed.
    - name: Resolve the adjudication tier
      id: adjudication
      if: inputs.adjudicate != 'none'
      shell: bash
      # Through `env:`, not interpolated into the script. An input reaches a reusable action
      # from a caller's workflow, and a caller is free to wire an event payload into it —
      # `repository_dispatch` is on the very list this step checks. Expanded into a
      # single-quoted bash string, a value carrying a quote escapes into the shell; read from
      # the environment it is only ever data. Same reason `runtime` and `storage-state` do it.
      env:
        MODE: ${{ inputs.adjudicate }}
      run: |
        mode="$MODE"
        event='${{ github.event_name }}'

        # A typo'd mode used to reach the agent branch, report `on=true`, and then match no
        # downstream step at all — a tier that announced itself and did nothing.
        case "$mode" in
          api|agent) ;;
          *)
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ultra11y: adjudicate='$mode' is not a mode — expected 'api', 'agent' or 'none'. The judgment criteria stay to assess."
            exit 0
            ;;
        esac

        if [ "$mode" = 'api' ]; then
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "on=false" >> "$GITHUB_OUTPUT"
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::warning::ultra11y: adjudicate=api needs ANTHROPIC_API_KEY — the job has CLAUDE_CODE_OAUTH_TOKEN, which the Messages API does not accept. Use adjudicate=agent to rule with that token. The judgment criteria stay to assess."
          else
            echo "::warning::ultra11y: adjudicate=api but ANTHROPIC_API_KEY is absent from the job environment — the judgment criteria stay to assess. Secrets are not exposed to a fork's pull request, so this is the expected path there."
          fi
          exit 0
        fi

        # mode = agent.
        if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
          echo "on=false" >> "$GITHUB_OUTPUT"
          echo "::warning::ultra11y: adjudicate=agent but neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is in the job environment — the judgment criteria stay to assess. Secrets are not exposed to a fork's pull request, so this is the expected path there."
          exit 0
        fi

        # Mirrors the events claude-code-action@v1 accepts (src/github/context.ts). The `uses:`
        # pin floats within that major, so this list can fall behind upstream ADDING one —
        # `push` above all. Nothing would break: the tier would simply keep skipping an event
        # it could now run on. tests/action.test.ts ties the list to the pin so a bump shows it.
        #
        # claude-code-action parses the GitHub event context BEFORE it reads the prompt, and
        # throws `Unsupported event type: <event>` on anything outside this list — `push`
        # most of all, which is exactly what an accessibility gate runs on. Left unguarded,
        # turning this tier on would convert a green a11y job into a hard build failure that
        # says nothing about accessibility. Degrade like a missing key instead.
        case "$event" in
          pull_request|pull_request_target|pull_request_review|pull_request_review_comment|issues|issue_comment|workflow_dispatch|repository_dispatch|schedule|workflow_run)
            echo "on=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ultra11y: adjudicate=agent cannot run on the '$event' event — claude-code-action supports pull_request, pull_request_target, pull_request_review(_comment), issues, issue_comment, workflow_dispatch, repository_dispatch, schedule and workflow_run. The audit is unaffected; the judgment criteria stay to assess. Use adjudicate=api on this event, or move the tier to a pull_request/schedule job."
            ;;
        esac

    # MODE `api` — one Messages call per batch of 8 criteria. `judge` builds its own worklist,
    # renders it through the very formatter the agent reads, and folds the verdicts through
    # `applyAdjudication` unchanged: a model cannot assert a conformance the gate refuses.
    - name: Adjudicate with the API
      if: steps.adjudication.outputs.on == 'true' && inputs.adjudicate == 'api'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
      run: |
        args=(--in audits/audit-latest.json --out audits --apply)
        args+=(--standard '${{ inputs.standard }}' --lang '${{ inputs.lang }}')
        if [ -n '${{ inputs.adjudicate-model }}' ]; then args+=(--model '${{ inputs.adjudicate-model }}'); fi
        # Record what this pass paid for, so the next run replays it for free. Only ACCEPTED
        # verdicts are written — a refused one in the ledger would be laundered back in.
        if [ -n '${{ inputs.ledger }}' ] && [ '${{ inputs.ledger }}' != 'false' ]; then
          if [ '${{ inputs.ledger }}' = 'true' ]; then args+=(--ledger ".ultra11y/verdicts/${{ inputs.standard }}.json"); else args+=(--ledger '${{ inputs.ledger }}'); fi
        fi
        # An adjudication that fails is not an audit that fails. The fold is per-verdict, so a
        # rate-limited batch costs its own criteria and no others — absorb that and carry on
        # with what is still to assess, exactly as if the tier had been off. The one exception
        # is a caller who gated on these verdicts: there, staying quiet would gate on nothing.
        if node "$ENGINE" judge "${args[@]}"; then
          echo "ultra11y: adjudication applied."
        elif [ '${{ inputs.gate-adjudicated }}' = 'true' ]; then
          echo "::error::ultra11y: the adjudication failed and gate-adjudicated is on — refusing to gate on a partial adjudication."
          exit 1
        else
          echo "::warning::ultra11y: the adjudication failed — the judgment criteria stay to assess."
        fi

    # MODE `agent` — the same worklist, handed to a harness that can OPEN THE FILES. That is
    # the whole difference: `judge` rules from the harvested evidence alone (capped at 30
    # items per criterion, snippets truncated), while an agent can read the surrounding
    # source — which is exactly what "link purpose IN CONTEXT" asks for.
    #
    # `--eco` emits the sequential RUNBOOK + the dispatch contracts, not the *.workflow.mjs
    # fan-out: the latter needs the harness to expose a Workflow tool, which is not part of
    # claude-code-action's contract.
    # THE AGENT TIER, DRIVEN BY THE ENGINE — same tier, no GitHub in it.
    #
    # One step where the action path needs eleven, because `judge --apply` already derives the
    # worklist, calls the model, folds fail-closed and records the ledger. There is no turn
    # budget to derive (the CLI has no `--max-turns`, and it swallows unknown flags without a
    # word, so passing one would look like a bound and be nothing), no `$GITHUB_OUTPUT` to
    # thread between passes, and no three passes to unroll — `adjudicate-grain: criterion` IS
    # the fine granularity, and a retry is internal rather than another pass of this file.
    #
    # It carries no event allowlist either. That list exists only because claude-code-action
    # parses the event context before it reads the prompt; a local process does not, so this
    # runner works on `push` — the event an accessibility gate actually fires on, and the one
    # the action path has never been able to serve.
    - name: Adjudicate through the engine-driven CLI
      id: clirunner
      if: steps.adjudication.outputs.on == 'true' && inputs.adjudicate == 'agent' && inputs.adjudicate-runner == 'cli'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
        STANDARD: ${{ inputs.standard }}
        LANG_OPT: ${{ inputs.lang }}
        GRAIN: ${{ inputs.adjudicate-grain }}
        PASSES: ${{ inputs.adjudicate-passes }}
        MODEL: ${{ inputs.adjudicate-model }}
        EFFORT: ${{ inputs.adjudicate-effort }}
        BUDGET: ${{ inputs.adjudicate-budget-usd }}
        LEDGER: ${{ inputs.ledger }}
        GATE: ${{ inputs.gate-adjudicated }}
      run: |
        # A SCRATCH PREFIX, never the audited repository — the same rule the browser tier
        # follows, and for the same reason. The ENGINE still installs nothing itself: that
        # promise is why nothing else here reaches a registry, and the caller is the one
        # allowed to.
        prefix="$RUNNER_TEMP/a11y-adjudicator"
        mkdir -p "$prefix"
        if ! npm i --no-save --prefix "$prefix" "@anthropic-ai/claude-code@2" >/dev/null 2>&1; then
          echo "::warning::ultra11y: the Claude Code CLI could not be installed — the judgment criteria stay to assess."
          exit 0
        fi
        export ULTRA11Y_CLAUDE_BIN="$prefix/node_modules/.bin/claude"

        args=(--in audits/audit-latest.json --out audits --apply --runner cli)
        args+=(--grain "${GRAIN:-worklist}" --standard "$STANDARD" --lang "$LANG_OPT")
        if [ -n "${MODEL:-}" ]; then args+=(--model "$MODEL"); fi
        if [ -n "${EFFORT:-}" ]; then args+=(--effort "$EFFORT"); fi
        if [ -n "${BUDGET:-}" ]; then args+=(--max-budget-usd "$BUDGET"); fi
        if [ -n "$LEDGER" ] && [ "$LEDGER" != 'false' ]; then
          if [ "$LEDGER" = 'true' ]; then args+=(--ledger ".ultra11y/verdicts/$STANDARD.json"); else args+=(--ledger "$LEDGER"); fi
        fi
        # PASSES, for the same reason the action path has them: an adjudicator can stop early,
        # and a criterion the gate refused deserves a second look at its own refusal. `judge`
        # re-derives the worklist from what is STILL manual on every call, so a later pass
        # costs the residue and nothing more — and returns immediately, invoking no model at
        # all, once there is no residue left. Without this the CLI runner would be measured
        # against a three-pass action path with one shot, which would say more about the
        # budget than about the runner.
        passes="${PASSES:-1}"
        case "$passes" in 1|2|3) ;; *) passes=1 ;; esac
        ok=1
        for i in $(seq 1 "$passes"); do
          if node "$ENGINE" judge "${args[@]}"; then
            ok=0
          else
            echo "ultra11y: CLI adjudication pass $i did not apply cleanly."
          fi
        done
        # Same policy as every other fold in this file: an adjudication that fails costs the
        # verdicts, never the audit that was already produced above.
        if [ "$ok" = '0' ]; then
          echo "ultra11y: the CLI adjudication was applied."
        elif [ "$GATE" = 'true' ]; then
          echo "::error::ultra11y: the CLI adjudication failed and gate-adjudicated is on — refusing to gate on a partial adjudication."
          exit 1
        else
          echo "::warning::ultra11y: the CLI adjudication failed — the judgment criteria stay to assess."
        fi

    - name: Adjudicate with an agent — worklist and runbook
      id: worklist
      if: steps.adjudication.outputs.on == 'true' && inputs.adjudicate == 'agent' && inputs.adjudicate-runner != 'cli'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
        STANDARD: ${{ inputs.standard }}
        LANG_OPT: ${{ inputs.lang }}
        MAX_TURNS: ${{ inputs.adjudicate-max-turns }}
        # Read from the environment, like every other caller-controlled input in this file.
        MODEL: ${{ inputs.adjudicate-model }}
        EFFORT: ${{ inputs.adjudicate-effort }}
      run: |
        # `--no-web` is EXPLICIT, not left to the `CI` env var: the adjudicator below is
        # granted Read,Grep,Glob,Edit,Write and nothing else, so a brief that offers it a web
        # lookup only spends turns it needs for the criteria in front of it. The criterion's
        # official URL is still printed on every brief — that is a fact about where the
        # vendored normative text came from, and it costs one line.
        node "$ENGINE" verify --manual --in audits/audit-latest.json --out audits \
          --standard "$STANDARD" --lang "$LANG_OPT" --no-web --json > /tmp/ultra11y-worklist.json
        node "$ENGINE" orchestrate --run audits --phase adjudicate --eco

        # THE TURN BUDGET IS DERIVED, not guessed. The runbook is sequential and the whole
        # point of agent mode is that it OPENS the cited files, so the cost is per item: under
        # RGAA the worklist runs to ~90. The fold is per-verdict, so an under-budgeted run is
        # not a cliff: the items it never reached keep `verdict: null`, the fold refuses those
        # and only those, and every verdict already produced still lands. Under-budgeting
        # therefore costs the tail, not the spend — but the tail is exactly the criteria that
        # then stay « to assess », which is the thing this whole tier exists to remove.
        #
        # 4 turns per item plus 40 of headroom, floored at 60 so a tiny worklist still has
        # room to read around what it cites. An explicit `adjudicate-max-turns` wins.
        n=$(node -p 'try{JSON.parse(require("fs").readFileSync("/tmp/ultra11y-worklist.json","utf8")).count||0}catch{0}')
        # `unlimited` (or 0) removes the flag entirely rather than passing a huge number:
        # claude-code-action sets no default of its own, so an absent `--max-turns` IS the
        # unbounded run. What still stops it is the job's own `timeout-minutes`, and above
        # that GitHub's hard six-hour ceiling on a hosted runner — there is no way to run
        # longer than that except on a self-hosted runner (five days).
        #
        # Worth knowing before reaching for it: an under-budgeted run is not a cliff. The fold
        # is per-verdict, so every verdict already produced still lands and only the items the
        # agent never reached keep `verdict: null`. `adjudicate-passes` then picks the residue
        # up with a fresh budget. Unbounded turns trade that bounded, resumable shape for a
        # single run that can spend until the job is killed — and a killed job produces no
        # verdicts at all, because the fold never runs.
        case "${MAX_TURNS:-}" in
          unlimited|0) turns="" ;;
          "") turns=$(( n * 4 + 40 )); if [ "$turns" -lt 60 ]; then turns=60; fi ;;
          *[!0-9]*)
            echo "::error::ultra11y: adjudicate-max-turns='${MAX_TURNS}' is neither a turn count nor 'unlimited'."
            exit 1
            ;;
          *) turns="$MAX_TURNS" ;;
        esac
        echo "turns=${turns:-unlimited}" >> "$GITHUB_OUTPUT"

        # THE WHOLE ARGUMENT STRING, assembled here rather than written inline on the `uses:`
        # step, because `--model` is optional and a `with:` value cannot grow a flag
        # conditionally. Without this the agent tier had no way to pick a model at all: the
        # input existed but reached only the API tier, so the mode that is billed per item —
        # a full RGAA worklist runs to ~90 — was the mode stuck on the harness default.
        #
        # The id is validated rather than trusted: it is caller-controlled, and it is about to
        # be written to $GITHUB_OUTPUT, where a newline would start a line of someone else's
        # choosing.
        cargs="--allowedTools Read,Grep,Glob,Edit,Write"
        if [ -n "${turns:-}" ]; then cargs="$cargs --max-turns $turns"; fi
        if [ -n "${MODEL:-}" ]; then
          case "$MODEL" in
            *[!A-Za-z0-9._:/-]*)
              echo "::warning::ultra11y: adjudicate-model='$MODEL' is not a model id — ignoring it and letting claude-code-action choose."
              ;;
            *) cargs="$cargs --model $MODEL" ;;
          esac
        fi
        # Same shape as the model above, and validated for the same reason: the value is
        # caller-controlled and about to be written to $GITHUB_OUTPUT. The allowed set is
        # closed, so a typo is refused here rather than forwarded to a CLI that would swallow
        # it in silence and leave the run at a default nobody asked for.
        if [ -n "${EFFORT:-}" ]; then
          case "$EFFORT" in
            low|medium|high|xhigh|max) cargs="$cargs --effort $EFFORT" ;;
            *)
              echo "::warning::ultra11y: adjudicate-effort='$EFFORT' is not a level — expected low, medium, high, xhigh or max. Ignoring it."
              ;;
          esac
        fi
        echo "args=$cargs" >> "$GITHUB_OUTPUT"
        # What is still open. A later pass reads this to decide whether it has anything to do:
        # a run that decided everything must not pay for a second adjudicator to discover it.
        echo "remaining=$n" >> "$GITHUB_OUTPUT"
        echo "ultra11y: $n criteria to adjudicate, budget ${turns:-unlimited} turns."

    # The version is pinned in the literal below because GitHub refuses an expression in
    # `uses:` — it cannot be an input, so it is a dependency this action owns and bumps.
    #
    # BOTH credentials are handed over, and either may be empty: claude-code-action treats
    # them as alternatives and falls back to the job environment for each, so passing the
    # blank one costs nothing and lets an OAuth-only repository through. `Resolve the
    # adjudication tier` has already established that at least one is set.
    #
    # `github_token` is passed for a reason that is easy to miss: without it the action mints
    # its own GitHub App token over OIDC, which needs `id-token: write` in the CALLER's
    # workflow. This step never touches the GitHub API — it reads a runbook and writes one
    # JSON file — so handing it the job's own token keeps the permission surface of a
    # consumer's a11y workflow exactly as it was.
    #
    # `--max-turns` bounds an unattended run. claude-code-action sets no default, and this
    # step has nobody watching it.
    - name: Adjudicate with an agent — Claude Code
      if: steps.adjudication.outputs.on == 'true' && inputs.adjudicate == 'agent' && inputs.adjudicate-runner != 'cli'
      uses: anthropics/claude-code-action@v1
      # AN ADJUDICATION THAT FAILS IS NOT AN AUDIT THAT FAILS — the policy the API tier has
      # always honoured, and the one tier that could not. A `uses:` step has no `if node …
      # else warning` to wrap it in, so when the model call died the whole composite action
      # died with it: measured on a keyed run, claude-code-action returned `is_error` after a
      # single turn and every step below it was SKIPPED — the Markdown report, the HTML
      # report, the per-page dossiers, the artifact upload and the residue warning, all of
      # them already computed or about to be, all of them lost. The job reported a failed
      # accessibility audit when what had failed was one API call.
      #
      # The failure is not swallowed, it is relocated: the fold below finds the verdicts file
      # unfilled, and it is the fold that decides — a warning by default, an error when
      # `gate-adjudicated` says this job's red may rest on what a model ruled.
      continue-on-error: true
      with:
        anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
        claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
        github_token: ${{ github.token }}
        claude_args: ${{ steps.worklist.outputs.args }}
        prompt: |
          You are running head-less in CI, with Read, Grep, Glob, Edit and Write — no shell.
          Adjudicate an accessibility audit, and do nothing else.

          Work from the SMALL files, never the big ones. `audits/ADJUDICATE.todo.json` and
          `audits/ADJUDICATE.md` are written for a session with a shell and run to hundreds of
          kilobytes; reading either will swamp your context and editing the JSON in place is
          hundreds of exact-match edits. Do not open them. Use instead:

          1. `${{ inputs.working-directory }}/audits/ADJUDICATE.verdicts.json` — the list of
             criteria to rule on, and the ONLY file you write. Its `contract` field states what
             each verdict requires.
          2. `${{ inputs.working-directory }}/audits/adjudicate/<criteriaId>.md` — one small
             brief per criterion: its harvested evidence, its decision protocol, and the
             normative tests a non-conformity may cite. Read the brief for a criterion, rule on
             it, write its verdict, move to the next.
          3. `${{ inputs.working-directory }}/audits/orchestration/agents/adjudicator.md` — the
             adjudicator contract: what a valid verdict of each kind requires. It is emitted for
             the sequential path this job runs, so it names the same two files as above and
             expects you to WRITE rather than return anything. Where it still describes a
             harness other than yours — a shell, an engine command, a fold — this prompt wins:
             you have no shell, you never run the engine, and the next step folds for you.

          THE RENDERED PAGE IS PROBABLY ON DISK. When this audit ingested page captures — look
          for evidence anchored in `.ultra11y/pages/<id>/dom.html` — the rendered page is there
          to read: `dom.html` is the DOM the browser serialized, beside `styles.json` (computed
          styles), `boxes.json` (boxes and positions), `axtree.json` (the accessibility tree)
          and `screen.png`. A needs-rendering criterion — information carried by colour,
          keyboard operability of a script, a pointer gesture — is decided FROM THOSE FILES.
          Open them as you would open the source. `needs-rendered-dom` is the right answer only
          for a criterion no capture carries the subject of; on an audit full of captures it is
          almost always the wrong one, and it costs the criterion for nothing.

          Two things about the evidence, because they change how you should read it.

          It is grouped by CONTENT CLASS: one representative per distinct thing, carrying
          `occurrences`, the sibling anchors in `alsoAt`, and the `pages` it appears on. The
          same header link on thirty-eight pages is ONE decision, not thirty-eight — so ruling
          on the representative rules on all of them, and the brief shows you the whole
          population rather than a sample of it. When you cite, any occurrence of a class the
          criterion carries is accepted, so cite the one you actually opened — as an OBJECT,
          `{"file": "...", "line": 12, "selector": "...", "snippet": "..."}`, never as the bare
          `"file:line"` string `alsoAt` uses. A string is accepted, but it carries no snippet,
          and the snippet is what proves the citation resolves to the thing you meant.

          COPY that `snippet` out of the brief; do not write the element out yourself. A
          retyping with the attributes reordered, or with `class` left off, still names the
          right element — the fold grounds the harvested anchor rather than your transcription
          of it — but it has to stay RECOGNISABLE as that element: same tag, and at least one
          distinctive word in common. Copying is free and it keeps the citation checkable by a
          human reading the diff.

          And each item says whether that reading was COMPLETE (`evidenceComplete`). On a
          complete one you may conclude anything the evidence supports. On an incomplete one
          you may still record an `NC` for what you saw — a real failure does not stop being
          real — but a `C` will be refused, because clearing a criterion is a claim about
          everything, including the part you were not shown.

          The `citations` of each item ARRIVE PRE-FILLED with the representatives that criterion
          was harvested from. Keep them when your verdict covers them — which is what a `C`
          means — and replace them with the occurrence you actually opened when that is a better
          record of what you read. Do not delete them and leave the field empty.

          A `C` WITHOUT CITATIONS IS REFUSED, every time, however good the justification. « All
          the navigation menus are consistent » is a claim about elements; name at least one of
          the ones you were shown, with its `file`, `line` and `snippet`. Measured on a real
          run: eight criteria were lost to this alone — 10.1, 10.2, 10.3, 11.11, 11.12, 12.3,
          12.4 and 12.8 — each with hundreds of evidence items in front of it and not one cited.
          If the brief is too large to read in full, that is what `manual` with
          `reason: "undecidable"` is for; it is a correct answer, and an uncited `C` is not.

          AND THE SYMMETRY, WHICH COSTS AS MANY CRITERIA. An `NC` needs at least one
          `findings[]` entry, and that entry needs a `file` — a non-conformity with no location
          is one nobody can act on, and the fold refuses it exactly as flatly as an uncited `C`.
          It also needs a `normativeRef` naming the precise failed test OF THIS CRITERION (under
          RGAA, `12.1.1`, not a WCAG id — they look alike and denote unrelated tests).

          AN NC SHAPED LIKE AN ABSENCE IS STILL ANCHORED SOMEWHERE. « There is no second
          navigation system », « there is no search engine », « nothing suggests the expected
          format » — you observed that absence on a page, looking at an element: cite that
          element, with its `file`, `line` and `snippet`. Measured on a real run: 12.1 and 12.5
          were both lost this way, ruled `NC` with nothing to open. And when the criterion's
          subject exists NOWHERE in the audited scope, the verdict is not `NC` at all — it is
          `NA` with a justification saying so. Read the criterion's « particular cases » in its
          brief before you choose between the two; several criteria are explicitly not
          applicable to a site of one page, or to a step inside a process.

          Fill EVERY item's verdict. Each one stands or falls on its own: a verdict the gate
          refuses costs its own criterion (which stays « to assess », carrying the refusal) and
          leaves every other verdict standing — so work through the list steadily rather than
          rushing to fill it, and never guess to avoid leaving a gap. A criterion you cannot
          decide from real evidence must be `manual` with its `reason`; that is a correct
          answer, not a failure. Never assert a conformity you did not verify: the fold
          re-grounds every file:line you cite and matches each citation against that
          criterion's own harvested evidence.

          Do not edit any other file, do not touch the audited source, do not commit, and do
          not comment on the PR.

    - name: Adjudicate with an agent — fold the verdicts
      if: steps.adjudication.outputs.on == 'true' && inputs.adjudicate == 'agent' && inputs.adjudicate-runner != 'cli'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
      run: |
        # Same gate, same degradation policy as the API mode above.
        # The verdicts-only file the agent filled. `verify --apply` re-derives the evidence from
        # the audit before folding, so this goes through the SAME gate as an inline worklist —
        # same coverage checks, same citation grounding, same refusals. The fold is per-verdict,
        # so a criterion the agent got wrong (or never reached) costs itself and nothing else.
        args=(--apply audits/ADJUDICATE.verdicts.json --in audits/audit-latest.json --out audits)
        # Record the accepted verdicts, so the next run replays them instead of paying again.
        if [ -n '${{ inputs.ledger }}' ] && [ '${{ inputs.ledger }}' != 'false' ]; then
          if [ '${{ inputs.ledger }}' = 'true' ]; then args+=(--ledger ".ultra11y/verdicts/${{ inputs.standard }}.json"); else args+=(--ledger '${{ inputs.ledger }}'); fi
          args+=(--standard '${{ inputs.standard }}')
        fi
        if node "$ENGINE" verify "${args[@]}"; then
          echo "ultra11y: adjudication applied."
        elif [ '${{ inputs.gate-adjudicated }}' = 'true' ]; then
          echo "::error::ultra11y: the adjudication landed nothing and gate-adjudicated is on — refusing to gate on an empty adjudication."
          exit 1
        else
          echo "::warning::ultra11y: the adjudication landed nothing — the judgment criteria stay to assess."
        fi

    # THE SECOND AND THIRD PASSES — the residue, and only the residue.
    #
    # One pass was never enough in practice, for a reason that has nothing to do with the
    # criteria and everything to do with the adjudicator: it can stop early. Measured on a real
    # run, `num_turns: 22` against a budget of 228, `is_error: false`, and 42 criteria still
    # `verdict: null` — a whole worklist abandoned with no error to show for it. A single pass
    # has no way to come back to them, so a green job published a grid nobody had filled.
    #
    # Each extra pass re-derives the worklist with `verify --manual`, which by construction
    # contains ONLY what is still `manual` — never reached, or refused by the gate and returned
    # to « to assess » carrying its refusal. So a pass costs the residue and nothing more, and a
    # run that decided everything skips the rest outright: `remaining == 0` is the stop
    # condition, and it is checked before any model is invoked.
    #
    # Unrolled rather than looped because a composite action has no loop. Two extra passes is
    # what `adjudicate-passes` caps at: the returns fall off fast — what two adjudicators in a
    # row decline to decide is very rarely decidable by a third, and by then the honest answer
    # is the criterion's own `manual` reason.
    - name: Adjudicate with an agent — pass 2, worklist
      id: worklist2
      if: steps.adjudication.outputs.on == 'true' && inputs.adjudicate == 'agent' && inputs.adjudicate-runner != 'cli' && (inputs.adjudicate-passes == '2' || inputs.adjudicate-passes == '3') && steps.worklist.outputs.remaining != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
        STANDARD: ${{ inputs.standard }}
        LANG_OPT: ${{ inputs.lang }}
        MAX_TURNS: ${{ inputs.adjudicate-max-turns }}
        # Read from the environment, like every other caller-controlled input in this file.
        MODEL: ${{ inputs.adjudicate-model }}
        EFFORT: ${{ inputs.adjudicate-effort }}
      run: |
        # `--no-web`: same reason as the first pass — this adjudicator has no web tool.
        node "$ENGINE" verify --manual --in audits/audit-latest.json --out audits \
          --standard "$STANDARD" --lang "$LANG_OPT" --no-web --json > /tmp/ultra11y-worklist.json
        node "$ENGINE" orchestrate --run audits --phase adjudicate --eco
        n=$(node -p 'try{JSON.parse(require("fs").readFileSync("/tmp/ultra11y-worklist.json","utf8")).count||0}catch{0}')
        # Same budget contract as pass 1: `unlimited` (or 0) removes the flag rather than
        # passing a large number, because an absent `--max-turns` is what claude-code-action
        # reads as no bound at all.
        case "${MAX_TURNS:-}" in
          unlimited|0) turns="" ;;
          "") turns=$(( n * 4 + 40 )); if [ "$turns" -lt 60 ]; then turns=60; fi ;;
          *[!0-9]*)
            echo "::error::ultra11y: adjudicate-max-turns='${MAX_TURNS}' is neither a turn count nor 'unlimited'."
            exit 1
            ;;
          *) turns="$MAX_TURNS" ;;
        esac
        echo "turns=${turns:-unlimited}" >> "$GITHUB_OUTPUT"

        # THE WHOLE ARGUMENT STRING, assembled here rather than written inline on the `uses:`
        # step, because `--model` is optional and a `with:` value cannot grow a flag
        # conditionally. Without this the agent tier had no way to pick a model at all: the
        # input existed but reached only the API tier, so the mode that is billed per item —
        # a full RGAA worklist runs to ~90 — was the mode stuck on the harness default.
        #
        # The id is validated rather than trusted: it is caller-controlled, and it is about to
        # be written to $GITHUB_OUTPUT, where a newline would start a line of someone else's
        # choosing.
        cargs="--allowedTools Read,Grep,Glob,Edit,Write"
        if [ -n "${turns:-}" ]; then cargs="$cargs --max-turns $turns"; fi
        if [ -n "${MODEL:-}" ]; then
          case "$MODEL" in
            *[!A-Za-z0-9._:/-]*)
              echo "::warning::ultra11y: adjudicate-model='$MODEL' is not a model id — ignoring it and letting claude-code-action choose."
              ;;
            *) cargs="$cargs --model $MODEL" ;;
          esac
        fi
        # Same shape as the model above, and validated for the same reason: the value is
        # caller-controlled and about to be written to $GITHUB_OUTPUT. The allowed set is
        # closed, so a typo is refused here rather than forwarded to a CLI that would swallow
        # it in silence and leave the run at a default nobody asked for.
        if [ -n "${EFFORT:-}" ]; then
          case "$EFFORT" in
            low|medium|high|xhigh|max) cargs="$cargs --effort $EFFORT" ;;
            *)
              echo "::warning::ultra11y: adjudicate-effort='$EFFORT' is not a level — expected low, medium, high, xhigh or max. Ignoring it."
              ;;
          esac
        fi
        echo "args=$cargs" >> "$GITHUB_OUTPUT"
        echo "remaining=$n" >> "$GITHUB_OUTPUT"
        echo "ultra11y: pass 2 — $n criterion(ia) still undecided, budget $turns turns."

    - name: Adjudicate with an agent — pass 2, Claude Code
      if: steps.adjudication.outputs.on == 'true' && inputs.adjudicate == 'agent' && inputs.adjudicate-runner != 'cli' && steps.worklist2.outputs.remaining != '' && steps.worklist2.outputs.remaining != '0'
      uses: anthropics/claude-code-action@v1
      # AN ADJUDICATION THAT FAILS IS NOT AN AUDIT THAT FAILS — the policy the API tier has
      # always honoured, and the one tier that could not. A `uses:` step has no `if node …
      # else warning` to wrap it in, so when the model call died the whole composite action
      # died with it: measured on a keyed run, claude-code-action returned `is_error` after a
      # single turn and every step below it was SKIPPED — the Markdown report, the HTML
      # report, the per-page dossiers, the artifact upload and the residue warning, all of
      # them already computed or about to be, all of them lost. The job reported a failed
      # accessibility audit when what had failed was one API call.
      #
      # The failure is not swallowed, it is relocated: the fold below finds the verdicts file
      # unfilled, and it is the fold that decides — a warning by default, an error when
      # `gate-adjudicated` says this job's red may rest on what a model ruled.
      continue-on-error: true
      with:
        anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
        claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
        github_token: ${{ github.token }}
        claude_args: ${{ steps.worklist2.outputs.args }}
        prompt: |
          You are running head-less in CI, with Read, Grep, Glob, Edit and Write — no shell.
          Adjudicate an accessibility audit, and do nothing else.

          THIS IS A SECOND PASS. Everything a previous adjudicator decided has already been
          applied and is gone from the list; what remains in
          `${{ inputs.working-directory }}/audits/ADJUDICATE.verdicts.json` is exactly what is
          still undecided — either never reached, or ruled and REFUSED by the gate, in which
          case the refusal says what was wrong with the verdict. Read it and do better.

          Work from the SMALL files. Do not open `audits/ADJUDICATE.todo.json` or
          `audits/ADJUDICATE.md` — they run to megabytes and reading either will swamp your
          context. Use instead:

          1. `${{ inputs.working-directory }}/audits/ADJUDICATE.verdicts.json` — the criteria
             left to rule on, and the ONLY file you write. Its `contract` field states what each
             verdict requires, and its `citations` arrive pre-filled with the harvested
             representatives: keep them when your verdict covers them, replace them with the
             occurrence you actually opened otherwise, never leave the field empty.
          2. `${{ inputs.working-directory }}/audits/adjudicate/<criteriaId>.md` — one small
             brief per criterion: its harvested evidence with the `snippet` to copy, its
             decision protocol, and the normative tests a non-conformity may cite.

          Fill EVERY remaining item. A `C` needs a justification AND citations, and it needs the
          evidence reading to have been complete. An `NC` needs at least one `findings[]` entry
          carrying a `file` — a non-conformity with no location is refused as flatly as an
          uncited `C` — and a `normativeRef` naming a numbered test OF THIS CRITERION (under
          RGAA, `12.1.1`, never a WCAG id). An absence you observed is still observed on an
          element of a page: cite that element. And when the criterion's subject exists nowhere
          in scope, the verdict is `NA` with its justification, not `NC` — the brief's
          « particular cases » often say so outright.

          When a criterion's evidence is anchored under `.ultra11y/pages/<id>/`, the browser has
          already run and the page is on disk (`dom.html`, `styles.json`, `boxes.json`,
          `axtree.json`, `screen.png`). `needs-rendered-dom` is REFUSED on such a criterion:
          decide it from those files, or answer `undecidable` and say what the capture leaves
          open. A criterion you genuinely cannot decide from the evidence is `manual` with its
          `reason` — that is a correct answer, and it is the one to give rather than guessing.

          Do not edit any other file, do not touch the audited source, do not commit, and do
          not comment on the PR.

    - name: Adjudicate with an agent — pass 2, fold
      if: steps.adjudication.outputs.on == 'true' && inputs.adjudicate == 'agent' && inputs.adjudicate-runner != 'cli' && steps.worklist2.outputs.remaining != '' && steps.worklist2.outputs.remaining != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
      run: |
        args=(--apply audits/ADJUDICATE.verdicts.json --in audits/audit-latest.json --out audits)
        if [ -n '${{ inputs.ledger }}' ] && [ '${{ inputs.ledger }}' != 'false' ]; then
          if [ '${{ inputs.ledger }}' = 'true' ]; then args+=(--ledger ".ultra11y/verdicts/${{ inputs.standard }}.json"); else args+=(--ledger '${{ inputs.ledger }}'); fi
          args+=(--standard '${{ inputs.standard }}')
        fi
        # THE SAME REFUSAL AS PASS 1. `gate-adjudicated` says "this job's red/green may rest on
        # what a model ruled"; a later pass that swallowed its own failure would hand the gate
        # a grid missing exactly the criteria the extra passes existed to fill, and call it
        # complete. A partial adjudication is not a smaller one — it is a different claim
        # about the same audit.
        if node "$ENGINE" verify "${args[@]}"; then
          echo "ultra11y: pass 2 applied."
        elif [ '${{ inputs.gate-adjudicated }}' = 'true' ]; then
          echo "::error::ultra11y: pass 2 landed nothing and gate-adjudicated is on — refusing to gate on a partial adjudication."
          exit 1
        else
          echo "::warning::ultra11y: pass 2 landed nothing — the remaining criteria stay to assess."
        fi

    - name: Adjudicate with an agent — pass 3, worklist
      id: worklist3
      if: steps.adjudication.outputs.on == 'true' && inputs.adjudicate == 'agent' && inputs.adjudicate-runner != 'cli' && steps.worklist2.outputs.remaining != '' && steps.worklist2.outputs.remaining != '0' && inputs.adjudicate-passes == '3'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
        STANDARD: ${{ inputs.standard }}
        LANG_OPT: ${{ inputs.lang }}
        MAX_TURNS: ${{ inputs.adjudicate-max-turns }}
        # Read from the environment, like every other caller-controlled input in this file.
        MODEL: ${{ inputs.adjudicate-model }}
        EFFORT: ${{ inputs.adjudicate-effort }}
      run: |
        # `--no-web`: same reason as the first pass — this adjudicator has no web tool.
        node "$ENGINE" verify --manual --in audits/audit-latest.json --out audits \
          --standard "$STANDARD" --lang "$LANG_OPT" --no-web --json > /tmp/ultra11y-worklist.json
        node "$ENGINE" orchestrate --run audits --phase adjudicate --eco
        n=$(node -p 'try{JSON.parse(require("fs").readFileSync("/tmp/ultra11y-worklist.json","utf8")).count||0}catch{0}')
        # Same budget contract as pass 1: `unlimited` (or 0) removes the flag rather than
        # passing a large number, because an absent `--max-turns` is what claude-code-action
        # reads as no bound at all.
        case "${MAX_TURNS:-}" in
          unlimited|0) turns="" ;;
          "") turns=$(( n * 4 + 40 )); if [ "$turns" -lt 60 ]; then turns=60; fi ;;
          *[!0-9]*)
            echo "::error::ultra11y: adjudicate-max-turns='${MAX_TURNS}' is neither a turn count nor 'unlimited'."
            exit 1
            ;;
          *) turns="$MAX_TURNS" ;;
        esac
        echo "turns=${turns:-unlimited}" >> "$GITHUB_OUTPUT"

        # THE WHOLE ARGUMENT STRING, assembled here rather than written inline on the `uses:`
        # step, because `--model` is optional and a `with:` value cannot grow a flag
        # conditionally. Without this the agent tier had no way to pick a model at all: the
        # input existed but reached only the API tier, so the mode that is billed per item —
        # a full RGAA worklist runs to ~90 — was the mode stuck on the harness default.
        #
        # The id is validated rather than trusted: it is caller-controlled, and it is about to
        # be written to $GITHUB_OUTPUT, where a newline would start a line of someone else's
        # choosing.
        cargs="--allowedTools Read,Grep,Glob,Edit,Write"
        if [ -n "${turns:-}" ]; then cargs="$cargs --max-turns $turns"; fi
        if [ -n "${MODEL:-}" ]; then
          case "$MODEL" in
            *[!A-Za-z0-9._:/-]*)
              echo "::warning::ultra11y: adjudicate-model='$MODEL' is not a model id — ignoring it and letting claude-code-action choose."
              ;;
            *) cargs="$cargs --model $MODEL" ;;
          esac
        fi
        # Same shape as the model above, and validated for the same reason: the value is
        # caller-controlled and about to be written to $GITHUB_OUTPUT. The allowed set is
        # closed, so a typo is refused here rather than forwarded to a CLI that would swallow
        # it in silence and leave the run at a default nobody asked for.
        if [ -n "${EFFORT:-}" ]; then
          case "$EFFORT" in
            low|medium|high|xhigh|max) cargs="$cargs --effort $EFFORT" ;;
            *)
              echo "::warning::ultra11y: adjudicate-effort='$EFFORT' is not a level — expected low, medium, high, xhigh or max. Ignoring it."
              ;;
          esac
        fi
        echo "args=$cargs" >> "$GITHUB_OUTPUT"
        echo "remaining=$n" >> "$GITHUB_OUTPUT"
        echo "ultra11y: pass 3 — $n criterion(ia) still undecided, budget $turns turns."

    - name: Adjudicate with an agent — pass 3, Claude Code
      if: steps.adjudication.outputs.on == 'true' && inputs.adjudicate == 'agent' && inputs.adjudicate-runner != 'cli' && steps.worklist3.outputs.remaining != '' && steps.worklist3.outputs.remaining != '0'
      uses: anthropics/claude-code-action@v1
      # AN ADJUDICATION THAT FAILS IS NOT AN AUDIT THAT FAILS — the policy the API tier has
      # always honoured, and the one tier that could not. A `uses:` step has no `if node …
      # else warning` to wrap it in, so when the model call died the whole composite action
      # died with it: measured on a keyed run, claude-code-action returned `is_error` after a
      # single turn and every step below it was SKIPPED — the Markdown report, the HTML
      # report, the per-page dossiers, the artifact upload and the residue warning, all of
      # them already computed or about to be, all of them lost. The job reported a failed
      # accessibility audit when what had failed was one API call.
      #
      # The failure is not swallowed, it is relocated: the fold below finds the verdicts file
      # unfilled, and it is the fold that decides — a warning by default, an error when
      # `gate-adjudicated` says this job's red may rest on what a model ruled.
      continue-on-error: true
      with:
        anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
        claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
        github_token: ${{ github.token }}
        claude_args: ${{ steps.worklist3.outputs.args }}
        prompt: |
          You are running head-less in CI, with Read, Grep, Glob, Edit and Write — no shell.
          Adjudicate an accessibility audit, and do nothing else.

          THIS IS THE LAST PASS. Two adjudicators have already been through this audit; what is
          left in `${{ inputs.working-directory }}/audits/ADJUDICATE.verdicts.json` is what they
          did not reach or what the gate refused, and the refusal on each item says why.

          Read `${{ inputs.working-directory }}/audits/adjudicate/<criteriaId>.md` for the
          criterion's evidence and decision protocol. Do not open `ADJUDICATE.todo.json` or
          `ADJUDICATE.md`. Write only the verdicts file.

          Every item must come back with a verdict, and the refusal already recorded on each one
          tells you what to change. The three that recur: an `NC` needs a `findings[]` entry
          with a `file` (an absence is observed on an element of a page — cite it, or rule `NA`
          when the subject exists nowhere in scope); a `C` needs `citations[]`; and
          `needs-rendered-dom` is refused when the criterion's own evidence is anchored under
          `.ultra11y/pages/<id>/`, because the rendered page is right there to read.

          If the evidence genuinely does not settle a criterion, `manual` with
          `reason: "undecidable"` is the right answer and the one to record — after two passes,
          an honest « nobody can decide this from what was harvested » is worth more than a
          guess, and it is what the report will publish.

          Do not edit any other file, do not touch the audited source, do not commit, and do
          not comment on the PR.

    - name: Adjudicate with an agent — pass 3, fold
      if: steps.adjudication.outputs.on == 'true' && inputs.adjudicate == 'agent' && inputs.adjudicate-runner != 'cli' && steps.worklist3.outputs.remaining != '' && steps.worklist3.outputs.remaining != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
      run: |
        args=(--apply audits/ADJUDICATE.verdicts.json --in audits/audit-latest.json --out audits)
        if [ -n '${{ inputs.ledger }}' ] && [ '${{ inputs.ledger }}' != 'false' ]; then
          if [ '${{ inputs.ledger }}' = 'true' ]; then args+=(--ledger ".ultra11y/verdicts/${{ inputs.standard }}.json"); else args+=(--ledger '${{ inputs.ledger }}'); fi
          args+=(--standard '${{ inputs.standard }}')
        fi
        # THE SAME REFUSAL AS PASS 1. `gate-adjudicated` says "this job's red/green may rest on
        # what a model ruled"; a later pass that swallowed its own failure would hand the gate
        # a grid missing exactly the criteria the extra passes existed to fill, and call it
        # complete. A partial adjudication is not a smaller one — it is a different claim
        # about the same audit.
        if node "$ENGINE" verify "${args[@]}"; then
          echo "ultra11y: pass 3 applied."
        elif [ '${{ inputs.gate-adjudicated }}' = 'true' ]; then
          echo "::error::ultra11y: pass 3 landed nothing and gate-adjudicated is on — refusing to gate on a partial adjudication."
          exit 1
        else
          echo "::warning::ultra11y: pass 3 landed nothing — the remaining criteria stay to assess."
        fi

    # NO CRITERION LEAVES THIS ACTION UNACCOUNTED FOR.
    #
    # The adjudication tier is allowed to fall short, and every way it can is legitimate: a
    # turn budget runs out, a fold refuses a verdict that was not grounded, a criterion is
    # genuinely undecidable without a rendered measurement nobody took. What is NOT legitimate
    # is finishing quietly. With the defaults — `adjudicate-passes: 1`, `require-decided:
    # false` — a run could rule on half the grid and report success, and on a green job the
    # half nobody ruled on reads exactly like the half that passed. Measured on a real pull
    # request: 94 of 106 criteria came back « à évaluer » under a green check.
    #
    # So the residue is ALWAYS measured and ALWAYS named, whatever the inputs say. It warns
    # rather than fails, because whether an incomplete grid should be fatal is exactly what
    # `require-decided` is for; this step only removes the option of not knowing.
    #
    # Its own `--out` is a throwaway directory: `audits/ADJUDICATE.*` is the worklist the
    # passes above consumed, and re-deriving it in place would overwrite the record of what
    # they were handed.
    - name: What the adjudication left to assess
      id: residue
      if: steps.adjudication.outputs.on == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
        STANDARD: ${{ inputs.standard }}
        LANG_OPT: ${{ inputs.lang }}
      run: |
        node "$ENGINE" verify --manual --in audits/audit-latest.json --out /tmp/ultra11y-residue \
          --standard "$STANDARD" --lang "$LANG_OPT" --no-web --json > /tmp/ultra11y-residue.json || true

        read -r n ids <<EOF
        $(node -p 'try{const j=JSON.parse(require("fs").readFileSync("/tmp/ultra11y-residue.json","utf8"));const i=(j.items||[]).map(x=>x.criteriaId);(j.count||0)+" "+i.join(", ")}catch{"0 "}')
        EOF
        echo "remaining=${n:-0}" >> "$GITHUB_OUTPUT"

        {
          echo "### ultra11y — adjudication residue (${STANDARD})"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "${n:-0}" -eq 0 ]; then
          echo "ultra11y: every criterion of the grid carries a verdict."
          echo "Every criterion of the grid carries a verdict." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "${n} criterion(s) still to assess: ${ids}" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::ultra11y: ${n} criterion(s) are still « to assess » after the adjudication tier: ${ids}. Raise \`adjudicate-passes\` (up to 3) to go round again on the residue, and declare the genuinely undecidable ones in the file named by \`undecidable-file\`, each with a reason. Set \`require-decided\` to make an incomplete grid fail the job."
        fi

    # COVERAGE — did the run look at every page it says it audits?
    #
    # Measured here and enforced in the final `Gate` step, for the same reason as completeness
    # below: failing on the spot would skip the report and the artifact, and the first thing
    # anyone does with an incomplete sweep is go and read which pages are missing.
    - name: Sample coverage gate
      id: covered
      if: inputs.require-sample == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
      run: |
        if node "$ENGINE" check --require-sample --standard '${{ inputs.standard }}' --lang '${{ inputs.lang }}'; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::warning::ultra11y: the page sample is not fully captured — see the pages named above. The job fails at the gate step."
        fi

    # COMPLETENESS — is the grid actually filled in?
    #
    # Deliberately measured here and enforced in the final `Gate` step: failing on the spot
    # would skip the report, the HTML and the artifact upload, and the first thing anyone does
    # with an incomplete grid is go and read which criteria are missing.
    - name: Completeness gate
      id: decided
      if: inputs.require-decided == 'true' || inputs.require-decided == 'pages'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
        # Read from the environment, never interpolated: a caller is free to wire an event
        # payload into an input, and a quote in it would escape into this shell.
        SCOPE: ${{ inputs.require-decided }}
      run: |
        # `pages` holds every PAGE's grid to the same bar as the run's — the bar a page-by-page
        # deliverable is actually judged on, and strictly higher than the run's own.
        if [ "$SCOPE" = 'pages' ]; then decided='--require-decided=pages'; else decided='--require-decided'; fi
        args=(--in audits/audit-latest.json "$decided" --standard '${{ inputs.standard }}' --lang '${{ inputs.lang }}')
        if [ -n '${{ inputs.undecidable-file }}' ]; then args+=(--allow-undecided '${{ inputs.undecidable-file }}'); fi
        if node "$ENGINE" check "${args[@]}"; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::warning::ultra11y: the criterion grid is incomplete — see the criteria named above. The job fails at the gate step."
        fi

    # THE INSTRUMENT GATE, one level below coverage: were the criteria that need a browser
    # given one? `require-decided` asks whether every criterion carries a verdict and
    # `require-sample` whether the run looked at every page it declares; neither notices a run
    # where the rendering tier never ran at all. Measured on a real keyed cascade: three
    # passes, 311 turns and $24.90 spent to be told that seven criteria needed a rendered DOM,
    # by a workflow that audited sources only and had snapshotted nothing.
    - name: Render gate
      id: renderedgate
      if: inputs.require-rendered == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
      run: |
        args=(--in audits/audit-latest.json --require-rendered --standard '${{ inputs.standard }}' --lang '${{ inputs.lang }}')
        if [ -n '${{ inputs.undecidable-file }}' ]; then args+=(--allow-undecided '${{ inputs.undecidable-file }}'); fi
        if node "$ENGINE" check "${args[@]}"; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::warning::ultra11y: criteria needing a rendered page are undecided and nothing was rendered — pass urls/crawl/sitemap/sample. The job fails at the gate step."
        fi

    # The per-page DOSSIERS — one sheet per page (its screenshot, every criterion of the
    # standard, each non-conformity), plus an index. Uploaded with the rest of audits/.
    - name: Per-page report
      id: pages
      if: inputs.pages-report == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
      run: |
        # The dossiers. `--evidence` and `--html` follow the SAME inputs the compliance report
        # obeys — they did not, and the result was a documented artifact layout that did not
        # exist: `references/ci.md` promised `audits/pages/index.html`, and the page sheets
        # cited `dom.html:412 (div.card)` with no picture while the report beside them carried
        # annotated crops of those very defects.
        args=(--in audits/audit-latest.json --standard '${{ inputs.standard }}' --lang '${{ inputs.lang }}')
        sheets=("${args[@]}" --format report --split page --out audits/pages)
        if [ '${{ inputs.evidence }}' = 'true' ]; then
          sheets+=(--evidence)
          if [ -n '${{ inputs.evidence-max }}' ]; then sheets+=(--evidence-max '${{ inputs.evidence-max }}'); fi
        fi
        if [ '${{ inputs.html }}' = 'true' ]; then sheets+=(--html); fi

        # No page in scope is not a failure — it just means nothing was scanned or snapshotted.
        # The outputs below then stay empty/0, which is the honest answer and NOT the same
        # statement as a clean sweep.
        {
          echo "json-path="
          echo "report-path="
          echo "count=0"
          echo "failing=0"
        } >> "$GITHUB_OUTPUT"

        if ! node "$ENGINE" pages "${sheets[@]}"; then
          echo "ultra11y: no page in scope — skipping the per-page report."
          exit 0
        fi

        # The same projection, for a machine. `--json --out` writes <dir>/pages.json beside
        # the sheets it mirrors, so the artifact carries one file a later job can read without
        # re-deriving anything — and the action publishes its PATH, never its contents: a
        # criterion × page matrix is not a scalar and a step output is size-capped.
        node "$ENGINE" pages "${args[@]}" --json --out audits > /dev/null

        node -e '
          const j = JSON.parse(require("fs").readFileSync("audits/pages.json", "utf8"));
          const failing = j.pages.filter((p) => p.criteria.some((c) => c.status === "NC")).length;
          const out = require("fs");
          out.appendFileSync(process.env.GITHUB_OUTPUT, "json-path=audits/pages.json\n");
          out.appendFileSync(process.env.GITHUB_OUTPUT, "report-path=audits/pages\n");
          out.appendFileSync(process.env.GITHUB_OUTPUT, "count=" + j.pages.length + "\n");
          out.appendFileSync(process.env.GITHUB_OUTPUT, "failing=" + failing + "\n");
        '

    - name: SARIF → code scanning
      if: inputs.sarif == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
      run: node "$ENGINE" report --in audits/audit-latest.json --standard '${{ inputs.standard }}' --format sarif > audits/ultra11y.sarif

    - name: Upload SARIF
      if: inputs.sarif == 'true'
      continue-on-error: true # no Advanced Security / no security-events: write → annotations still cover it
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.working-directory }}/audits/ultra11y.sarif
        category: ultra11y-${{ inputs.standard }}

    # Annotations + the job summary (+ the sticky PR comment when asked). Works on every plan.
    - name: Annotations, job summary and PR comment
      if: inputs.annotations == 'true' || inputs.comment == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
        ULTRA11Y_PR_COMMENT: ${{ inputs.comment == 'true' && '1' || '0' }}
        # Which document to post. Read as a plain string by the engine, which falls back to
        # the digest on anything it does not recognise — a typo here must degrade to the
        # comment every existing workflow already gets, never to no comment at all.
        ULTRA11Y_PR_COMMENT_KIND: ${{ inputs.comment-kind }}
        GH_TOKEN: ${{ github.token }}
        # The run URL is known before anything is produced and cannot 404, so the digest always
        # links it. The artifact NAME is guarded by the same condition as the upload: naming an
        # artifact that was never uploaded sends the reviewer to a page that does not exist.
        ULTRA11Y_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # `report-artifact` wins when set: a run whose part is merged away downstream must name
        # the deliverable that SURVIVES, not the one it uploaded.
        ULTRA11Y_ARTIFACT_NAME: ${{ (inputs.report == 'true' || inputs.html == 'true') && (inputs.report-artifact != '' && inputs.report-artifact || (inputs.artifact-name != '' && inputs.artifact-name || format('ultra11y-{0}', inputs.standard))) || '' }}
      run: node "$ENGINE" report --in audits/audit-latest.json --standard '${{ inputs.standard }}' --lang '${{ inputs.lang }}' --format github

    # Tickets. REST is why this works in a container job or on a self-hosted runner, where
    # `gh` is absent: the engine falls back to GITHUB_TOKEN + GITHUB_REPOSITORY on its own.
    - name: File tracker tickets
      if: inputs.tickets != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        node "$ENGINE" tickets --in audits/audit-latest.json \
          --provider '${{ inputs.tickets }}' \
          --grain '${{ inputs.tickets-grain }}' \
          --max-tickets '${{ inputs.tickets-max }}' \
          --standard '${{ inputs.standard }}' --lang '${{ inputs.lang }}' \
          ${{ inputs.tickets-dry-run == 'true' && '--dry-run' || '' }}

    - name: Markdown report
      id: report
      if: inputs.report == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
      run: |
        # The SAME evidence flags the HTML step passes. That step re-runs `report` into this
        # very directory and rewrites this very file, so anything they disagree about is a
        # difference between the document `check` validates below and the document that ships.
        args=()
        if [ '${{ inputs.evidence }}' = 'true' ]; then
          args+=(--evidence)
          if [ -n '${{ inputs.evidence-max }}' ]; then
            args+=(--evidence-max '${{ inputs.evidence-max }}')
          fi
        fi
        path=$(node "$ENGINE" report --in audits/audit-latest.json "${args[@]}" \
          --standard '${{ inputs.standard }}' --lang '${{ inputs.lang }}' --out audits)
        echo "path=$path" >> "$GITHUB_OUTPUT"
        # The integrity gate: no invented criterion, no unjustified NA, coherent maths.
        node "$ENGINE" check --report "$path" --standard '${{ inputs.standard }}' --quiet

    # The artifact's front door. AFTER the adjudication (so it carries the verdicts) and AFTER
    # `check --quiet` (a report the integrity gate rejected has not earned a nice face), BEFORE
    # the upload, and always before the Gate.
    #
    # It degrades to a ::warning:: on purpose: a rendering bug must never turn into a red
    # accessibility gate. The compensating control is `ci.yml`, whose assertions about this
    # output are NOT optional.
    - name: HTML report
      id: html
      if: inputs.html == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
      run: |
        args=()
        if [ '${{ inputs.evidence }}' = 'true' ]; then
          args+=(--evidence)
          if [ -n '${{ inputs.evidence-max }}' ]; then
            args+=(--evidence-max '${{ inputs.evidence-max }}')
          fi
        fi
        if [ -n '${{ inputs.inline-budget }}' ]; then
          args+=(--inline-budget '${{ inputs.inline-budget }}')
        fi
        if ! node "$ENGINE" report --in audits/audit-latest.json --html "${args[@]}" \
          --standard '${{ inputs.standard }}' --lang '${{ inputs.lang }}' --out audits >/dev/null; then
          echo "::warning::ultra11y: the HTML report could not be rendered in full. The Markdown report and the JSON audit are unaffected."
          exit 0
        fi
        echo "path=audits/index.html" >> "$GITHUB_OUTPUT"
        single=$(ls audits/ultra11y-*-*.html 2>/dev/null | head -1 || true)
        echo "single-path=$single" >> "$GITHUB_OUTPUT"

    # Artifact names are unique per WORKFLOW RUN, not per step: a second invocation in the
    # same job used to die on a 409 with the report already written but never uploaded.
    # `artifact-name` is how you disambiguate; the default keeps the historical name.
    #
    # The condition covers BOTH producers: rendering a front door and then not uploading it
    # would be the one failure mode worse than not rendering it at all.
    # THE LEDGER TRAVELS WITH THE REPORT.
    #
    # An adjudication pass costs real money and its whole output is the verdict ledger — which
    # is written to `.ultra11y/verdicts/`, a directory this action does not upload. So a
    # consumer who turned adjudication on, paid for it, and did not happen to add an upload step
    # of their own got the verdicts computed and then discarded at job end, every run, with
    # nothing saying so. Copied beside the report so the artifact carries what the run decided,
    # ready to be read and committed.
    - name: Carry the verdict ledger into the artifact
      if: (inputs.report == 'true' || inputs.html == 'true') && inputs.ledger != '' && inputs.ledger != 'false'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LEDGER: ${{ inputs.ledger }}
        STANDARD: ${{ inputs.standard }}
      run: |
        path="$LEDGER"
        if [ "$path" = 'true' ]; then path=".ultra11y/verdicts/${STANDARD}.json"; fi
        if [ -f "$path" ]; then
          mkdir -p audits
          cp "$path" "audits/verdicts-${STANDARD}.json"
          echo "ultra11y: the verdict ledger travels in the artifact as verdicts-${STANDARD}.json."
        fi

    - name: Upload the report
      id: upload
      if: inputs.report == 'true' || inputs.html == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('ultra11y-{0}', inputs.standard) }}
        path: ${{ inputs.working-directory }}/audits/
        if-no-files-found: warn
        retention-days: ${{ inputs.artifact-retention-days }}

    # The gate runs LAST, so a failing audit has already produced every surface above.
    - name: Gate
      if: inputs.fail-on != '' || inputs.require-decided == 'true' || inputs.require-decided == 'pages' || inputs.require-sample == 'true' || inputs.require-rendered == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ENGINE: ${{ steps.engine.outputs.path }}
      run: |
        # COMPLETENESS first, and on its own: a project may want a complete grid without
        # gating on non-conformities at all (`fail-on: ""`), which is the normal shape for a
        # measuring tier. Failing here rather than in the step that computed it is what lets
        # the report and the artifacts be written before the job goes red.
        # COVERAGE first of all: a grid computed over pages nobody captured is not an
        # incomplete grid, it is a grid about something else.
        if [ '${{ inputs.require-sample }}' = 'true' ] && [ '${{ steps.covered.outputs.ok }}' != 'true' ]; then
          echo "::error::ultra11y: a page declared in .ultra11yrc.json produced no capture — the run did not look at everything it reports on. See the pages named above."
          exit 1
        fi
        # THE INSTRUMENT, before completeness: a criterion left « to assess » because nobody
        # rendered anything is not an adjudication problem, and reporting it as one sends the
        # reader to adjudicate what no reading of the source can settle.
        if [ '${{ inputs.require-rendered }}' = 'true' ] && [ '${{ steps.renderedgate.outputs.ok }}' != 'true' ]; then
          echo "::error::ultra11y: criteria that need a rendered page are undecided and this run snapshotted no page. Pass urls/crawl/sitemap/sample so the scan tier runs, or declare them in the file named by undecidable-file, with a reason."
          exit 1
        fi
        if [ '${{ inputs.require-decided }}' != 'false' ] && [ '${{ inputs.require-decided }}' != '' ] && [ '${{ steps.decided.outputs.ok }}' != 'true' ]; then
          echo "::error::ultra11y: the criterion grid is incomplete — some criteria are still « to assess ». Adjudicate them, or declare them in the file named by undecidable-file, with a reason."
          exit 1
        fi
        if [ -z '${{ inputs.fail-on }}' ]; then exit 0; fi
        # Two gates, one step — the gate must stay LAST, so this is a branch, not a new step.
        #
        # DEFAULT: re-audit the SOURCE. The red/green is then a pure function of the commit,
        # whatever any model said about it. That reproducibility is the reason this is the
        # default and not merely an option.
        #
        # gate-adjudicated: gate the ADJUDICATED audit instead, so a model-ruled
        # non-conformity can fail the job. `exec` so the engine's exit code IS the step's.
        if [ '${{ inputs.gate-adjudicated }}' = 'true' ] && [ '${{ steps.adjudication.outputs.on }}' = 'true' ]; then
          echo "ultra11y: gating on the adjudicated audit — this run's verdict is not reproducible."
          exec node "$ENGINE" audit --in audits/audit-latest.json --fail-on '${{ inputs.fail-on }}' --standard '${{ inputs.standard }}'
        fi
        args=()
        since='${{ inputs.since }}'
        if [ "$since" = "auto" ]; then
          if [ -n "${GITHUB_BASE_REF:-}" ]; then since="origin/$GITHUB_BASE_REF"; else since=""; fi
        fi
        if [ -n "$since" ]; then args+=(--since "$since"); else args+=(${{ inputs.paths }}); fi
        if [ '${{ inputs.jsx }}' = 'true' ]; then args+=(--jsx); fi
        if [ '${{ inputs.graph }}' = 'true' ]; then args+=(--graph); fi
        if [ -n '${{ inputs.baseline }}' ]; then args+=(--baseline '${{ inputs.baseline }}'); fi
        # The gate counts THIS standard's non-conformities — which under a pack also carries
        # its declarative-rule findings, part of its verdict and previously invisible here.
        node "$ENGINE" audit "${args[@]}" --fail-on '${{ inputs.fail-on }}' --standard '${{ inputs.standard }}'
