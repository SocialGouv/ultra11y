name: CI

# A superseded push's run is dead weight: cancel it instead of letting two runs of the
# same ref race for a runner and double the bill. (The Release workflow serialises on
# its own group WITHOUT cancelling — a semantic-release killed mid-publish can leave a
# tag with no release and an unpublished npm version.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# The only workflow here that declared none, so its GITHUB_TOKEN inherited whatever the
# repository default happens to be — read/write on a repository that never narrowed it.
# Nothing in this file needs more than the checkout: the `action` job runs the shipped action
# with `sarif: false` and `comment: false` (so no `security-events: write`, no
# `pull-requests: write`), the artifact upload/download pair authenticates with the run's own
# token rather than a scope, and `install-bundle` only talks to the npm registry. A job that
# later needs more should say so on the job, not inherit it from the repository settings.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run the expensive build + coverage gate once, on current Node. The install-free bundle's
    # Node 22 floor has its own focused `runtime-node-floor` job below; repeating the entire
    # suite on both runtimes doubled CI time without exercising a second product path.
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build is reproducible (committed bundles up to date)
        run: pnpm run check:build # tsup && copy-bundle && git diff --exit-code over both bundles

      - name: Test (with coverage)
        run: pnpm run test:coverage

      - name: Smoke-run the committed bundle (offline, fixture)
        run: pnpm run demo # audit -> report -> check -> criteria

      - name: Assert a report was produced
        run: ls /tmp/ultra11y-demo/wcag-*.md

  install-bundle:
    runs-on: ubuntu-latest
    name: install-bundle (skill installs whole, not just SKILL.md)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the embedded bundle
        run: pnpm run build

      - name: Verify the install-bundle shape (no root SKILL.md, engine in sync)
        run: pnpm run verify:bundle

      - name: End-to-end — `skills add` bundles the engine + references, not SKILL.md alone
        run: |
          WORK="$(mktemp -d)"
          cd "$WORK"
          npx --yes skills add "$GITHUB_WORKSPACE" --skill ultra11y --agent claude-code --copy -y
          DIR=.claude/skills/ultra11y
          test -f "$DIR/SKILL.md"             || { echo "::error::SKILL.md not installed"; exit 1; }
          test -f "$DIR/scripts/ultra11y.mjs" || { echo "::error::engine not bundled — skills add dropped scripts/"; exit 1; }
          test -d "$DIR/references"           || { echo "::error::references/ not bundled"; exit 1; }
          node "$DIR/scripts/ultra11y.mjs" --help > /dev/null || { echo "::error::installed engine does not run"; exit 1; }
          npx --yes skills add "$GITHUB_WORKSPACE" --skill review-a11y --agent claude-code --copy -y
          RDIR=.claude/skills/review-a11y
          test -f "$RDIR/SKILL.md"             || { echo "::error::review-a11y SKILL.md not installed"; exit 1; }
          test -f "$RDIR/scripts/ultra11y.mjs" || { echo "::error::review-a11y engine not bundled — skills add dropped scripts/"; exit 1; }
          node "$RDIR/scripts/ultra11y.mjs" --help > /dev/null || { echo "::error::review-a11y installed engine does not run"; exit 1; }

          # Codex installs skills in the shared .agents tree. Exercise the real installer and
          # the copied engine, but never authenticate or invoke a model in public CI.
          npx --yes skills add "$GITHUB_WORKSPACE" --skill ultra11y --agent codex --copy -y
          CDIR=.agents/skills/ultra11y
          test -f "$CDIR/SKILL.md"             || { echo "::error::Codex SKILL.md not installed"; exit 1; }
          test -f "$CDIR/scripts/ultra11y.mjs" || { echo "::error::Codex engine not bundled"; exit 1; }
          test -d "$CDIR/references"           || { echo "::error::Codex references not bundled"; exit 1; }
          node "$CDIR/scripts/ultra11y.mjs" --help > /dev/null || { echo "::error::Codex-installed engine does not run"; exit 1; }
          npx --yes skills add "$GITHUB_WORKSPACE" --skill review-a11y --agent codex --copy -y
          CRDIR=.agents/skills/review-a11y
          test -f "$CRDIR/SKILL.md"             || { echo "::error::Codex review-a11y SKILL.md not installed"; exit 1; }
          test -f "$CRDIR/scripts/ultra11y.mjs" || { echo "::error::Codex review-a11y engine not bundled"; exit 1; }
          node "$CRDIR/scripts/ultra11y.mjs" --help > /dev/null || { echo "::error::Codex review-a11y engine does not run"; exit 1; }
          echo "install-bundle: both skills install whole and run under Claude Code and Codex layouts."

      # The PLUGIN half — the manifests + the PreToolUse guard, which is what makes the
      # review automatic. `skills add` never installs hooks, so nothing above covers it.
      - name: End-to-end — the PreToolUse guard decides correctly
        run: |
          GUARD="$GITHUB_WORKSPACE/hooks/pre-tool-use.mjs"
          WORK="$(mktemp -d)"; cd "$WORK"
          git init -q . && git config user.email ci@ci && git config user.name ci

          # A command that publishes nothing must be a silent no-op — this runs before
          # EVERY Bash call, so any output here would be noise on every shell command.
          payload() { printf '{"tool_name":"Bash","tool_input":{"command":"%s"},"cwd":"%s","session_id":"%s"}' "$1" "$WORK" "$2"; }
          out="$(payload 'ls -la' ci1 | node "$GUARD")"
          [ -z "$out" ] || { echo "::error::guard spoke on a non-git command: $out"; exit 1; }

          # A commit carrying a blocking non-conformity must deny and name the skill.
          printf '<!doctype html><html lang="en"><head><title>t</title></head><body><img src="a.png"></body></html>\n' > page.html
          git add page.html
          out="$(payload 'git commit -m wip' ci2 | node "$GUARD")"
          echo "$out" | grep -q '"permissionDecision":"deny"' || { echo "::error::guard did not deny a commit with a blocking finding: $out"; exit 1; }
          echo "$out" | grep -q 'review-a11y' || { echo "::error::guard did not point at the review-a11y skill: $out"; exit 1; }

          # And it must NOT fire twice on the same findings, or the commit could never land.
          out="$(payload 'git commit -m wip' ci2 | node "$GUARD")"
          [ -z "$out" ] || { echo "::error::guard fired twice on the same change — a retry would loop: $out"; exit 1; }

          # The documented escape hatch has to work, unconditionally.
          out="$(payload 'git commit -m wip' ci3 | SKIP_A11Y=1 node "$GUARD")"
          [ -z "$out" ] || { echo "::error::SKIP_A11Y=1 did not disable the guard: $out"; exit 1; }
          echo "install-bundle: the PreToolUse guard denies, points at the skill, does not loop, and honours SKIP_A11Y."

          # The same four assertions in the CODEX shape: the tool is `shell`, not `Bash`,
          # and the command is an argv ARRAY. Joining that array naively would put `git`
          # off a command position and the gate would silently never fire on Codex — so
          # this is the assertion that keeps that regression out. No Codex binary needed.
          cx() { printf '{"tool_name":"shell","tool_input":{"command":["bash","-lc","%s"]},"cwd":"%s","session_id":"%s"}' "$1" "$WORK" "$2"; }
          out="$(cx 'ls -la' cx1 | node "$GUARD")"
          [ -z "$out" ] || { echo "::error::guard spoke on a non-git codex command: $out"; exit 1; }
          out="$(cx 'git commit -m wip' cx2 | node "$GUARD")"
          echo "$out" | grep -q '"permissionDecision":"deny"' || { echo "::error::guard did not deny a codex-shaped commit: $out"; exit 1; }
          echo "$out" | grep -q 'review-a11y' || { echo "::error::codex-shaped denial did not name the skill: $out"; exit 1; }
          out="$(cx 'git commit -m wip' cx2 | node "$GUARD")"
          [ -z "$out" ] || { echo "::error::guard fired twice on the same codex-shaped change: $out"; exit 1; }
          out="$(cx 'git commit -m wip' cx3 | SKIP_A11Y=1 node "$GUARD")"
          [ -z "$out" ] || { echo "::error::SKIP_A11Y=1 did not disable the guard for codex: $out"; exit 1; }
          # BashOutput/KillShell poll a background shell; matching them would spawn the
          # 2.5 MB engine on every tick.
          for t in BashOutput KillShell Read; do
            out="$(printf '{"tool_name":"%s","tool_input":{"command":"git push"},"cwd":"%s","session_id":"cx4"}' "$t" "$WORK" | node "$GUARD")"
            [ -z "$out" ] || { echo "::error::guard reached for the $t tool: $out"; exit 1; }
          done
          echo "install-bundle: the guard behaves identically on Codex-shaped payloads."

      - name: The OpenCode plugin loads, and install --agents-md is idempotent
        run: |
          set -euo pipefail
          # OpenCode loads this straight off disk, outside any node_modules: a syntax error
          # or a bare import is a plugin that silently never loads.
          node --check .opencode/plugins/ultra11y.js
          node -e '
            const {readFileSync} = require("node:fs");
            const src = readFileSync(".opencode/plugins/ultra11y.js", "utf8");
            const foreign = [...src.matchAll(/^import .*? from ["\x27]([^"\x27]+)["\x27]/gm)].map(m => m[1]).filter(s => !s.startsWith("node:"));
            if (foreign.length) { console.error("::error::opencode plugin imports " + foreign.join(", ")); process.exit(1); }
            const pkg = require("./package.json");
            if (pkg.main !== ".opencode/plugins/ultra11y.js") { console.error("::error::package.json main must point at the opencode plugin"); process.exit(1); }
          '
          WORK="$(mktemp -d)"; cd "$WORK"
          git init -q . && git config user.email ci@ci && git config user.name ci
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" install --agents-md
          grep -q "BEGIN ultra11y" AGENTS.md || { echo "::error::install --agents-md wrote no managed block"; exit 1; }
          cp AGENTS.md /tmp/first.md
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" install --agents-md
          diff -q /tmp/first.md AGENTS.md || { echo "::error::install --agents-md is not idempotent"; exit 1; }
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" uninstall --agents-md
          [ ! -f AGENTS.md ] || { echo "::error::uninstall --agents-md left the file behind"; exit 1; }
          echo "install-bundle: the OpenCode plugin is loadable and install --agents-md round-trips."

  # The shipped scripts/ultra11y.mjs is an install-free bundle declaring
  # engines.node ">=22.18" (the floor @babel/parser 8 requires). This job runs ONLY
  # the committed bundle on that floor, with no install, to guarantee the published
  # ">=22.18" promise actually holds.
  runtime-node-floor:
    runs-on: ubuntu-latest
    name: runtime (Node 22 floor, install-free bundle)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit / report / check / criteria on the floor Node
        run: |
          node scripts/ultra11y.mjs audit tests/fixtures/non-conforming/bad.html --out "$RUNNER_TEMP/u" --json > /dev/null
          node scripts/ultra11y.mjs report --in "$RUNNER_TEMP/u/audit-latest.json" --out "$RUNNER_TEMP/u"
          node scripts/ultra11y.mjs check --report "$RUNNER_TEMP"/u/wcag-*.md
          node scripts/ultra11y.mjs criteria 1.1.1 | grep -q "Non-text Content"

      - name: JSX/TSX real-AST + cross-file audit runs on the floor (bundled @babel/parser)
        run: |
          node scripts/ultra11y.mjs audit "tests/fixtures/cross-file" --graph --dedup off --json > "$RUNNER_TEMP/jsx.json"
          node -e 'const a=require(process.env.RUNNER_TEMP+"/jsx.json"); if(!a.findings.some(f=>f.ruleId==="cross-icon-only-unnamed")){console.error("::error::JSX cross-file audit produced no finding on the floor Node");process.exit(1)}'

      - name: The check gate blocks an invented criterion (exit 1)
        run: |
          # shellcheck disable=SC2016 # the literal Markdown contains no shell expansions
          printf '## 1.\n## 2.\n- **9.9.9 — fake** — `x:1` (`d`)\n## 3.\n## 4.\n## 5.\n- **Rate** : 50%%\n' > "$RUNNER_TEMP/bad.md"
          if node scripts/ultra11y.mjs check --report "$RUNNER_TEMP/bad.md"; then
            echo "expected non-zero exit for an invented criterion"; exit 1
          fi

  # The shipped GitHub Action, EXECUTED. `tests/action.test.ts` parses action.yml and asserts
  # its shape; nothing ever ran it. A composite action is bash — arrays, `set -e`, conditionals
  # and heredoc-free quoting — and none of that is provable by reading the YAML. This job is to
  # the Action what `install-bundle` is to the skills: use the real thing, end to end.
  # THE BROWSER TIER, DRIVEN FOR REAL.
  #
  # Everything else here tests `checkA11y`, `sweepSample` and the live probes against a FAKE
  # page — an object with the right method names that resolves instantly and refuses nothing.
  # Both defects that reached a real repository walked straight through three thousand such
  # tests: `probeHover` called `page.hover()` with no timeout (Playwright's default is «wait
  # forever», so a trigger that never became actionable hung the caller's suite until ITS
  # timeout killed it — twenty of thirty-five pages lost, green), and axe was never run by this
  # tier at all, which no fake page can reveal.
  #
  # Its own job: it is the only one here that needs a browser binary, and a 150 MB download has
  # no business slowing the unit suite down.
  browser-tier:
    runs-on: ubuntu-latest
    # The ceiling only needs to cover ONE slow-CDN download per Playwright version: the
    # browsers are cached below, keyed on the lockfile, so a cache hit skips the download
    # entirely. Before the cache, this job timed out at 15 then 25 minutes on a day the
    # Azure runners' CDN crawled — a network problem that read in the run list exactly
    # like a code failure.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browsers live outside the pnpm store (~/.cache/ms-playwright) and weigh
      # ~170MB — the one download in this job the package cache does not cover.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install chromium
      # ^ NO --with-deps: on the Azure runners apt hangs for 30min+ whenever their
      # ubuntu mirror misbehaves (measured twice today, once for 3h27), while the
      # GitHub image already ships every library chromium-for-testing needs.
      # ULTRA11Y_REQUIRE_BROWSER turns a silent skip into a failure. The tests skip by design
      # where no browser is installed; here one is installed on purpose, so a skip would make
      # the whole file decoration — the exact «green but inactive» failure this tier catches.
      - name: checkA11y, the probes and axe against real Chromium
        env:
          ULTRA11Y_REQUIRE_BROWSER: "1"
        run: pnpm run test:browser

  # THE THING THAT KEEPS 106/106 FROM ROTTING, and it costs no model at all.
  #
  # An adjudication run buys a complete RGAA grid for about nine dollars and twenty minutes.
  # Nothing kept it: the verdicts lived in one run's audit-latest.json, the next push started
  # from « 33 à évaluer », and a regression stayed invisible until somebody paid for another
  # dispatch. That is not a gate, it is a photograph.
  #
  # `.ultra11y/verdicts/rgaa.json` is that photograph turned into a claim under review — one
  # entry per adjudicated criterion with its justification, its citations and a FINGERPRINT of
  # the evidence it was ruled against. This job replays it onto a freshly audited, freshly
  # rendered fixture and holds the result to `--require-decided=pages`, the bar a page-by-page
  # deliverable is actually read at.
  #
  # THE REPLAY IS NOT A CACHE HIT, which is the only reason a gate built on it means anything.
  # Every entry is rebuilt into an ordinary adjudication and folded through the same
  # `verify --apply` path a session uses: the same coverage checks, the same citation matching,
  # the same content-level re-grounding. A verdict nobody can still prove is refused here exactly
  # as it would be refused interactively.
  #
  # Measured on this fixture: the replay closes 49/49 and the grid reads 106/106 on the run and
  # on each of the nine pages — 104 verdicts plus the two criteria the project DECLARES it
  # cannot decide (RGAA 4.5 and 13.7, both of which turn on watching a video). Change one `alt`
  # attribute in tests/fixtures/realworld/index.html and the verdicts argued on that image drop
  # as STALE, `check` exits 1 and names them. Put the attribute back and it is green again. That
  # is the regression signal the dispatch never gave.
  #
  # IT RENDERS RATHER THAN READING COMMITTED SNAPSHOTS. Most of the ledger's citations are
  # anchored in `.ultra11y/pages/<id>/dom.html`, so the replay needs those pages to exist. They
  # could have been committed; re-rendering them is better and turned out to be safe — the
  # fingerprint hashes file, selector and normalised snippet rather than line numbers, and a
  # scan-restore cycle reproduced all 33 fingerprints exactly. Committing them would also have
  # dropped serialized French pages into the tree, which moves the repository's own language
  # signal and breaks tests in files that never touched it (see .gitignore).
  #
  # WHEN THIS GOES RED, the fix is not to regenerate the ledger until it passes. Read which
  # criteria went stale: their evidence changed, so their verdicts are about code that no longer
  # exists. Re-adjudicate those criteria — `Adjudication (keyed)`, which records the ledger —
  # and commit the result as the reviewable claim it is.
  ledger-gate:
    # The double rendered audit is a certification check, not a fast feedback check. Keep it
    # available on demand without making every push and pull request wait for it.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # NO --with-deps, for the reason the other browser jobs here give: it shells out to apt,
      # which on the Azure runners hangs for 30min+ whenever their ubuntu mirror misbehaves.
      - run: pnpm exec playwright install chromium

      - name: Serve the fixture site
        run: nohup python3 -m http.server 8932 --directory tests/fixtures/realworld > /tmp/fixture.log 2>&1 &

      - name: Wait for the fixture
        run: |
          deadline=$(( SECONDS + 30 ))
          until curl -sSf -o /dev/null http://127.0.0.1:8932/; do
            if [ $SECONDS -ge $deadline ]; then echo "::error::the fixture server never came up"; cat /tmp/fixture.log; exit 1; fi
            sleep 1
          done

      # AUDIT TWICE, SCAN TWICE, and it is not a slip. The first audit has no captures to read;
      # the scan then writes .ultra11y/pages/, and the second audit ingests them — which is what
      # anchors a criterion's evidence in the rendered DOM instead of only in the source. The
      # ledger's citations point at those anchors, so a single pass would replay against a grid
      # the verdicts were never ruled on. It is exactly what the composite action does.
      # `--standard rgaa` on every step, including `audit` and `scan`. This job gates the RGAA
      # grid, so it should exercise the pipeline a project on RGAA actually runs — a
      # pack-keyed document written by `audit`, carried through `scan --merge`, replayed and
      # checked. Running the first two steps on the core and only re-keying at the end would
      # leave the shipped path untested by this manually dispatched certification job.
      - name: Audit and render the fixture
        run: |
          node scripts/ultra11y.mjs audit tests/fixtures/realworld --standard rgaa --out audits --json > /dev/null
          node scripts/ultra11y.mjs scan --crawl http://127.0.0.1:8932/ --max 12 --standard rgaa \
            --runtime local --cwd "$PWD" --merge audits/audit-latest.json --out audits
          node scripts/ultra11y.mjs audit tests/fixtures/realworld --standard rgaa --out audits --json > /dev/null
          node scripts/ultra11y.mjs scan --crawl http://127.0.0.1:8932/ --max 12 --standard rgaa \
            --runtime local --cwd "$PWD" --merge audits/audit-latest.json --out audits

      # Not `| tee`: a pipeline reports the exit status of its LAST command, so piping this
      # through anything would swallow the refusal and paint the job green.
      - name: Replay the committed verdict ledger
        run: |
          node scripts/ultra11y.mjs verify --apply .ultra11y/verdicts/rgaa.json \
            --in audits/audit-latest.json --standard rgaa --out audits

      # `--allow-undecided` is passed, and passing it is the point. Without it the gate never
      # reads the declaration, and the two committed artefacts were free to contradict each
      # other in silence — which they did: `61d8bdf` declared 4.5 and 13.7 undecidable,
      # `75d257a` gave them NC and NA the next day, and this job stayed green for both. The
      # flag turns that into a failure, because an entry whose criterion now carries a verdict
      # fails the gate exactly as an entry with no reason does. Excusing a criterion and
      # deciding it are different claims, and a project may not make both.
      - name: Every one of the 106 criteria carries a verdict or a declared reason, run and pages
        run: |
          node scripts/ultra11y.mjs check --in audits/audit-latest.json \
            --standard rgaa --require-decided=pages \
            --allow-undecided .ultra11y/undecidable-rgaa.json

      # The instrument gate, one level below completeness: were the criteria that need a browser
      # actually given one? A run that rendered nothing can still look complete.
      - name: The rendering criteria were given a browser
        run: |
          node scripts/ultra11y.mjs check --in audits/audit-latest.json \
            --standard rgaa --require-rendered

  action:
    # HAND-DISPATCHED ONLY. This is the heaviest job in the file — it installs the browser
    # tier, serves a site, crawls it and drives four full invocations of the shipped action —
    # and it was running on every push and every pull request.
    #
    # Know what this costs, because it is not free: `action.yml` is consumed as
    # `maxgfr/ultra11y@vN` by other repositories, its bash cannot be proved by reading YAML,
    # and the contract tests in tests/action.test.ts PARSE it rather than run it. A composite
    # action can be green in every one of them and still broken for every consumer — which is
    # exactly what happened the day `npm i --omit=dev` silently installed nothing. This job is
    # the only thing here that would have caught it, and it now only runs when someone asks.
    #
    # So: run it by hand (Actions → CI → Run workflow) before releasing anything that touches
    # `action.yml`, or re-enable it by deleting this `if:`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A flaky install step once hung this job for 3h27 (GitHub's default job timeout is
    # 6h); the real work needs ~10 minutes, and the browser download is cached below, so
    # the ceiling only has to cover one slow-CDN download per Playwright version.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The browser tier is the repository's own, pinned by pnpm-lock.yaml, so the scan
      # below resolves @playwright/test + @axe-core/playwright at the SAME versions whose
      # browsers `playwright install` then downloads. The previous
      # `npm i --no-save --omit=dev @playwright/test @axe-core/playwright` installed
      # NOTHING once those packages became devDependencies of this repo: npm applies
      # --omit=dev to named specs already declared there ("up to date"), so
      # `scan --runtime auto` silently degraded to Docker — whose container cannot reach
      # 127.0.0.1 on the host (ERR_CONNECTION_REFUSED), and the job went red on every push.
      # Both are runtime `dependencies` now, so that particular trap cannot recur; the plain
      # `pnpm install` below is still what pins them, and the browser is still its own step.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Report-only over a fixture with known defects. `sarif: false` keeps the job free of
      # `security-events: write`, so it runs on a fork's PR too.
      - name: Run the action on a non-conforming fixture
        id: audit
        uses: ./
        with:
          paths: tests/fixtures/non-conforming/bad.html
          standard: rgaa
          since: ""
          fail-on: ""
          sarif: "false"
          comment: "false"
          artifact-name: action-e2e-code

      - name: It reports what it found, through its declared outputs
        env:
          FINDINGS: ${{ steps.audit.outputs.findings }}
          CONFORMANCE: ${{ steps.audit.outputs.conformance }}
          REPORT: ${{ steps.audit.outputs.report-path }}
        run: |
          echo "findings=$FINDINGS conformance=$CONFORMANCE report=$REPORT"
          [ "$FINDINGS" -gt 0 ] || { echo "::error::the action reported no finding on a fixture built to fail"; exit 1; }
          [ -s "$REPORT" ] || { echo "::error::no report written at '$REPORT'"; exit 1; }
          grep -q "RGAA" "$REPORT" || { echo "::error::the report is not keyed on the requested standard"; exit 1; }
          # The per-page step must degrade, not fail, when nothing was scanned.
          if [ -d audits/pages ]; then
            echo "::error::per-page dossiers written with no page in scope"; exit 1
          fi
          echo "ok"

      # The adjudication tier, on the one path CI can prove for free: NO key in the
      # environment. The tier must then evaporate — the job stays green and the report is
      # still written, with the judgment criteria still « to assess ». That is not a corner
      # case: it is exactly what a fork's pull request looks like, where secrets are never
      # exposed. The keyed path costs money per run, so it lives in a dispatchable workflow
      # (.github/workflows/adjudication.yml) instead of on every push.
      - name: The adjudication tier degrades when no key is present
        id: keyless
        uses: ./
        with:
          paths: tests/fixtures/non-conforming/bad.html
          since: ""
          fail-on: ""
          sarif: "false"
          comment: "false"
          adjudicate: api
          artifact-name: action-e2e-keyless-adjudication

      - name: It still produced its report rather than dying on a missing secret
        env:
          REPORT: ${{ steps.keyless.outputs.report-path }}
          FINDINGS: ${{ steps.keyless.outputs.findings }}
        run: |
          if [ ! -s "$REPORT" ]; then
            echo "::error::the keyless adjudication path swallowed the report"; exit 1
          fi
          if [ "$FINDINGS" -le 0 ]; then
            echo "::error::the keyless adjudication path lost the findings"; exit 1
          fi
          echo "ok"

      # The gate is the half a red build depends on, so prove it goes red — and that every
      # surface above it was still produced first.
      - name: The gate fails the job on a blocking finding
        run: |
          rm -rf audits
          if node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" audit tests/fixtures/non-conforming/bad.html --fail-on blocking; then
            echo "::error::the gate passed a fixture with blocking non-conformities"; exit 1
          fi

      # The page-by-page half: a real browser over a served page, snapshotted, folded into the
      # audit and rendered as per-page dossiers. This is the path the whole feature exists for,
      # and the one no unit test can reach. The packages were installed by `pnpm install`
      # above; what is still missing is only the browser binary itself — cached the same way
      # as browser-tier's, so a cache hit skips the ~170MB download.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the browser tier
        # NO --with-deps: it shells out to apt, which on the Azure runners hangs for
        # 30min+ whenever their ubuntu mirror (azure.archive.ubuntu.com) misbehaves —
        # measured twice today, once for 3h27. The GitHub ubuntu image ships Chrome
        # stable and its libraries, which is everything chromium-for-testing needs.
        run: pnpm exec playwright install chromium

      - name: Serve a two-page site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cat > "$RUNNER_TEMP/site/index.html" <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Accueil</title></head>
          <body><main><h1>Accueil</h1><a href="/contact.html">Contact</a></main></body></html>
          HTML
          cat > "$RUNNER_TEMP/site/contact.html" <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Contact</title></head>
          <body><main><h1>Contact</h1><img src="a.png"></main></body></html>
          HTML
          (cd "$RUNNER_TEMP/site" && nohup python3 -m http.server 8931 > /dev/null 2>&1 &)
          attempt=0
          until curl -sSf -o /dev/null http://127.0.0.1:8931/; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then echo "::error::the two-page fixture server never came up"; exit 1; fi
            sleep 1
          done

      - name: Crawl, scan, snapshot and report page by page
        uses: ./
        with:
          paths: tests/fixtures/conforming
          standard: rgaa
          since: ""
          fail-on: ""
          sarif: "false"
          comment: "false"
          # The target is a HOST loopback URL — a Docker container can never reach it, so
          # this scan MUST run on the local tier. With `auto` (the default) a broken local
          # install degrades silently to Docker and dies on ERR_CONNECTION_REFUSED, which is
          # exactly how this job stayed red for a day; forcing `local` turns the same
          # regression into an explicit "local tier unavailable" failure.
          runtime: local
          crawl: http://127.0.0.1:8931/
          crawl-max: "5"
          artifact-name: action-e2e-pages

      - name: Every crawled page is a snapshot, and has its own dossier
        run: |
          ls .ultra11y/pages
          for id in accueil contact-html; do
            [ -f ".ultra11y/pages/$id/dom.html" ] || { echo "::error::no snapshot for $id"; exit 1; }
            [ -f "audits/pages/page-$id.md" ] || { echo "::error::no per-page dossier for $id"; exit 1; }
          done
          # The point of snapshotting: the page-scoped rules run, so a page can be CONFORMING.
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" pages --in audits/audit-latest.json --standard rgaa --json > pages.json
          node -e '
            const p = require("./pages.json").pages;
            if (p.length < 2) { console.error("::error::expected the crawled pages in scope, got " + p.length); process.exit(1); }
            if (!p.every(x => x.basis === "snapshot")) { console.error("::error::a crawled page is not snapshot-based"); process.exit(1); }
            const contact = p.find(x => x.id === "contact-html");
            const accueil = p.find(x => x.id === "accueil");
            if (!contact || !accueil) { console.error("::error::a crawled page is missing from the grid"); process.exit(1); }
            if (contact.findings.length === 0) { console.error("::error::the alt-less image on /contact.html was not attributed to it"); process.exit(1); }
            if (accueil.findings.length !== 0) { console.error("::error::a finding leaked onto the clean page"); process.exit(1); }
            console.log("pages:", p.map(x => x.id + " " + x.conformancePct + "%").join(", "));
          '

      # THE BROWSER TIER THE ACTION BUILDS FOR ITSELF — the path a real consumer takes.
      #
      # Every step above runs with this repository's OWN Playwright resolved from its
      # node_modules, so `browser: auto` correctly finds a tier and skips installing. That
      # proves the leave-it-alone half and nothing else. A consumer of
      # `uses: maxgfr/ultra11y@v5` has no such node_modules — the action is a bare checkout —
      # which is the case that silently lost every rendering criterion, and the case no unit
      # test can stage because it parses the YAML rather than running it.
      #
      # `browser: install` forces the build regardless of what resolves here, so this step
      # exercises exactly that: npm into a scratch prefix, `playwright install chromium`, and a
      # scan that resolves Playwright from `--cwd <prefix>` instead of from the repo.
      - name: The action builds its own browser tier, and scans with it
        uses: ./
        with:
          paths: tests/fixtures/conforming
          standard: rgaa
          since: ""
          fail-on: ""
          sarif: "false"
          comment: "false"
          runtime: local
          browser: install
          urls: http://127.0.0.1:8931/
          artifact-name: action-e2e-browser-tier

      - name: The tier it built is the one the scan used
        run: |
          # The prefix exists and carries BOTH packages — a partial install that still let the
          # scan fall through to the repo's own Playwright would pass every other assertion
          # here while proving nothing.
          for pkg in "@playwright/test" "@axe-core/playwright"; do
            test -d "$RUNNER_TEMP/ultra11y-browser/node_modules/$pkg" \
              || { echo "::error::the action did not install $pkg into its scratch prefix"; exit 1; }
          done
          test -d "$RUNNER_TEMP/ultra11y-browser/node_modules/.bin" || true
          # And the scan really produced a rendered verdict through it: a snapshot with the
          # measurement beside it, which is what makes a rendering criterion decidable at all.
          test -f .ultra11y/pages/accueil/probes.json \
            || { echo "::error::no probes.json — the tier was installed but the scan did not measure through it"; exit 1; }
          test -f .ultra11y/pages/accueil/axe.json \
            || { echo "::error::no axe.json — axe did not run through the installed tier"; exit 1; }
          node -e '
            const a = JSON.parse(require("fs").readFileSync("audits/audit-latest.json", "utf8"));
            const cov = (a.scope.pageCoverage || {})["accueil"] || {};
            if (!cov.axe) { console.error("::error::pageCoverage.axe is not set — axe did not run"); process.exit(1); }
            if (!(cov.scs || []).length) { console.error("::error::no probed criteria recorded"); process.exit(1); }
            console.log("browser tier built by the action measured:", (cov.scs || []).join(", "));
          '

      # …and through the ACTION's own input, which is the surface a consumer actually wires.
      # The CLI checks below prove the logic; this proves the WIRING — input to step to Gate.
      # They are different failures, and the second one is invisible: an input that never
      # reaches its step leaves a job green forever, which is how a gate gets trusted for
      # months while doing nothing.
      - name: Declare a page this run never captured
        run: |
          cat > .ultra11yrc.json <<'RC'
          { "standard": "rgaa", "sample": { "pages": [
            { "id": "accueil", "name": "Accueil", "url": "http://127.0.0.1:8931/" },
            { "id": "jamais-balayee", "name": "Jamais balayée", "url": "http://127.0.0.1:8931/nope.html" }
          ] } }
          RC

      - name: The action's require-sample input fails the job on it
        id: coverage-gate
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/conforming
          standard: rgaa
          since: ""
          fail-on: ""
          sarif: "false"
          comment: "false"
          report: "false"
          html: "false"
          require-sample: "true"
          artifact-name: action-e2e-coverage

      - name: …and it is the gate that failed, not a crash
        run: |
          set -euo pipefail
          rm -f .ultra11yrc.json
          [ "${{ steps.coverage-gate.outcome }}" = "failure" ] || {
            echo "::error::require-sample left the job green on a sample declaring an uncaptured page"; exit 1; }
          echo "the action's coverage gate engaged and failed the job, as it must"

      # THE COVERAGE GATE, both ways. A gate is only worth having if it can also FAIL, and a
      # green-but-inactive one is the exact failure it exists to prevent — the run it was built
      # for shipped 20 of 35 declared pages, green, naming none of the missing fifteen.
      - name: The sample-coverage gate passes when every declared page was captured
        run: |
          set -euo pipefail
          cat > .ultra11yrc.json <<'RC'
          { "standard": "rgaa", "sample": { "pages": [
            { "id": "accueil", "name": "Accueil", "url": "http://127.0.0.1:8931/" },
            { "id": "contact-html", "name": "Contact", "url": "http://127.0.0.1:8931/contact.html" }
          ] } }
          RC
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" check --require-sample --standard rgaa

      - name: …and FAILS, naming the page, when one was declared and never captured
        run: |
          set -euo pipefail
          cat > .ultra11yrc.json <<'RC'
          { "standard": "rgaa", "sample": { "pages": [
            { "id": "accueil", "name": "Accueil", "url": "http://127.0.0.1:8931/" },
            { "id": "jamais-balayee", "name": "Jamais balayée", "url": "http://127.0.0.1:8931/nope.html" }
          ] } }
          RC
          out=$(node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" check --require-sample --standard rgaa 2>&1) && {
            echo "::error::the coverage gate passed on an uncaptured declared page"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "Jamais balayée" || { echo "::error::the gate did not NAME the missing page"; exit 1; }
          rm -f .ultra11yrc.json

      # The page-by-page comment, on the only audit in this repo that actually carries pages.
      # The DOCUMENT is unit-tested (tests/pr-comment-pages.test.ts, against the same
      # projections); what only an integration can prove is that the kind threads from the
      # environment through the shipped BUNDLE on a real audit. Rendered, never posted:
      # `comment: 'true'` here would write on this repository's own pull requests.
      - name: The page-by-page comment renders from the shipped bundle
        env:
          ULTRA11Y_PR_COMMENT: "1"
          ULTRA11Y_PR_COMMENT_KIND: pages
          ULTRA11Y_ARTIFACT_NAME: action-e2e-pages
        run: |
          set -euo pipefail
          # NO PULL REQUEST IN VIEW, whatever event this workflow is running on.
          #
          # The assertions below read « skipped », which is what `pushPrComment` reports when
          # `prNumberFromEnv` finds no pull request. That held while this step only ever ran on
          # a push, and broke the first time CI ran on a `pull_request`: GITHUB_REF is then
          # `refs/pull/<n>/merge`, so the engine found a PR, reached for `gh`, failed on the
          # missing token, and the step went red on a change that had nothing to do with it.
          #
          # `env -u` and not a step-level `env:` — a step's env map does not reliably override
          # a runner-provided default variable, and the version that tried it still read the
          # pull request. Unsetting it for the child process is not a matter of precedence.
          render() { env -u GITHUB_REF -u ULTRA11Y_PR node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" report \
            --in audits/audit-latest.json --standard rgaa --lang fr --format github > /dev/null 2> "$1"; }
          render comment.log
          # With no pull request in view the post is skipped — and reaching "skipped" is exactly
          # what proves the render ran first, since it is rendered before it is pushed.
          grep -qi "ignoré\|skipped" comment.log || { echo "::error::the pages comment path did not run"; cat comment.log; exit 1; }
          # A kind the engine does not know must fall back to the digest, never to silence.
          ULTRA11Y_PR_COMMENT_KIND=nonsense render fallback.log
          grep -qi "ignoré\|skipped" fallback.log || { echo "::error::an unknown comment-kind silenced the comment"; cat fallback.log; exit 1; }

      # THE COMPENSATING CONTROL. The action's `HTML report` step degrades to a ::warning:: on
      # purpose — a rendering bug must never become a red accessibility gate — which means
      # nothing over there can catch a front door that stopped being produced. These
      # assertions are therefore NOT optional.
      - name: The artifact has a front door, and it is self-contained
        run: |
          [ -f audits/index.html ] || { echo "::error::no audits/index.html — the artifact has no entry point"; exit 1; }
          ls audits/ultra11y-rgaa-*.html >/dev/null 2>&1 || { echo "::error::no detachable single-file report"; exit 1; }
          # NOTHING may point outside the artifact: it is read after being unzipped somewhere
          # else, so an absolute URL or a `../..` climb is a broken image for every reader. A
          # grep would wave `https://` through on a bad anchor, so this is parsed properly.
          node -e '
            const { readdirSync, readFileSync } = require("fs");
            let bad = 0;
            for (const f of readdirSync("audits").filter((x) => x.endsWith(".html"))) {
              const html = readFileSync("audits/" + f, "utf8");
              if (/<script/i.test(html)) { console.error("::error::" + f + " carries a script"); bad = 1; }
              for (const m of html.matchAll(/(?:src|href)="([^"]+)"/g)) {
                const ref = m[1];
                if (ref.startsWith("#") || ref.startsWith("data:")) continue;
                // At the artifact root, ANY climb escapes, and any scheme is remote.
                if (/^[a-z][a-z0-9+.-]*:/i.test(ref) || ref.split("/").includes("..") || ref.startsWith("/")) {
                  console.error("::error::" + f + " points outside the artifact: " + ref);
                  bad = 1;
                }
              }
            }
            process.exit(bad);
          '
          echo "front door: $(wc -c < audits/index.html) bytes"

      - name: Every non-conformity that could be shown, is
        run: |
          # /contact.html carries the alt-less image. It was snapshotted, so the pixel tier has
          # a capture, a box digest and a byte offset — it must produce a crop.
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" pages --in audits/audit-latest.json \
            --standard rgaa --format report --split page --evidence --html --out audits/pages
          crops=$(find audits/pages/assets -name '*.png' -path '*/*/*' 2>/dev/null | wc -l)
          [ "$crops" -gt 0 ] || { echo "::error::the evidence tier drew nothing on a snapshotted page with a real defect"; exit 1; }
          echo "crops: $crops"
          # The sheets illustrate their own occurrences, and the crop bullet never becomes one.
          grep -qE '^ *- !\[' audits/pages/page-contact-html.md || { echo "::error::no crop hung off an occurrence"; exit 1; }
          # THE CONTRACT: an illustrated sheet adjudicates EXACTLY like a bare one. The crop
          # bullet carries no `[ ]`, so `verify` must not see one more item — nor one fewer,
          # which is how an occurrence would escape adjudication by hiding under a picture.
          # Both runs pass --standard, or the pack sheet is parsed against WCAG ids and both
          # sides quietly collapse to a number that proves nothing.
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" pages --in audits/audit-latest.json \
            --standard rgaa --format report --split page --out "$RUNNER_TEMP/bare"
          count() { node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" verify --report "$1" --standard rgaa --json \
            | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).count'; }
          with=$(count audits/pages/page-contact-html.md)
          without=$(count "$RUNNER_TEMP/bare/page-contact-html.md")
          echo "verify worklist — illustrated: $with · bare: $without"
          [ "$with" = "$without" ] || { echo "::error::the crop sub-bullet changed the verify worklist ($with vs $without)"; exit 1; }
          [ "$with" -gt 0 ] || { echo "::error::the worklist is empty, so the comparison above proved nothing"; exit 1; }

      # An artifact is read AFTER being downloaded and unzipped, and `index.html` has to be at
      # its root for that to be one double-click. Only a real round trip proves it.
      - name: Upload what the action produced
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: action-e2e
          path: |
            audits/
            .ultra11y/pages/
          if-no-files-found: warn

      - uses: actions/download-artifact@v8
        with:
          name: action-e2e
          path: ${{ runner.temp }}/dl
      - name: index.html is at the root of the unzipped artifact
        run: |
          [ -f "$RUNNER_TEMP/dl/audits/index.html" ] || { echo "::error::index.html is not where a reader will look"; find "$RUNNER_TEMP/dl" -maxdepth 4 -print | head -40; exit 1; }
          # The images it references survived the round trip.
          missing=0
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            [ -f "$RUNNER_TEMP/dl/audits/pages/$src" ] || { echo "::error::missing after unzip: $src"; missing=1; }
          done < <(grep -rhoE 'src="\./[^"]+"' "$RUNNER_TEMP/dl/audits/pages/"*.html | sed 's/src="\.\///;s/"$//' | sort -u)
          [ "$missing" = 0 ] || exit 1
          echo "the artifact opens, and its images are in it"
