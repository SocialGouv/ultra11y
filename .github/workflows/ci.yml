name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the floor (engines.node >=22.18, what @babel/parser 8 requires);
        # 24 is current. The published bundle's Node 22 floor is covered by runtime-node-floor.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build is reproducible (committed bundles up to date)
        run: pnpm run check:build # tsup && copy-bundle && git diff --exit-code over both bundles

      - name: Test (with coverage)
        run: pnpm run test:coverage

      - name: Perf shape (own process — timing needs the machine to itself)
        run: pnpm run test:perf

      - name: Smoke-run the committed bundle (offline, fixture)
        run: pnpm run demo # audit -> report -> check -> criteria

      - name: Assert a report was produced
        run: ls /tmp/ultra11y-demo/wcag-*.md

  install-bundle:
    runs-on: ubuntu-latest
    name: install-bundle (skill installs whole, not just SKILL.md)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the embedded bundle
        run: pnpm run build

      - name: Verify the install-bundle shape (no root SKILL.md, engine in sync)
        run: pnpm run verify:bundle

      - name: End-to-end — `skills add` bundles the engine + references, not SKILL.md alone
        run: |
          WORK="$(mktemp -d)"
          cd "$WORK"
          npx --yes skills add "$GITHUB_WORKSPACE" --skill ultra11y --agent claude-code --copy -y
          DIR=.claude/skills/ultra11y
          test -f "$DIR/SKILL.md"             || { echo "::error::SKILL.md not installed"; exit 1; }
          test -f "$DIR/scripts/ultra11y.mjs" || { echo "::error::engine not bundled — skills add dropped scripts/"; exit 1; }
          test -d "$DIR/references"           || { echo "::error::references/ not bundled"; exit 1; }
          node "$DIR/scripts/ultra11y.mjs" --help > /dev/null || { echo "::error::installed engine does not run"; exit 1; }
          npx --yes skills add "$GITHUB_WORKSPACE" --skill review-a11y --agent claude-code --copy -y
          RDIR=.claude/skills/review-a11y
          test -f "$RDIR/SKILL.md"             || { echo "::error::review-a11y SKILL.md not installed"; exit 1; }
          test -f "$RDIR/scripts/ultra11y.mjs" || { echo "::error::review-a11y engine not bundled — skills add dropped scripts/"; exit 1; }
          node "$RDIR/scripts/ultra11y.mjs" --help > /dev/null || { echo "::error::review-a11y installed engine does not run"; exit 1; }
          echo "install-bundle: both skills installed whole and their engines run."

      # The PLUGIN half — the manifests + the PreToolUse guard, which is what makes the
      # review automatic. `skills add` never installs hooks, so nothing above covers it.
      - name: End-to-end — the PreToolUse guard decides correctly
        run: |
          GUARD="$GITHUB_WORKSPACE/hooks/pre-tool-use.mjs"
          WORK="$(mktemp -d)"; cd "$WORK"
          git init -q . && git config user.email ci@ci && git config user.name ci

          # A command that publishes nothing must be a silent no-op — this runs before
          # EVERY Bash call, so any output here would be noise on every shell command.
          payload() { printf '{"tool_name":"Bash","tool_input":{"command":"%s"},"cwd":"%s","session_id":"%s"}' "$1" "$WORK" "$2"; }
          out="$(payload 'ls -la' ci1 | node "$GUARD")"
          [ -z "$out" ] || { echo "::error::guard spoke on a non-git command: $out"; exit 1; }

          # A commit carrying a blocking non-conformity must deny and name the skill.
          printf '<!doctype html><html lang="en"><head><title>t</title></head><body><img src="a.png"></body></html>\n' > page.html
          git add page.html
          out="$(payload 'git commit -m wip' ci2 | node "$GUARD")"
          echo "$out" | grep -q '"permissionDecision":"deny"' || { echo "::error::guard did not deny a commit with a blocking finding: $out"; exit 1; }
          echo "$out" | grep -q 'review-a11y' || { echo "::error::guard did not point at the review-a11y skill: $out"; exit 1; }

          # And it must NOT fire twice on the same findings, or the commit could never land.
          out="$(payload 'git commit -m wip' ci2 | node "$GUARD")"
          [ -z "$out" ] || { echo "::error::guard fired twice on the same change — a retry would loop: $out"; exit 1; }

          # The documented escape hatch has to work, unconditionally.
          out="$(payload 'git commit -m wip' ci3 | SKIP_A11Y=1 node "$GUARD")"
          [ -z "$out" ] || { echo "::error::SKIP_A11Y=1 did not disable the guard: $out"; exit 1; }
          echo "install-bundle: the PreToolUse guard denies, points at the skill, does not loop, and honours SKIP_A11Y."

          # The same four assertions in the CODEX shape: the tool is `shell`, not `Bash`,
          # and the command is an argv ARRAY. Joining that array naively would put `git`
          # off a command position and the gate would silently never fire on Codex — so
          # this is the assertion that keeps that regression out. No Codex binary needed.
          cx() { printf '{"tool_name":"shell","tool_input":{"command":["bash","-lc","%s"]},"cwd":"%s","session_id":"%s"}' "$1" "$WORK" "$2"; }
          out="$(cx 'ls -la' cx1 | node "$GUARD")"
          [ -z "$out" ] || { echo "::error::guard spoke on a non-git codex command: $out"; exit 1; }
          out="$(cx 'git commit -m wip' cx2 | node "$GUARD")"
          echo "$out" | grep -q '"permissionDecision":"deny"' || { echo "::error::guard did not deny a codex-shaped commit: $out"; exit 1; }
          echo "$out" | grep -q 'review-a11y' || { echo "::error::codex-shaped denial did not name the skill: $out"; exit 1; }
          out="$(cx 'git commit -m wip' cx2 | node "$GUARD")"
          [ -z "$out" ] || { echo "::error::guard fired twice on the same codex-shaped change: $out"; exit 1; }
          out="$(cx 'git commit -m wip' cx3 | SKIP_A11Y=1 node "$GUARD")"
          [ -z "$out" ] || { echo "::error::SKIP_A11Y=1 did not disable the guard for codex: $out"; exit 1; }
          # BashOutput/KillShell poll a background shell; matching them would spawn the
          # 2.5 MB engine on every tick.
          for t in BashOutput KillShell Read; do
            out="$(printf '{"tool_name":"%s","tool_input":{"command":"git push"},"cwd":"%s","session_id":"cx4"}' "$t" "$WORK" | node "$GUARD")"
            [ -z "$out" ] || { echo "::error::guard reached for the $t tool: $out"; exit 1; }
          done
          echo "install-bundle: the guard behaves identically on Codex-shaped payloads."

      - name: The OpenCode plugin loads, and install --agents-md is idempotent
        run: |
          set -euo pipefail
          # OpenCode loads this straight off disk, outside any node_modules: a syntax error
          # or a bare import is a plugin that silently never loads.
          node --check .opencode/plugins/ultra11y.js
          node -e '
            const {readFileSync} = require("node:fs");
            const src = readFileSync(".opencode/plugins/ultra11y.js", "utf8");
            const foreign = [...src.matchAll(/^import .*? from ["\x27]([^"\x27]+)["\x27]/gm)].map(m => m[1]).filter(s => !s.startsWith("node:"));
            if (foreign.length) { console.error("::error::opencode plugin imports " + foreign.join(", ")); process.exit(1); }
            const pkg = require("./package.json");
            if (pkg.main !== ".opencode/plugins/ultra11y.js") { console.error("::error::package.json main must point at the opencode plugin"); process.exit(1); }
          '
          WORK="$(mktemp -d)"; cd "$WORK"
          git init -q . && git config user.email ci@ci && git config user.name ci
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" install --agents-md
          grep -q "BEGIN ultra11y" AGENTS.md || { echo "::error::install --agents-md wrote no managed block"; exit 1; }
          cp AGENTS.md /tmp/first.md
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" install --agents-md
          diff -q /tmp/first.md AGENTS.md || { echo "::error::install --agents-md is not idempotent"; exit 1; }
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" uninstall --agents-md
          [ ! -f AGENTS.md ] || { echo "::error::uninstall --agents-md left the file behind"; exit 1; }
          echo "install-bundle: the OpenCode plugin is loadable and install --agents-md round-trips."

  # The shipped scripts/ultra11y.mjs is an install-free bundle declaring
  # engines.node ">=22.18" (the floor @babel/parser 8 requires). This job runs ONLY
  # the committed bundle on that floor, with no install, to guarantee the published
  # ">=22.18" promise actually holds.
  runtime-node-floor:
    runs-on: ubuntu-latest
    name: runtime (Node 22 floor, install-free bundle)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit / report / check / criteria on the floor Node
        run: |
          node scripts/ultra11y.mjs audit tests/fixtures/non-conforming/bad.html --out "$RUNNER_TEMP/u" --json > /dev/null
          node scripts/ultra11y.mjs report --in "$RUNNER_TEMP/u/audit-latest.json" --out "$RUNNER_TEMP/u"
          node scripts/ultra11y.mjs check --report "$RUNNER_TEMP"/u/wcag-*.md
          node scripts/ultra11y.mjs criteria 1.1.1 | grep -q "Non-text Content"

      - name: JSX/TSX real-AST + cross-file audit runs on the floor (bundled @babel/parser)
        run: |
          node scripts/ultra11y.mjs audit "tests/fixtures/cross-file" --graph --dedup off --json > "$RUNNER_TEMP/jsx.json"
          node -e 'const a=require(process.env.RUNNER_TEMP+"/jsx.json"); if(!a.findings.some(f=>f.ruleId==="cross-icon-only-unnamed")){console.error("::error::JSX cross-file audit produced no finding on the floor Node");process.exit(1)}'

      - name: The check gate blocks an invented criterion (exit 1)
        run: |
          printf '## 1.\n## 2.\n- **9.9.9 — fake** — `x:1` (`d`)\n## 3.\n## 4.\n## 5.\n- **Rate** : 50%%\n' > "$RUNNER_TEMP/bad.md"
          if node scripts/ultra11y.mjs check --report "$RUNNER_TEMP/bad.md"; then
            echo "expected non-zero exit for an invented criterion"; exit 1
          fi

  # The shipped GitHub Action, EXECUTED. `tests/action.test.ts` parses action.yml and asserts
  # its shape; nothing ever ran it. A composite action is bash — arrays, `set -e`, conditionals
  # and heredoc-free quoting — and none of that is provable by reading the YAML. This job is to
  # the Action what `install-bundle` is to the skills: use the real thing, end to end.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Report-only over a fixture with known defects. `sarif: false` keeps the job free of
      # `security-events: write`, so it runs on a fork's PR too.
      - name: Run the action on a non-conforming fixture
        id: audit
        uses: ./
        with:
          paths: tests/fixtures/non-conforming/bad.html
          standard: rgaa
          since: ""
          fail-on: ""
          sarif: "false"
          comment: "false"
          artifact-name: action-e2e-code

      - name: It reports what it found, through its declared outputs
        env:
          FINDINGS: ${{ steps.audit.outputs.findings }}
          CONFORMANCE: ${{ steps.audit.outputs.conformance }}
          REPORT: ${{ steps.audit.outputs.report-path }}
        run: |
          echo "findings=$FINDINGS conformance=$CONFORMANCE report=$REPORT"
          [ "$FINDINGS" -gt 0 ] || { echo "::error::the action reported no finding on a fixture built to fail"; exit 1; }
          [ -s "$REPORT" ] || { echo "::error::no report written at '$REPORT'"; exit 1; }
          grep -q "RGAA" "$REPORT" || { echo "::error::the report is not keyed on the requested standard"; exit 1; }
          # The per-page step must degrade, not fail, when nothing was scanned.
          if [ -d audits/pages ]; then
            echo "::error::per-page dossiers written with no page in scope"; exit 1
          fi
          echo "ok"

      # The adjudication tier, on the one path CI can prove for free: NO key in the
      # environment. The tier must then evaporate — the job stays green and the report is
      # still written, with the judgment criteria still « to assess ». That is not a corner
      # case: it is exactly what a fork's pull request looks like, where secrets are never
      # exposed. The keyed path costs money per run, so it lives in a dispatchable workflow
      # (.github/workflows/adjudication.yml) instead of on every push.
      - name: The adjudication tier degrades when no key is present
        id: keyless
        uses: ./
        with:
          paths: tests/fixtures/non-conforming/bad.html
          since: ""
          fail-on: ""
          sarif: "false"
          comment: "false"
          adjudicate: api
          artifact-name: action-e2e-keyless-adjudication

      - name: It still produced its report rather than dying on a missing secret
        env:
          REPORT: ${{ steps.keyless.outputs.report-path }}
          FINDINGS: ${{ steps.keyless.outputs.findings }}
        run: |
          if [ ! -s "$REPORT" ]; then
            echo "::error::the keyless adjudication path swallowed the report"; exit 1
          fi
          if [ "$FINDINGS" -le 0 ]; then
            echo "::error::the keyless adjudication path lost the findings"; exit 1
          fi
          echo "ok"

      # The gate is the half a red build depends on, so prove it goes red — and that every
      # surface above it was still produced first.
      - name: The gate fails the job on a blocking finding
        run: |
          rm -rf audits
          if node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" audit tests/fixtures/non-conforming/bad.html --fail-on blocking; then
            echo "::error::the gate passed a fixture with blocking non-conformities"; exit 1
          fi

      # The page-by-page half: a real browser over a served page, snapshotted, folded into the
      # audit and rendered as per-page dossiers. This is the path the whole feature exists for,
      # and the one no unit test can reach.
      # `scan --runtime auto` resolves Playwright from the working directory, so the browser
      # tier has to live in THIS repo's tree. `--omit=dev` keeps npm from also pulling the
      # whole devDependency tree (semantic-release, vitest, tsup…) that this job never uses.
      - name: Install the browser tier
        run: |
          npm i --no-audit --no-fund --no-save --omit=dev @playwright/test @axe-core/playwright
          npx playwright install --with-deps chromium

      - name: Serve a two-page site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cat > "$RUNNER_TEMP/site/index.html" <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Accueil</title></head>
          <body><main><h1>Accueil</h1><a href="/contact.html">Contact</a></main></body></html>
          HTML
          cat > "$RUNNER_TEMP/site/contact.html" <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Contact</title></head>
          <body><main><h1>Contact</h1><img src="a.png"></main></body></html>
          HTML
          (cd "$RUNNER_TEMP/site" && nohup python3 -m http.server 8931 > /dev/null 2>&1 &)
          for i in $(seq 1 30); do curl -sSf -o /dev/null http://127.0.0.1:8931/ && break; sleep 1; done

      - name: Crawl, scan, snapshot and report page by page
        uses: ./
        with:
          paths: tests/fixtures/conforming
          standard: rgaa
          since: ""
          fail-on: ""
          sarif: "false"
          comment: "false"
          crawl: http://127.0.0.1:8931/
          crawl-max: "5"
          artifact-name: action-e2e-pages

      - name: Every crawled page is a snapshot, and has its own dossier
        run: |
          ls .ultra11y/pages
          for id in accueil contact-html; do
            [ -f ".ultra11y/pages/$id/dom.html" ] || { echo "::error::no snapshot for $id"; exit 1; }
            [ -f "audits/pages/page-$id.md" ] || { echo "::error::no per-page dossier for $id"; exit 1; }
          done
          # The point of snapshotting: the page-scoped rules run, so a page can be CONFORMING.
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" pages --in audits/audit-latest.json --standard rgaa --json > pages.json
          node -e '
            const p = require("./pages.json").pages;
            if (p.length < 2) { console.error("::error::expected the crawled pages in scope, got " + p.length); process.exit(1); }
            if (!p.every(x => x.basis === "snapshot")) { console.error("::error::a crawled page is not snapshot-based"); process.exit(1); }
            const contact = p.find(x => x.id === "contact-html");
            const accueil = p.find(x => x.id === "accueil");
            if (!contact || !accueil) { console.error("::error::a crawled page is missing from the grid"); process.exit(1); }
            if (contact.findings.length === 0) { console.error("::error::the alt-less image on /contact.html was not attributed to it"); process.exit(1); }
            if (accueil.findings.length !== 0) { console.error("::error::a finding leaked onto the clean page"); process.exit(1); }
            console.log("pages:", p.map(x => x.id + " " + x.conformancePct + "%").join(", "));
          '

      # THE COVERAGE GATE, both ways. A gate is only worth having if it can also FAIL, and a
      # green-but-inactive one is the exact failure it exists to prevent — the run it was built
      # for shipped 20 of 35 declared pages, green, naming none of the missing fifteen.
      - name: The sample-coverage gate passes when every declared page was captured
        run: |
          set -euo pipefail
          cat > .ultra11yrc.json <<'RC'
          { "standard": "rgaa", "sample": { "pages": [
            { "id": "accueil", "name": "Accueil", "url": "http://127.0.0.1:8931/" },
            { "id": "contact-html", "name": "Contact", "url": "http://127.0.0.1:8931/contact.html" }
          ] } }
          RC
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" check --require-sample --standard rgaa

      - name: …and FAILS, naming the page, when one was declared and never captured
        run: |
          set -euo pipefail
          cat > .ultra11yrc.json <<'RC'
          { "standard": "rgaa", "sample": { "pages": [
            { "id": "accueil", "name": "Accueil", "url": "http://127.0.0.1:8931/" },
            { "id": "jamais-balayee", "name": "Jamais balayée", "url": "http://127.0.0.1:8931/nope.html" }
          ] } }
          RC
          out=$(node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" check --require-sample --standard rgaa 2>&1) && {
            echo "::error::the coverage gate passed on an uncaptured declared page"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "Jamais balayée" || { echo "::error::the gate did not NAME the missing page"; exit 1; }
          rm -f .ultra11yrc.json

      # The page-by-page comment, on the only audit in this repo that actually carries pages.
      # The DOCUMENT is unit-tested (tests/pr-comment-pages.test.ts, against the same
      # projections); what only an integration can prove is that the kind threads from the
      # environment through the shipped BUNDLE on a real audit. Rendered, never posted:
      # `comment: 'true'` here would write on this repository's own pull requests.
      - name: The page-by-page comment renders from the shipped bundle
        env:
          ULTRA11Y_PR_COMMENT: "1"
          ULTRA11Y_PR_COMMENT_KIND: pages
          ULTRA11Y_ARTIFACT_NAME: action-e2e-pages
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" report --in audits/audit-latest.json \
            --standard rgaa --lang fr --format github > /dev/null 2> comment.log
          # Off a pull request the post is skipped — and reaching "skipped" is exactly what
          # proves the render ran first, since it is rendered before it is pushed.
          grep -qi "ignoré\|skipped" comment.log || { echo "::error::the pages comment path did not run"; cat comment.log; exit 1; }
          # A kind the engine does not know must fall back to the digest, never to silence.
          ULTRA11Y_PR_COMMENT_KIND=nonsense node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" report \
            --in audits/audit-latest.json --standard rgaa --lang fr --format github > /dev/null 2> fallback.log
          grep -qi "ignoré\|skipped" fallback.log || { echo "::error::an unknown comment-kind silenced the comment"; cat fallback.log; exit 1; }

      # THE COMPENSATING CONTROL. The action's `HTML report` step degrades to a ::warning:: on
      # purpose — a rendering bug must never become a red accessibility gate — which means
      # nothing over there can catch a front door that stopped being produced. These
      # assertions are therefore NOT optional.
      - name: The artifact has a front door, and it is self-contained
        run: |
          [ -f audits/index.html ] || { echo "::error::no audits/index.html — the artifact has no entry point"; exit 1; }
          ls audits/ultra11y-rgaa-*.html >/dev/null 2>&1 || { echo "::error::no detachable single-file report"; exit 1; }
          # NOTHING may point outside the artifact: it is read after being unzipped somewhere
          # else, so an absolute URL or a `../..` climb is a broken image for every reader. A
          # grep would wave `https://` through on a bad anchor, so this is parsed properly.
          node -e '
            const { readdirSync, readFileSync } = require("fs");
            let bad = 0;
            for (const f of readdirSync("audits").filter((x) => x.endsWith(".html"))) {
              const html = readFileSync("audits/" + f, "utf8");
              if (/<script/i.test(html)) { console.error("::error::" + f + " carries a script"); bad = 1; }
              for (const m of html.matchAll(/(?:src|href)="([^"]+)"/g)) {
                const ref = m[1];
                if (ref.startsWith("#") || ref.startsWith("data:")) continue;
                // At the artifact root, ANY climb escapes, and any scheme is remote.
                if (/^[a-z][a-z0-9+.-]*:/i.test(ref) || ref.split("/").includes("..") || ref.startsWith("/")) {
                  console.error("::error::" + f + " points outside the artifact: " + ref);
                  bad = 1;
                }
              }
            }
            process.exit(bad);
          '
          echo "front door: $(wc -c < audits/index.html) bytes"

      - name: Every non-conformity that could be shown, is
        run: |
          # /contact.html carries the alt-less image. It was snapshotted, so the pixel tier has
          # a capture, a box digest and a byte offset — it must produce a crop.
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" pages --in audits/audit-latest.json \
            --standard rgaa --format report --split page --evidence --html --out audits/pages
          crops=$(find audits/pages/assets -name '*.png' -path '*/*/*' 2>/dev/null | wc -l)
          [ "$crops" -gt 0 ] || { echo "::error::the evidence tier drew nothing on a snapshotted page with a real defect"; exit 1; }
          echo "crops: $crops"
          # The sheets illustrate their own occurrences, and the crop bullet never becomes one.
          grep -qE '^ *- !\[' audits/pages/page-contact-html.md || { echo "::error::no crop hung off an occurrence"; exit 1; }
          # THE CONTRACT: an illustrated sheet adjudicates EXACTLY like a bare one. The crop
          # bullet carries no `[ ]`, so `verify` must not see one more item — nor one fewer,
          # which is how an occurrence would escape adjudication by hiding under a picture.
          # Both runs pass --standard, or the pack sheet is parsed against WCAG ids and both
          # sides quietly collapse to a number that proves nothing.
          node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" pages --in audits/audit-latest.json \
            --standard rgaa --format report --split page --out "$RUNNER_TEMP/bare"
          count() { node "$GITHUB_WORKSPACE/scripts/ultra11y.mjs" verify --report "$1" --standard rgaa --json \
            | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).count'; }
          with=$(count audits/pages/page-contact-html.md)
          without=$(count "$RUNNER_TEMP/bare/page-contact-html.md")
          echo "verify worklist — illustrated: $with · bare: $without"
          [ "$with" = "$without" ] || { echo "::error::the crop sub-bullet changed the verify worklist ($with vs $without)"; exit 1; }
          [ "$with" -gt 0 ] || { echo "::error::the worklist is empty, so the comparison above proved nothing"; exit 1; }

      # An artifact is read AFTER being downloaded and unzipped, and `index.html` has to be at
      # its root for that to be one double-click. Only a real round trip proves it.
      - name: Upload what the action produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-e2e
          path: |
            audits/
            .ultra11y/pages/
          if-no-files-found: warn

      - uses: actions/download-artifact@v4
        with:
          name: action-e2e
          path: ${{ runner.temp }}/dl
      - name: index.html is at the root of the unzipped artifact
        run: |
          [ -f "$RUNNER_TEMP/dl/audits/index.html" ] || { echo "::error::index.html is not where a reader will look"; ls -R "$RUNNER_TEMP/dl" | head -40; exit 1; }
          # The images it references survived the round trip.
          missing=0
          for src in $(grep -rhoE 'src="\./[^"]+"' "$RUNNER_TEMP/dl/audits/pages/"*.html | sed 's/src="\.\///;s/"$//' | sort -u); do
            [ -f "$RUNNER_TEMP/dl/audits/pages/$src" ] || { echo "::error::missing after unzip: $src"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          echo "the artifact opens, and its images are in it"
