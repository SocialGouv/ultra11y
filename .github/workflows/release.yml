name: Release

# Conventional-Commit-driven releases, fully in CI. After CI succeeds on `main`,
# semantic-release checks out that exact validated SHA and, when its commits
# warrant one (feat → minor, fix → patch, `!`/BREAKING → major):
#   - computes the next version and syncs it across package.json / src/types.ts /
#     SKILL.md / CHANGELOG.md and rebuilds the bundle (scripts/sync-version.mjs),
#   - commits the bump back to `main` as `chore(release): <v> [skip ci]`,
#   - tags `v<version>` and creates the GitHub release with auto notes + tarball,
#   - publishes the `ultra11y` package to the npm registry.
#
# NO NPM TOKEN. The npm publish authenticates by OIDC "trusted publishing": the job asks
# GitHub for a short-lived OIDC id-token (hence `id-token: write`) and exchanges it with
# registry.npmjs.org for a publish credential scoped to this package. Nothing long-lived is
# stored anywhere, so there is no secret to leak or rotate.
#
# It requires, on npmjs.com → the package → Settings → Trusted publisher: this repository and
# THIS workflow file (`release.yml`). Change the file name and the exchange stops matching.
# The GitHub side still uses the built-in GITHUB_TOKEN.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch: {}

# Serialise releases, never cancel one: the publish chain (bump commit → tag → GitHub
# release → npm OIDC publish) is not atomic, and a semantic-release killed mid-flight
# leaves a tag with no release or an unpublished version that the next run then has to
# reconcile by hand. Two pushes landing close together QUEUE, they don't race.
concurrency:
  group: release

permissions:
  contents: write # push the bump commit + tag, create the release
  issues: write
  pull-requests: write
  id-token: write # REQUIRED for npm trusted publishing (the OIDC token exchange)

jobs:
  release:
    # A push and an explicit CI dispatch on main are both reviewed release intents. Never
    # publish a pull-request merge ref, a failed run, or a CI run from another branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    # install + full gate + semantic-release + npm publish; nothing here needs GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # full history + tags, required to analyze commits since last release
          persist-credentials: true # let @semantic-release/git push the bump commit

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org # the registry `npm publish` targets

      # The OIDC exchange that actually publishes is done by the npm CLI, not by
      # semantic-release: the plugin only pre-flights it. Trusted publishing landed in npm
      # 11.5.1, and Node 24 still ships an older 11.x — so pin the CLI explicitly rather than
      # inherit whatever the runner image happens to carry.
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A direct manual release is still safe: unlike workflow_run it has no successful CI
      # proof attached, so it performs the gates here. The normal path skips this duplicate.
      - name: Gate direct manual release — typecheck / lint / test / reproducible bundles
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm test
          pnpm run check:build

      # No NPM_TOKEN: @semantic-release/npm establishes the OIDC context itself
      # (lib/trusted-publishing/) and skips token auth entirely when it succeeds. If the
      # exchange fails — no trusted publisher configured, or the workflow renamed — it logs
      # the reason and falls back to demanding a token, which is the honest failure.
      - name: Release (semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      # `uses: maxgfr/ultra11y@v<major>` has to resolve to something. semantic-release only creates
      # the exact `v<version>` tag, so move the major alias onto it. Idempotent: when no
      # release happened, package.json still holds the previous version and the alias is
      # already there. The generated workflow (`init --ci`) pins the exact version instead —
      # this alias exists for users who prefer to track the major line.
      - name: Move the major-version tag
        run: |
          v=$(node -p "require('./package.json').version")
          major="v${v%%.*}"
          if ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "No tag v$v — no release was cut; leaving $major where it is."
            exit 0
          fi
          git tag -f "$major" "v$v"
          git push -f origin "refs/tags/$major"
          echo "$major → v$v"
