name: ACT corpus refresh

# Daily re-fetch of the W3C ACT-Rules Community Group test corpus vendored at
# scripts/vendor/act-testcases.json. The corpus is this engine's only externally
# authored yardstick, so a stale snapshot quietly turns the conformance matrix in
# skills/ultra11y/references/act.md into a claim about last year's rules.
#
#   - nothing changed upstream -> green no-op.
#   - changed + every gate green -> commit + push straight to main, then trigger
#     release.yml and ci.yml explicitly (a GITHUB_TOKEN push does NOT trigger them).
#   - any gate red -> nothing is pushed and no PR is opened; the run fails and the
#     next daily cron retries. A red run is the signal to look at it by hand — most
#     likely a NEW upstream rule that must be classified in src/act.ts, or a rule
#     whose examples changed and now trip the precision gate.
on:
  schedule:
    - cron: "20 5 * * *" # daily; minute/hour offset staggered per repo to spread load
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency: act-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-fetch the ACT corpus
        run: node scripts/build-act-corpus.mjs --refresh

      - name: Regenerate the published conformance matrix
        run: pnpm run build:act

      - name: Detect a change
        id: detect
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/vendor/act-testcases.json skills/ultra11y/references/act.md; then
            echo "corpus and matrix unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff --stat -- scripts/vendor/act-testcases.json skills/ultra11y/references/act.md
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Typecheck
        if: steps.detect.outputs.changed == 'true'
        run: pnpm run typecheck

      - name: Lint
        if: steps.detect.outputs.changed == 'true'
        run: pnpm run lint

      - name: Test (with coverage)
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -o pipefail
          # A new upstream rule fails the "no rule slips in unclassified" gate, and a
          # precision regression fails the false-positive gate. Both are meant to stop
          # this job — never pass -u/--update to paper over a golden.
          pnpm run test:coverage | tee /tmp/test-output.log

      - name: Build is reproducible (committed bundles up to date)
        if: steps.detect.outputs.changed == 'true'
        run: pnpm run check:build

      - name: Smoke-run the committed bundle (offline, fixture)
        if: steps.detect.outputs.changed == 'true'
        run: pnpm run demo

      - name: Commit and push the refreshed corpus to main
        if: steps.detect.outputs.changed == 'true'
        run: |
          SUMMARY=$(sed -E 's/\x1b\[[0-9;]*m//g' /tmp/test-output.log | grep -E "Test Files|Tests" | tail -2 || true)
          git add scripts/vendor/act-testcases.json skills/ultra11y/references/act.md
          git commit \
            -m "chore(act): refresh the vendored W3C ACT test corpus" \
            -m "automated refresh, all gates green" \
            -m "${SUMMARY:-no test summary captured}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Trigger release.yml and ci.yml on main
        if: steps.detect.outputs.changed == 'true'
        run: |
          gh workflow run release.yml --ref main
          gh workflow run ci.yml --ref main
