# One paid, exhaustive path. The ordinary CI replays the committed ledger for free; this
# manual workflow deliberately starts from an empty run ledger so it proves that the keyed
# Claude transport, the composite Action and the browser tier still work.
#
# Cost controls are fixed rather than dispatch inputs: Haiku, low effort, batches of eight,
# and up to three adjudication passes over residue only.
#
# THE CLI CEILING IS PER INVOCATION. Not per pass, and not per run. 106 RGAA criteria make at
# most 14 batches, so $0.35 puts a NOMINAL full pass around $4.90 and three nominal passes
# around $14.70 -- nominal, because nothing enforces either number. A transport retry starts a
# fresh process with a fresh ceiling, and a batch the ceiling aborts is halved and requeued with
# a fresh ceiling per half. Read those figures as an order of magnitude, never as a cap.
#
# And size the ceiling above what one batch actually costs at the chosen model and effort:
# below that, every batch aborts and is paid for anyway. $0.35 is calibrated for Haiku at `low`
# on this nine-page fixture (measured: ~$2.9 for 13 batches). It is NOT a figure to copy onto a
# bigger model, a higher effort, or a repository with more evidence per criterion. One composite
# invocation performs one audit and one unbounded crawl; there is no baseline pass, refutation
# fold or runner matrix duplicating that work.
name: Adjudication (keyed)

on:
  workflow_dispatch: {}

permissions:
  contents: read

# A second paid dispatch waits instead of racing the first and buying the same verdicts twice.
concurrency:
  group: adjudication-keyed
  cancel-in-progress: false

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # This repository uses the Claude subscription/OAuth transport. Do not expose an API key:
      # it would make the billing route ambiguous and is unnecessary for `--runner cli`.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Serve the nine-page fixture
        run: |
          nohup python3 -m http.server 8932 --directory tests/fixtures/realworld > /tmp/fixture.log 2>&1 &
          deadline=$(( SECONDS + 30 ))
          until curl -sSf -o /dev/null http://127.0.0.1:8932/; do
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::the fixture server never came up"
              cat /tmp/fixture.log
              exit 1
            fi
            sleep 1
          done

      - name: Require the Claude subscription credential
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is required for the keyed Haiku run"
            exit 1
          fi

      # The Action owns the complete acquisition and first judgment phase: one source audit,
      # one crawl with no page cap, then batched Haiku adjudication. FRESH_LEDGER does not exist
      # before this step, so no committed verdict can make the paid path a no-op; accepted
      # verdicts are nevertheless checkpointed there and survive in the final artifact.
      - name: Audit, crawl and adjudicate once
        uses: ./
        with:
          paths: tests/fixtures/realworld
          standard: rgaa
          lang: fr
          since: ""
          fail-on: ""
          sarif: "false"
          annotations: "false"
          comment: "false"
          report: "false"
          html: "false"
          evidence: "false"
          # One compact status document is written both to the visible job summary and to the
          # artifact. No HTML, screenshots, evidence crops or remediation/fix report.
          pages-report: compact
          artifact-name: adjudication-rgaa-haiku
          artifact-retention-days: "14"
          adjudicate: agent
          adjudicate-runner: cli
          adjudicate-grain: worklist
          adjudicate-model: haiku
          adjudicate-effort: low
          # Per batch: ceil(106 / 8) × $0.35 = $4.90/pass, $14.70 for three nominal passes.
          adjudicate-budget-usd: "0.35"
          adjudicate-passes: "3"
          ledger: audits/fresh-rgaa-ledger.json
          crawl: http://127.0.0.1:8932/
          crawl-max: "0"
          runtime: local
          require-rendered: "true"
          # NOT `pages`, AND NOT `true` EITHER — this lane must not go red because a model
          # said « I do not know ».
          #
          # An adjudicator that answers `manual / undecidable` on a judgment criterion is
          # behaving correctly: several RGAA criteria ask whether information is carried by
          # colour alone, whether a reading order survives without CSS, whether every button
          # label is relevant in context. Measured on a real 37-page consumer repository, with
          # everything else fixed: 102 of 106 criteria ruled, and four the model declined —
          # not for want of a bigger model, and not for volume (a criterion with 516 evidence
          # classes was ruled while one with 141 was not), but because clearing 2700
          # occurrences it has not all read would be a lie.
          #
          # A job red on that motive teaches nobody anything. It does not say « something
          # regressed », it says « these criteria need a human » — true before the run and
          # after it. And a permanent red is worse than a green: it spends the one colour
          # available for a real breakage, of which this lane has real ones to report.
          #
          # What still fails here, deliberately: a dead transport (the Action's own gate on
          # « every adjudication pass failed operationally »), a rendering criterion left open
          # with nothing rendered (`require-rendered`), and the nine-page shape asserted below.
          # Facts about the RUN, never about the verdict.
          #
          # The residue stays NAMED either way — the job summary and the artifact both print
          # « N criteria still to assess », so nothing is hidden by this.
          require-decided: "false"
          undecidable-file: .ultra11y/undecidable-rgaa.json

      - name: Verify the nine-page shape
        run: |
          set -euo pipefail
          node - <<'NODE'
          const grid = require(`${process.cwd()}/audits/pages.json`);
          if (grid.pages.length !== 9) {
            throw new Error(`expected all 9 fixture pages, got ${grid.pages.length}`);
          }
          for (const page of grid.pages) {
            if (page.criteria.length !== 106) {
              throw new Error(`${page.id}: expected 106 criteria, got ${page.criteria.length}`);
            }
          }
          console.log(`verified ${grid.pages.length} pages × 106 RGAA criteria`);
          NODE
