# The ADJUDICATION tier, exercised for real — the half `ci.yml` cannot prove.
#
# `ci.yml` proves the keyless path: with no credential the tier evaporates and the audit still
# ships. It stops there on purpose, because the keyed path costs money on every run — and the
# two tiers do not cost remotely the same:
#
#   api    ~$0.20 per WCAG run, ~$0.50 per RGAA one. One Messages call per batch of 8 criteria
#          over harvested evidence; the worklist is re-sent whole each time and no batch is
#          large enough to earn prompt caching.
#   agent  MEASURED at $21.22 for one RGAA run on Sonnet over a source-only audit (run
#          32363798488): 80 criteria, 243 turns, 30 minutes. Two orders of magnitude above the
#          API tier, and that is the point of it rather than a fault: it OPENS the files each
#          criterion cites, which is what "link purpose IN CONTEXT" actually asks for.
#
# THE 80 IN THAT MEASUREMENT WAS ITSELF A DEFECT, and it is fixed below: the run audited
# sources only, so the rendering criteria reached the model at all — and came back
# `needs-rendered-dom`, correctly and expensively. This workflow serves the fixture and scans it
# before adjudicating, which is what the composite does for every consumer. Measured on run
# 32385981037 (Haiku, 3 passes): the worklist started at 41 instead of 80, the run took 10
# minutes instead of 30, and 7 criteria were left — 10.14, 11.11, 11.12, 12.1, 12.5, 12.9, 12.11.
#
# EVERY ONE OF THOSE SEVEN WAS A TOOL FAILURE, not a model one, and the fix was never a bigger
# model. Haiku is what this workflow is dispatched with, deliberately: what a cheap adjudicator
# cannot do is the measure of what the tool failed to hand it.
#
#   12.1, 12.5     ruled NC with no `file`, and refused. Their NC is shaped like an ABSENCE
#                  (« no second navigation system »), and nothing in the per-criterion brief
#                  said an absence is still observed on an element of a page — because the
#                  brief carried no verdict contract at all (it was rendered `preamble: false`,
#                  which dropped the very rules the gate enforces).
#   11.11, 11.12   ruled `needs-rendered-dom` over capture-anchored evidence, and refused. Same
#                  root cause: the note saying the rendered page is on disk lived in the
#                  preamble the brief did not carry.
#   12.9           never answered. Its subject is a keyboard trap, and the harvest handed it one
#                  anchor: `e.preventDefault();` from a React submit handler. A trap is a
#                  property of the tab ring, so `probeKeyboardTrap` now walks it — 12.9 closes
#                  on the measurement, with no model in the loop.
#   10.14, 12.11   never answered, and could not have been: their subject is CSS-revealed
#                  additional content and no harvester levied any. `additionalContent` does now.
#
# So the fixture is a small SITE, not one page — a menu, a search form, a sitemap page, a
# contact form with format hints and a review step, and a CSS tooltip revealed on hover AND on
# focus. Criteria about an « ensemble de pages » cannot be posed, let alone answered, on a
# single document.
#
# Putting either tier on every push would bill a fleet of PRs for a signal that changes rarely;
# the agent tier would do it at twenty dollars a go. Pair it with `ledger` so the next run
# replays the verdicts instead of buying them again.
#
# ONE PASS IS NOT ENOUGH, AND THAT IS THE DESIGN RATHER THAN A DEFECT. Measured on run
# 32416252443 (Haiku, RGAA, the fixed engine): pass 1 ruled 35 of 38 and the gate refused three
# — 9.4 as an uncited `C`, 10.14 and 12.11 as `needs-rendered-dom` over capture-anchored
# evidence. Each refusal travels back with the criterion, and pass 2 closed all three on 60
# turns; pass 3 found nothing left to do and cost nothing. That round trip IS the mechanism:
# the gate does not merely reject, it tells the next adjudicator what was wrong. So `passes`
# defaults to 3.
#
# So it is dispatched by hand, and it reports the number that actually separates the two
# modes: how many criteria stayed `manual`. That is where the API mode decloses — it rules
# from harvested evidence alone (capped at 30 items per criterion, snippets truncated), while
# the agent mode can open the files, which is what "link purpose IN CONTEXT" really asks for.
#
# It is also the ONLY place `anthropics/claude-code-action` runs in this repository. The
# composite action resolves the credential TWICE, by two different mechanisms — the
# tier-resolution step reads it from the process environment in bash, the `uses:` step reads
# it through the `env` expression context — and only a keyed run exercises the second. That is
# why this file exists rather than a comment asserting the path is fine.
name: Adjudication (keyed)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Adjudication mode to exercise'
        type: choice
        options: [api, agent, both]
        default: both
      standard:
        description: 'Standard to report against'
        type: choice
        options: [wcag, rgaa]
        default: rgaa
      model:
        description: 'Model id for the tier under test. Empty lets each tier choose its own default.'
        type: string
        default: ''
      max-turns:
        description: "Turn budget for the agent tier. Empty derives it from the worklist; a number pins it; 'unlimited' removes the bound entirely (the job's timeout then becomes the only stop)."
        type: string
        default: ''
      passes:
        description: "How many times the agent tier goes round on what is still undecided. The fold is per-verdict, so a later pass only ever costs the residue of the one before it — and stops early when there is none. Three by default because `require-decided` is on: one pass is not enough on this fixture and a run that stopped there would go red for a reason that had nothing to do with the code."
        type: choice
        options: ["1", "2", "3"]
        default: "3"
      timeout:
        description: 'Job ceiling in minutes. GitHub kills a hosted-runner job at 360 whatever this says; only a self-hosted runner goes beyond.'
        type: string
        default: "60"
      require-decided:
        description: "Which completeness bar to hold the grid to. `true` holds the RUN's grid: every criterion of the referential carries a verdict somewhere. `pages` holds EVERY page's grid, which is the bar a page-by-page deliverable is actually read at — a criterion decided on one route and silent on the thirty-six others fails it, and that gap is invisible to `true`. `false` measures a residue you already expect. Never off by accident: a run that leaves seven criteria unruled and reports success is how seven criteria stayed unruled for a month."
        type: choice
        options: ["true", "pages", "false"]
        default: "true"
      undecidable-file:
        description: 'Path to a committed list of criteria this fixture genuinely cannot decide, each with its reason. Empty by default, and it should stay empty: every entry is a criterion the tool failed to give evidence for, and the fix belongs in the engine rather than in an exemption.'
        type: string
        default: ''

# `contents: read` is enough BECAUSE the composite action hands claude-code-action the job's
# own `github.token`. Without that it would mint a GitHub App token over OIDC and this job
# would need `id-token: write` — a dependency worth naming here, since it is decided in a file
# this one only reaches through `uses: ./`.
permissions:
  contents: read

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    # Dispatch-controlled, because with `max-turns: unlimited` this becomes the ONLY thing
    # that stops the run.
    #
    # 360 is not a ceiling this file gets to choose: GitHub terminates a job on a hosted
    # runner at six hours of execution whatever `timeout-minutes` says, and there is no input
    # anywhere that lifts it. A longer run needs a self-hosted runner, where the limit is five
    # days. Setting a bigger number here does not buy time, it only hides where the run died.
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}
    env:
      # BOTH credentials, because the two modes do not accept the same one. `api` calls the
      # Messages API, which takes an ANTHROPIC_API_KEY and nothing else; `agent` shells out to
      # claude-code-action, which also accepts the OAuth token a Pro/Max subscriber mints with
      # `claude setup-token`. Wiring only the first made `mode: agent` unrunnable for a
      # subscriber with no API key at all — and that is the common case for this repository.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The engine is the committed zero-dep bundle, so there is nothing to install — but
      # there IS a floor: package.json declares `engines.node >= 22.18.0`, and a job that
      # never pins Node inherits whatever the runner image happens to ship that week.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # THE BROWSER TIER, so the rendering criteria are given a browser instead of being
      # rediscovered as `needs-rendered-dom` at the end of a paid cascade.
      #
      # It comes from the REPOSITORY'S OWN lockfile — `@playwright/test` and
      # `@axe-core/playwright` are dependencies here — so `scan --runtime local` resolves the
      # same versions whose browsers `playwright install` downloads. This is the pattern the
      # `action` job in ci.yml already proves; `npm i --no-save --omit=dev <pkg>` installs
      # NOTHING for a package already declared in devDependencies, which is how this repository
      # silently degraded to Docker once before.
      - uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The browsers live outside the pnpm store (~/.cache/ms-playwright) and weigh ~170MB —
      # the one download this job makes that the package cache does not cover. Keyed on the
      # lockfile, exactly like `browser-tier` and `action` in ci.yml, so a cache hit skips it.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the browser tier
        # NO --with-deps, for the reason the other two browser jobs in this repository give:
        # it shells out to apt, which on the Azure runners hangs for 30min+ whenever their
        # ubuntu mirror misbehaves — measured twice in one day, once for 3h27. The GitHub
        # ubuntu image already ships every library chromium-for-testing needs.
        run: pnpm exec playwright install chromium

      # THE FIXTURE IS A SITE, and it is served whole.
      #
      # `tests/fixtures/realworld` used to be one page, and a third of the criteria this
      # workflow adjudicates cannot be posed on one page: RGAA 12.1 asks whether an « ensemble
      # de pages » has two navigation systems, 12.5 whether the search engine is reachable
      # identically ACROSS pages, 12.2 and 12.4 whether the navigation sits in the same place on
      # each. Handed a single document, the adjudicator ruled NC on an absence it could not
      # anchor, and the gate refused it — correctly, and at the price of a paid pass.
      #
      # `/` is the entry now, and it resolves to `index.html`, so python never renders its
      # directory listing — which is what used to link `LoginForm.tsx` and make Chromium start
      # a download instead of a navigation. No page links to that file either, for the same
      # reason: it is audited as SOURCE, never crawled.
      - name: Serve the fixture site
        run: |
          nohup python3 -m http.server 8932 --directory tests/fixtures/realworld > /tmp/fixture.log 2>&1 &
          deadline=$(( SECONDS + 30 ))
          until curl -sSf -o /dev/null http://127.0.0.1:8932/; do
            if [ $SECONDS -ge $deadline ]; then echo "::error::the fixture server never came up"; exit 1; fi
            sleep 1
          done

      - name: Refuse early if the credential this mode needs is missing
        env:
          MODE: ${{ inputs.mode }}
        run: |
          # Split by mode, because the two tiers do not accept the same credential and a
          # blanket "ANTHROPIC_API_KEY or bust" locks an OAuth-only repository out of the very
          # path it came here to test.
          if [ "$MODE" != 'agent' ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::mode=$MODE exercises the API tier, which accepts nothing but ANTHROPIC_API_KEY — set that secret, or dispatch with mode=agent"
            exit 1
          fi
          if [ "$MODE" != 'api' ] && [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::mode=$MODE exercises the agent tier; set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (\`claude setup-token\`)"
            exit 1
          fi

      # The baseline: what the deterministic engine alone leaves undecided. Every number below
      # is read against this one — and it is valid for BOTH modes, because each `uses: ./`
      # below re-audits the fixture from scratch (`Audit the code` carries no `if:` and writes
      # audits/audit-latest.json with --out audits), so each mode starts from this same grid.
      - name: Measure the unruled criteria BEFORE adjudication
        id: before
        run: |
          # THE BASELINE HAS TO INCLUDE THE SCAN, or the delta below credits the model with
          # work a browser did. Each `uses: ./` step re-audits AND re-scans from scratch, so
          # the number a tier starts from is the post-render one — measured on this fixture:
          # 80 criteria to adjudicate from source alone, 41 once a page is scanned, 38 once the
          # keyboard-trap probe closes 12.9. Reading the agent tier against 80 would report 42
          # criteria it never touched.
          #
          # THE AUDIT RUNS TWICE, and that is not a slip. The first pass has no captures to read;
          # the scan then writes `.ultra11y/pages/`, and the second pass ingests them — which is
          # what anchors a criterion's evidence in the rendered DOM instead of only in the
          # source. It is exactly what the composite action does internally, and a baseline that
          # skipped it would measure a different grid from the one each tier is handed.
          node scripts/ultra11y.mjs audit tests/fixtures/realworld --out audits --json > /dev/null
          node scripts/ultra11y.mjs scan --crawl http://127.0.0.1:8932/ --max 8 --runtime local --cwd "$PWD" \
            --merge audits/audit-latest.json --out audits
          node scripts/ultra11y.mjs audit tests/fixtures/realworld --out audits --json > /dev/null
          node scripts/ultra11y.mjs scan --crawl http://127.0.0.1:8932/ --max 8 --runtime local --cwd "$PWD" \
            --merge audits/audit-latest.json --out audits
          node scripts/ultra11y.mjs verify --manual --in audits/audit-latest.json \
            --standard '${{ inputs.standard }}' --out /tmp/before --json > /tmp/before.json
          n=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/before.json","utf8")).count')
          echo "manual=$n" >> "$GITHUB_OUTPUT"
          echo "unruled before (source + rendered page): $n"

      - name: Adjudicate with the API
        if: inputs.mode == 'api' || inputs.mode == 'both'
        uses: ./
        with:
          paths: tests/fixtures/realworld
          standard: ${{ inputs.standard }}
          since: ""
          fail-on: ""
          sarif: "false"
          comment: "false"
          adjudicate: api
          adjudicate-model: ${{ inputs.model }}
          adjudicate-max-turns: ${{ inputs.max-turns }}
          adjudicate-passes: ${{ inputs.passes }}
          artifact-name: adjudication-api
          # RENDER BEFORE ADJUDICATING. The composite runs `Scan the pages` before the
          # adjudication tier on purpose, so by the time a model is asked anything, computed
          # contrast, 320px reflow, 200% zoom, text spacing and the tab ring are already
          # measured — and the criteria that need them never reach the worklist. `local`, never
          # `auto`: Docker cannot reach the host's loopback, and an `auto` that degrades there
          # fails with an obscure ERR_CONNECTION_REFUSED instead of an explicit missing-tier
          # error.
          #
          # `crawl`, not `urls`: the site-level criteria are decided across pages, so a scan
          # that renders one of them leaves the other four unmeasured and the grid says so.
          crawl: http://127.0.0.1:8932/
          crawl-max: "8"
          runtime: local

      # Measured HERE, not at the end. The agent step below is a fresh `uses: ./` whose own
      # audit step rewrites audits/audit-latest.json from scratch, discarding these verdicts —
      # so a single reading taken after both steps reports the agent pass twice and labels the
      # result `both`. Two tiers, two measurements.
      - name: What the API tier decided
        id: after_api
        if: inputs.mode == 'api' || inputs.mode == 'both'
        run: |
          node scripts/ultra11y.mjs verify --manual --in audits/audit-latest.json \
            --standard '${{ inputs.standard }}' --out /tmp/after-api --json > /tmp/after-api.json
          n=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/after-api.json","utf8")).count')
          echo "manual=$n" >> "$GITHUB_OUTPUT"
          echo "unruled after api: $n"

      - name: Adjudicate with an agent
        if: inputs.mode == 'agent' || inputs.mode == 'both'
        uses: ./
        with:
          paths: tests/fixtures/realworld
          standard: ${{ inputs.standard }}
          since: ""
          fail-on: ""
          sarif: "false"
          comment: "false"
          adjudicate: agent
          adjudicate-model: ${{ inputs.model }}
          adjudicate-max-turns: ${{ inputs.max-turns }}
          adjudicate-passes: ${{ inputs.passes }}
          artifact-name: adjudication-agent
          # Same rendered pages as the API tier above, so the two modes are compared over the
          # same evidence.
          crawl: http://127.0.0.1:8932/
          crawl-max: "8"
          runtime: local
          # THE GATE THIS WHOLE WORKFLOW EXISTS FOR. Without it the job reports success on a
          # grid nobody filled — which is precisely what happened on run 32385981037: green,
          # with seven criteria « à évaluer » and a warning nobody was watching. It goes on the
          # AGENT step alone; the `api` step above is the comparison tier and gating it would
          # stop the run before the tier under test had even started.
          require-decided: ${{ inputs.require-decided }}
          undecidable-file: ${{ inputs.undecidable-file }}

      # `always()`, and that is now load-bearing rather than tidy: `require-decided` on the step
      # above turns an incomplete grid into a FAILED step, and without this the run would go red
      # while saying nothing at all about which criteria are open — the one fact anybody reading
      # a red adjudication needs. The condition it used to carry is folded in.
      - name: What the agent tier decided
        id: after_agent
        if: always() && (inputs.mode == 'agent' || inputs.mode == 'both')
        run: |
          if [ ! -f audits/audit-latest.json ]; then
            echo "::warning::no audit was produced — the agent tier died before writing one"
            exit 0
          fi
          node scripts/ultra11y.mjs verify --manual --in audits/audit-latest.json \
            --standard '${{ inputs.standard }}' --out /tmp/after-agent --json > /tmp/after-agent.json
          n=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/after-agent.json","utf8")).count')
          ids=$(node -p 'const j=JSON.parse(require("fs").readFileSync("/tmp/after-agent.json","utf8"));(j.items||[]).map(x=>x.criteriaId).join(", ")')
          echo "manual=$n" >> "$GITHUB_OUTPUT"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "unruled after agent: $n${ids:+ — $ids}"

      # The metric. A tier that ruled on nothing is a tier that cost money to change nothing,
      # and it should be visible as such rather than buried in a green check. `always()` so a
      # tier that died still leaves its baseline on the summary.
      - name: Report what each tier actually decided
        if: always()
        env:
          BEFORE: ${{ steps.before.outputs.manual }}
          AFTER_API: ${{ steps.after_api.outputs.manual }}
          AFTER_AGENT: ${{ steps.after_agent.outputs.manual }}
          AGENT_IDS: ${{ steps.after_agent.outputs.ids }}
        run: |
          {
            echo "### Adjudication (${{ inputs.mode }}, ${{ inputs.standard }})"
            echo ""
            echo "| tier | criteria left to assess |"
            echo "| --- | ---: |"
            echo "| before (engine alone) | ${BEFORE:-—} |"
            if [ -n "${AFTER_API:-}" ]; then echo "| after \`api\` | $AFTER_API |"; fi
            if [ -n "${AFTER_AGENT:-}" ]; then echo "| after \`agent\` | $AFTER_AGENT |"; fi
            if [ -n "${AGENT_IDS:-}" ]; then
              echo ""
              echo "Still « à évaluer » after the agent tier: ${AGENT_IDS}."
              echo ""
              echo "Each one is a criterion the TOOL failed to settle, not a model that gave up:"
              echo "either its harvest carries no anchor on the subject the criterion asks about,"
              echo "or its brief never stated the rule the gate then refused it on. Read the"
              echo "refusal printed above before reaching for another pass or a bigger model."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          for pair in "api:${AFTER_API:-}" "agent:${AFTER_AGENT:-}"; do
            tier=${pair%%:*}
            after=${pair#*:}
            if [ -z "$after" ]; then continue; fi
            if [ "$after" -ge "${BEFORE:-0}" ]; then
              echo "::warning::the $tier adjudication decided nothing — ${BEFORE:-?} criteria before, $after after"
            fi
          done
