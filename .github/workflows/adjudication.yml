# One paid, exhaustive path. The ordinary CI replays the committed ledger for free; this
# manual workflow deliberately starts from an empty run ledger so it proves that the keyed
# Claude transport (`judge --runner claude`), the browser tier and the fold still work together
# on a real crawl. It drives the engine CLI from the checkout, step by step.
#
# Cost controls are fixed rather than dispatch inputs: Haiku, low effort, batches of eight,
# and up to three adjudication passes over residue only.
#
# THE CLI CEILING IS PER INVOCATION. Not per pass, and not per run. 106 RGAA criteria make at
# most 14 batches, so $0.35 puts a NOMINAL full pass around $4.90 and three nominal passes
# around $14.70 -- nominal, because nothing enforces either number. A transport retry starts a
# fresh process with a fresh ceiling, and a batch the ceiling aborts is halved and requeued with
# a fresh ceiling per half. Read those figures as an order of magnitude, never as a cap.
#
# And size the ceiling above what one batch actually costs at the chosen model and effort:
# below that, every batch aborts and is paid for anyway. $0.35 is calibrated for Haiku at `low`
# on this nine-page fixture (measured: ~$2.9 for 13 batches). It is NOT a figure to copy onto a
# bigger model, a higher effort, or a repository with more evidence per criterion. One audit
# and one unbounded crawl; there is no baseline pass, refutation fold or runner matrix
# duplicating that work.
name: Adjudication (keyed)

on:
  workflow_dispatch: {}

permissions:
  contents: read

# A second paid dispatch waits instead of racing the first and buying the same verdicts twice.
concurrency:
  group: adjudication-keyed
  cancel-in-progress: false

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # This repository uses the Claude subscription/OAuth transport. Do not expose an API key:
      # it would make the billing route ambiguous and is unnecessary for `--runner claude`.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Serve the nine-page fixture
        run: |
          nohup python3 -m http.server 8932 --directory tests/fixtures/realworld > /tmp/fixture.log 2>&1 &
          deadline=$(( SECONDS + 30 ))
          until curl -sSf -o /dev/null http://127.0.0.1:8932/; do
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::the fixture server never came up"
              cat /tmp/fixture.log
              exit 1
            fi
            sleep 1
          done

      - name: Require the Claude subscription credential
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is required for the keyed Haiku run"
            exit 1
          fi

      # A SCRATCH PREFIX, never the checkout: the engine installs nothing itself, and the
      # adjudicator is the caller's dependency, not the repository's.
      - name: Install the Claude Code CLI
        run: |
          prefix="$RUNNER_TEMP/a11y-adjudicator"
          mkdir -p "$prefix"
          npm i --no-save --prefix "$prefix" "@anthropic-ai/claude-code@2" > /dev/null
          echo "ULTRA11Y_CLAUDE_BIN=$prefix/node_modules/.bin/claude" >> "$GITHUB_ENV"

      # ONE AUDIT, ONE SCAN, no page cap. `scan --merge` audits the snapshots it just wrote and
      # carries them into the adjudication worklist.
      - name: Audit and crawl the fixture
        run: |
          node scripts/ultra11y.mjs audit tests/fixtures/realworld --standard rgaa --out audits --json > /dev/null
          node scripts/ultra11y.mjs scan --crawl http://127.0.0.1:8932/ --max 0 --standard rgaa \
            --runtime local --cwd "$PWD" --merge audits/audit-latest.json --out audits

      # FRESH_LEDGER does not exist before this step, so no committed verdict can make the paid
      # path a no-op; accepted verdicts are nevertheless recorded there and survive in the
      # artifact. Up to three passes: `judge` re-derives the worklist from what is STILL manual
      # on every call, so a later pass costs the residue — and invokes no model at all once
      # there is none.
      #
      # What fails here, deliberately: a dead transport (every pass failed operationally), and
      # the provider circuit breaker. Never a criterion the model declined — an adjudicator that
      # answers `manual / undecidable` on a judgment criterion is behaving correctly, and the
      # residue stays NAMED in the grid below.
      - name: Adjudicate with Haiku (batched, bounded)
        run: |
          args=(--in audits/audit-latest.json --out audits --apply --runner claude --grain batch)
          args+=(--standard rgaa --lang fr --model haiku --effort low --max-budget-usd 0.35)
          args+=(--ledger audits/fresh-rgaa-ledger.json)
          ok=1
          for i in 1 2 3; do
            pass_log="$RUNNER_TEMP/ultra11y-judge-$i.log"
            set +e
            node scripts/ultra11y.mjs judge "${args[@]}" 2>&1 | tee "$pass_log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" = '0' ]; then
              ok=0
            else
              echo "ultra11y: adjudication pass $i did not apply cleanly (exit $status)."
            fi
            # Another process would forget the prior 429/5xx and pay for the same bounded
            # retries all over again: stop the outer loop on provider saturation.
            if grep -Eqi 'provider unavailable|api status 429|http 429|rate.?limit|service unavailable|overload' "$pass_log"; then
              echo "::error::provider unavailable — stopping before pass $((i + 1)) instead of repeating failed paid requests."
              break
            fi
          done
          if [ "$ok" != '0' ]; then
            echo "::error::every adjudication pass failed operationally. The model did not adjudicate this audit."
            exit 1
          fi

      - name: Per-page grid
        run: |
          node scripts/ultra11y.mjs pages --in audits/audit-latest.json --standard rgaa --lang fr \
            --json --out audits > /dev/null
          node scripts/ultra11y.mjs pages --in audits/audit-latest.json --standard rgaa --lang fr \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # NOT `--require-decided`: this lane must not go red because a model said « I do not
      # know ». The instrument gate still holds — a rendering criterion left open with nothing
      # rendered is a fact about the RUN, never about the verdict.
      - name: The rendering criteria were given a browser
        run: |
          node scripts/ultra11y.mjs check --in audits/audit-latest.json \
            --standard rgaa --require-rendered

      - name: Verify the nine-page shape
        run: |
          set -euo pipefail
          node - <<'NODE'
          const grid = require(`${process.cwd()}/audits/pages.json`);
          if (grid.pages.length !== 9) {
            throw new Error(`expected all 9 fixture pages, got ${grid.pages.length}`);
          }
          for (const page of grid.pages) {
            if (page.criteria.length !== 106) {
              throw new Error(`${page.id}: expected 106 criteria, got ${page.criteria.length}`);
            }
          }
          console.log(`verified ${grid.pages.length} pages × 106 RGAA criteria`);
          NODE

      - name: Upload the adjudicated audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adjudication-rgaa-haiku
          path: |
            audits/audit-latest.json
            audits/pages.json
            audits/fresh-rgaa-ledger.json
          if-no-files-found: ignore
          retention-days: 14
